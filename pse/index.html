      <div style="display:grid;gap:10px">${OBSTACLES.map((o, i) => {
        const cur = (g.obstacles || []).find(x => x.type === o) || {};
        return `<div style="display:grid;grid-template-columns:170px 1fr 140px;gap:10px;align-items:center">
          <label style="display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer">
            <input type="checkbox" ${cur.type?"checked":""} data-act="obs-toggle" data-o="${esc(o)}"> ${esc(o)}</label>
          <input type="text" placeholder="How will you overcome it?" value="${esc(cur.solution||"")}" data-act="obs-sol" data-o="${esc(o)}" ${cur.type?"":"disabled"}>
          <input type="date" value="${esc(cur.date||"")}" data-act="obs-date" data-o="${esc(o)}" ${cur.type?"":"disabled"}>
        </div>`; }).join("")}</div>`
    : goalStep === 5 ? (() => {
        const checks = Store.checkGoal(g);
        return `<div style="display:grid;gap:16px">
          <div style="background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:16px">
            <div style="font-size:17px;font-weight:620;margin-bottom:10px">${esc(g.title || "Untitled goal")}</div>
            ${[["Specific","specific"],["Measurable","measurable"],["Achievable","achievable"],["Relevant","relevant"]].map(([l,k]) =>
              `<div style="display:grid;grid-template-columns:110px 1fr;gap:12px;font-size:13.5px;padding:5px 0">
                <b style="color:var(--ink-400);font-weight:600">${l}</b><span>${esc(g[k] || "—")}</span></div>`).join("")}
            <div style="display:grid;grid-template-columns:110px 1fr;gap:12px;font-size:13.5px;padding:5px 0">
              <b style="color:var(--ink-400);font-weight:600">Time-bound</b><span>${esc(g.deadline || "No deadline")}</span></div>
          </div>
          <div><div style="font-size:11.5px;color:var(--ink-400);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:8px">Coach check</div>
            <div class="coach">${checks.map(c => `<div class="coach-item ${c.ok?"yes":"no"}">
              <span class="ic">${c.ok ? ic("check") : "!"}</span>
              <div><div class="t">${esc(c.label)}</div>${!c.ok && c.fix ? `<div class="fix">${esc(c.fix)}</div>` : ""}</div></div>`).join("")}</div></div>
        </div>`; })()
    : `<div style="display:grid;gap:16px">${step.fields.map(([k, label, hint, type]) => `
        <div class="field"><label>${esc(label)}</label>
          ${type === "area" ? `<textarea placeholder="${esc(hint)}" data-act="gd" data-k="${k}">${esc(g[k]||"")}</textarea>`
            : type === "date" ? `<input type="date" value="${esc(g[k]||"")}" data-act="gd" data-k="${k}">`
            : `<input type="text" placeholder="${esc(hint)}" value="${esc(g[k]||"")}" data-act="gd" data-k="${k}">`}
          ${hint && type !== "text" ? `<div class="help">${esc(hint)}</div>` : ""}</div>`).join("")}</div>`;

  return { title: g.id ? "Edit goal" : "New SMART goal", sub: "Step " + (goalStep+1) + " of " + GOAL_STEPS.length + " — " + step.k, crumb: ["PSE","Goals","Builder"], html: `
    <div class="card" style="max-width:820px">
      <div class="wiz-steps">${GOAL_STEPS.map((st, i) => `<button class="wiz-step ${i===goalStep?"on":""} ${i<goalStep?"ok":""}" data-act="gstep" data-i="${i}">
        <b>${i < goalStep ? "✓" : i+1}</b>${esc(st.k)}</button>`).join("")}</div>
      <div class="card-b">${body}</div>
      <div class="card-f" style="display:flex;justify-content:space-between;gap:10px;background:var(--surface)">
        <button class="btn" data-act="gstep" data-i="${goalStep-1}" ${goalStep===0?"disabled":""}>Back</button>
        <div style="display:flex;gap:8px">
          <button class="btn btn-ghost" data-act="gcancel">Cancel</button>
          ${goalStep < GOAL_STEPS.length-1
            ? `<button class="btn btn-primary" data-act="gstep" data-i="${goalStep+1}" ${goalStep===0&&!filled("title")?"disabled":""}>Continue ${ic("arrow")}</button>`
            : `<button class="btn btn-primary" data-act="gsave">Save goal</button>`}
        </div></div>
    </div>` };
}

let cw1Tab = "checklist";
V.cw1 = function () {
  const s = Store.get(), p = Store.cw1Progress();

          <div class="check-row ${s.cw1.checklist[i.id]?"on":""}" data-act="cw1check" data-id="${i.id}">

      <div class="card"><div class="card-h"><h3>Coach — what is still missing</h3></div>
        <div class="card-b"><div class="coach">${Store.checkCW1().map(c => `<div class="coach-item ${c.ok?"yes":"no"}">

    body = `<div class="card"><div class="card-h"><div><h3>Ten-slide plan</h3>
      <p class="sub">Plan what each slide must answer before you design anything. A slide counts as planned once it has real notes.</p></div>
      <span class="pill ${Store.slidesDone()===10?"ok":"acc"}">${Store.slidesDone()}/10 planned</span></div>
      ${PSE.cw1Slides.map(sl => { const v = s.cw1.slides[sl.n] || {}; const ok = (v.notes||"").trim().length > 20;
        return `<div style="border-top:1px solid var(--line);padding:15px 18px">
          <div style="display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap">
            <div><div style="font-size:13.5px;font-weight:570">Slide ${sl.n} — ${esc(sl.title)}</div>
              <div style="font-size:12.5px;color:var(--ink-400)">${esc(sl.purpose)}</div></div>
            <span class="pill ${ok?"ok":""}">${ok?"Planned":"Empty"}</span></div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin:9px 0">${sl.ask.map(q => `<span class="pill">${esc(q)}</span>`).join("")}</div>
          <textarea placeholder="Research notes for this slide — what will you actually say?" data-set="cw1.slides.${sl.n}.notes" data-quiet="1">${esc(v.notes||"")}</textarea>
          <input type="text" style="margin-top:8px" placeholder="Sources supporting this slide" value="${esc(v.sources||"")}" data-set="cw1.slides.${sl.n}.sources" data-quiet="1">
        </div>`; }).join("")}</div>`;
  }

  if (cw1Tab === "sources") {
    body = `<div class="split">
      <div class="card"><div class="card-h"><div><h3>Reference library</h3>
        <p class="sub">Westminster Harvard format is generated for you. Add sources as you research, not the night before.</p></div>
        <span class="pill ${s.cw1.sources.length>=5?"ok":"warn"}">${s.cw1.sources.length} source${s.cw1.sources.length===1?"":"s"}</span></div>
        ${s.cw1.sources.length ? s.cw1.sources.map(src => `<div style="border-top:1px solid var(--line);padding:14px 18px">
          <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
            <div style="min-width:0"><div style="font-size:13.5px;font-weight:560">${esc(src.title||"Untitled")}</div>
              <div style="font-size:12px;color:var(--ink-400)">${esc(src.author||"No author")} · ${esc(src.year||"n.d.")}</div></div>

          <div class="ref-out" style="margin-top:9px">${esc(Store.harvard(src))}</div>
          <div style="font-size:12px;color:var(--ink-400);margin-top:6px">In-text: <code>${esc(Store.citation(src))}</code></div>
        </div>`).join("") : `<div class="empty"><h4>No sources saved</h4><p>Add the sources you actually used. Five or more shows real research.</p></div>`}
      </div>
      <div class="card"><div class="card-h"><h3>Add a source</h3></div>
        <div class="card-b" style="display:grid;gap:11px">
          <div class="field"><label>Title</label><input type="text" id="sr-title" placeholder="Occupational Outlook Handbook: Data Scientists"></div>
          <div class="field"><label>Author or organisation</label><input type="text" id="sr-author" placeholder="US Bureau of Labor Statistics"></div>
          <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px">
            <div class="field"><label>Year</label><input type="text" id="sr-year" placeholder="2024"></div>
            <div class="field"><label>Accessed</label><input type="date" id="sr-accessed" value="${new Date().toISOString().slice(0,10)}"></div></div>
          <div class="field"><label>URL</label><input type="url" id="sr-url" placeholder="https://www.bls.gov/ooh/"></div>
          <button class="btn btn-primary" data-act="savesource">${ic("plus")} Add to library</button>
          <div style="border-top:1px solid var(--line);padding-top:11px">
            <div style="font-size:12px;color:var(--ink-400);margin-bottom:7px">Or add a recommended resource:</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">${PSE.resources.slice(0,6).map(r => `
              <button class="chip" data-act="addsource" data-res="${r.id}">${esc(r.name)}</button>`).join("")}</div></div>
        </div></div></div>`;
  }

  if (cw1Tab === "practice") {
    const runs = s.cw1.practice;
    body = `<div class="split">
      <div class="grid" style="gap:16px">
        <div class="card"><div class="card-h"><div><h3>Presentation timer</h3>
          <p class="sub">Your individual share is 5–7 minutes. The clock turns green inside the window and red past it.</p></div></div>
          <div class="card-b" style="text-align:center;padding:30px">
            <div class="timer-face" id="tface">00:00</div>
            <div class="timer-band">Target window: 5:00 – 7:00</div>
            <div style="display:flex;gap:9px;justify-content:center;margin-top:20px">
              <button class="btn btn-primary" data-act="tstart" id="tbtn">${ic("play")} Start</button>
              <button class="btn" data-act="treset">Reset</button></div>
          </div></div>
        <div class="card"><div class="card-h"><div><h3>Self-evaluation</h3>
          <p class="sub">Score yourself out of 5 immediately after the run, while it is fresh.</p></div></div>
          <div class="card-b" style="display:grid;gap:12px">
            ${PSE.practiceCriteria.map(c => `<div>
              <div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(c.label)}
                <span style="color:var(--ink-400);font-size:12px">— ${esc(c.hint)}</span></span>
                <b id="pv-${c.id}" style="font-variant-numeric:tabular-nums">3</b></div>
              <input type="range" min="1" max="5" step="1" value="3" data-act="pscore" data-id="${c.id}"></div>`).join("")}
            <div class="field"><label>One thing to improve next time</label>
              <input type="text" id="p-improve" placeholder="Slow down on the job-market slide"></div>
            <button class="btn btn-primary" data-act="savepractice">Save this practice run</button>
          </div></div>
      </div>
      <div class="card"><div class="card-h"><div><h3>Practice history</h3><p class="sub">${runs.length} run${runs.length===1?"":"s"} recorded.</p></div></div>
        ${runs.length ? runs.slice().reverse().map(r => `<div class="row">
          <div class="grow"><div class="t">${Math.floor(r.seconds/60)}:${String(r.seconds%60).padStart(2,"0")}
            <span class="pill ${r.seconds>=300&&r.seconds<=420?"ok":"warn"}" style="margin-left:6px">${r.seconds>=300&&r.seconds<=420?"In window":"Out of window"}</span></div>
            <div class="s">${esc(r.date)} · average ${r.avg}/5${r.improvement?" · "+esc(r.improvement):""}</div></div></div>`).join("")
          : `<div class="empty"><h4>No runs yet</h4><p>Rehearsing to a timer is the single highest-value thing you can do before CW1.</p></div>`}
      </div></div>`;
  }

  return { title: "CW1 — Group Presentation", sub: career ? "Researching " + career.title : "Choose a career from the explorer to begin.", crumb: ["PSE","CW1"], html: `
    <div class="grid g4">
      <div class="card stat"><div class="k">Research</div><div class="v">${p.pct}%</div><div class="d">${p.done}/${p.total} requirements</div></div>
      <div class="card stat"><div class="k">Slides planned</div><div class="v">${Store.slidesDone()}<span style="font-size:14px;color:var(--ink-400)">/10</span></div><div class="d">Notes written</div></div>
      <div class="card stat"><div class="k">References</div><div class="v">${s.cw1.sources.length}</div><div class="d">Harvard formatted</div></div>
      <div class="card stat"><div class="k">Practice runs</div><div class="v">${s.cw1.practice.length}</div><div class="d">Timed rehearsals</div></div>
    </div>
    ${!career ? `<div class="nextstep"><div class="ic">${ic("compass")}</div><div style="flex:1">

    <div class="chipbar">${tabs.map(([k,l]) => `<button class="chip ${cw1Tab===k?"on":""}" data-act="cw1tab" data-k="${k}">${esc(l)}</button>`).join("")}</div>
    ${body}` };
};

V.cw2 = function () {
  const s = Store.get(), p = Store.cw2Progress();
  const val = id => (s.cw2.sections[id] || {}).value || "";
  const done = id => !!(s.cw2.sections[id] || {}).done;
  const hp = PSE.headlineParts;
  const pick = (k, i) => hp[k][i % hp[k].length];
  const suggestions = [0,1,2].map(i => `${pick("status",i)} | ${pick("target",i)} | ${pick("strength",i)}`);

  return { title: "CW2 — LinkedIn", sub: "Build the profile section by section. The preview on the right updates as you type.", crumb: ["PSE","CW2"], html: `
    <div class="grid g3">
      <div class="card stat"><div class="k">Profile completion</div><div class="v">${p.pct}%</div><div class="d">${p.done}/${p.total} sections</div></div>
      <div class="card stat"><div class="k">Headline</div><div class="v" style="font-size:16px">${val("headline") ? esc(val("headline").slice(0,34)) + (val("headline").length>34?"…":"") : "Not written"}</div><div class="d">${val("headline").length}/220 characters</div></div>
      <div class="card stat"><div class="k">AI Literacy certificate</div><div class="v" style="font-size:18px">${done("ai")?"Added":"Not added"}</div><div class="d">Required for CW2</div></div>
    </div>

    <div class="split">
      <div class="grid" style="gap:16px">
        <div class="card"><div class="card-h"><div><h3>Headline builder</h3>
          <p class="sub">Combine your status, your target profession and your strongest skill. Edit any suggestion — do not just paste it.</p></div></div>
          <div class="card-b" style="display:grid;gap:10px">
            ${suggestions.map(sug => `<div style="display:flex;gap:9px;align-items:center;justify-content:space-between;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px">
              <span style="font-size:13px">${esc(sug)}</span>
              <button class="btn btn-sm" data-act="usehead" data-v="${esc(sug)}">Use</button></div>`).join("")}
            <div class="field"><label>Your headline</label>
              <input type="text" maxlength="220" placeholder="Undergraduate Student | Aspiring Data Analyst | SQL & Python" value="${esc(val("headline"))}" data-set="cw2.sections.headline.value" data-quiet="1">
              <div class="help">${val("headline").length}/220 characters. LinkedIn shows roughly the first 120 in search results.</div></div>
          </div></div>

        <div class="card"><div class="card-h"><div><h3>Profile sections</h3>
          <p class="sub">Each section is weighted towards your completion score.</p></div>
          <span class="pill ${p.pct===100?"ok":"acc"}">${p.pct}%</span></div>
          ${PSE.linkedinSections.filter(x => x.id !== "headline").map(sec => {
            const v = s.cw2.sections[sec.id] || {};
            const ok = sec.type === "check" ? !!v.done : !!(v.value && v.value.trim().length >= (sec.min || 20));
            return `<div style="border-top:1px solid var(--line);padding:15px 18px">
              <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap">
                <div><div style="font-size:13.5px;font-weight:560">${esc(sec.label)}</div>
                  <div style="font-size:12.5px;color:var(--ink-400);max-width:62ch">${esc(sec.help)}</div></div>
                <span class="pill ${ok?"ok":""}">${ok?"Complete":sec.weight+" pts"}</span></div>
              ${sec.type === "check"
                ? `<label style="display:flex;gap:9px;align-items:center;margin-top:10px;font-size:13.5px;cursor:pointer">
                    <input type="checkbox" ${v.done?"checked":""} data-act="cw2check" data-id="${sec.id}"> Done — added to my profile</label>`
                : `<textarea style="margin-top:10px" placeholder="Write this section…" data-set="cw2.sections.${sec.id}.value" data-quiet="1">${esc(v.value||"")}</textarea>`}
            </div>`; }).join("")}
        </div>
      </div>

      <div class="li-prev">
        <div class="li-cover"></div>
        <div class="li-body">
          <div class="li-avatar">${done("photo") ? ic("check") : (s.profile.name ? esc(s.profile.name.trim()[0].toUpperCase()) : "?")}</div>
          <div class="li-name">${esc(s.profile.name || "Your name")}</div>
          <div class="li-head" id="li-headline">${esc(val("headline") || "Your headline will appear here")}</div>
          <div class="li-meta">${esc(PSE.meta.institution)}${s.profile.major ? " · " + esc(s.profile.major) : ""}</div>
          ${["about","education","experience","skills"].map(id => {
            const sec = PSE.linkedinSections.find(x => x.id === id), v = val(id);
            return `<div class="li-sec ${v?"":"missing"}"><h5>${esc(sec.label)}</h5>
              <p id="li-${id}">${v ? esc(v.slice(0,260)) + (v.length>260?"…":"") : "Not written yet"}</p></div>`; }).join("")}
        </div>
      </div>
    </div>` };
};

let reflDraft = null;

    const r = reflDraft;
    const words = Store.wordCount([r.what,r.learn,r.skills,r.career,r.next].join(" "));

    const checks = Store.checkReflection(r);
    return { title: r.id ? "Edit reflection" : "New reflection", sub: "Structured reflection — the five prompts are what makes it assessable.", crumb: ["PSE","Reflections","Write"], html: `
      <div class="split">
        <div class="card">
          <div class="card-b" style="display:grid;gap:14px">
            <div class="grid" style="grid-template-columns:1fr 220px;gap:12px">
              <div class="field"><label>Title</label>
                <input type="text" placeholder="Guest lecture with a data team lead" value="${esc(r.title||"")}" data-act="rd" data-k="title"></div>
              <div class="field"><label>Type</label><select data-act="rd" data-k="type">
                ${PSE.reflectionTypes.map(t => `<option value="${t.id}" ${r.type===t.id?"selected":""}>${esc(t.label)}</option>`).join("")}</select></div>
            </div>
            ${PSE.reflectionPrompts.map(p => `<div class="field"><label>${esc(p.label)}</label>
              <textarea placeholder="${esc(p.hint)}" data-act="rd" data-k="${p.key}">${esc(r[p.key]||"")}</textarea></div>`).join("")}

          <div class="card-f" style="display:flex;justify-content:space-between;align-items:center;background:var(--surface)">
            <span class="wordcount ${cls}" id="rwords">${words} / 70–100 words${words<70?" — keep going":words>100?" — tighten it":" — in range"}</span>
            <span style="display:flex;gap:8px"><button class="btn btn-ghost" data-act="rcancel">Cancel</button>
            <button class="btn btn-primary" data-act="rsave">Save reflection</button></span></div>
        </div>
        <div class="card"><div class="card-h"><div><h3>Coach</h3><p class="sub">Checks the structure. It will not write it for you.</p></div></div>
          <div class="card-b"><div class="coach" id="rcoach">${checks.map(c => `<div class="coach-item ${c.ok?"yes":"no"}">
            <span class="ic">${c.ok?ic("check"):"!"}</span><div><div class="t">${esc(c.label)}</div>
            ${!c.ok&&c.fix?`<div class="fix">${esc(c.fix)}</div>`:""}</div></div>`).join("")}</div></div></div>
      </div>` };
  }

  return { title: "Reflections", sub: "Turn experiences into evidence. Each LinkedIn reflection should land between 70 and 100 words.", crumb: ["PSE","Reflections"], html: `

    <div class="grid g2">
      ${PSE.reflectionTypes.map(t => { const have = s.reflections.filter(r => r.type === t.id).length;
        return `<div class="card" style="cursor:pointer" data-act="newrefl" data-type="${t.id}"><div class="card-b" style="display:flex;justify-content:space-between;align-items:center;gap:12px">
          <div><div style="font-size:13.5px;font-weight:560">${esc(t.label)}</div>
            <div style="font-size:12px;color:var(--ink-400)">${have ? have + " written" : "Not written yet"}</div></div>
          <span class="pill ${have?"ok":""}">${have?ic("check"):ic("plus")}</span></div></div>`; }).join("")}
    </div>
    ${s.reflections.length ? `<div class="card"><div class="card-h"><h3>Your reflections</h3></div><div class="list">
      ${s.reflections.map(r => { const w = Store.wordCount([r.what,r.learn,r.skills,r.career,r.next].join(" "));
        return `<div class="row"><div class="grow"><div class="t">${esc(r.title||"Untitled")}</div>
          <div class="s">${esc((PSE.reflectionTypes.find(t=>t.id===r.type)||{}).label||"")} · ${esc(r.date||"")}</div></div>
          <span class="wordcount ${w>=70&&w<=100?"ok":"warn"}">${w} words</span>
          <button class="btn btn-sm" data-act="editrefl" data-id="${r.id}">Edit</button>
          <button class="btn btn-sm btn-danger" data-act="delrefl" data-id="${r.id}">${ic("trash")}</button></div>`; }).join("")}
    </div></div>` : ""}` };
};

V.resources = function () {

      <div style="display:flex;gap:8px;margin-top:2px">
        <a class="btn btn-sm btn-primary" href="${esc(r.url)}" target="_blank" rel="noopener">Open ${ic("arrow")}</a>
        <button class="btn btn-sm" data-act="addsource" data-res="${r.id}">Add to CW1 references</button></div>
    </div></div>`).join("")}</div>

    <div class="panel-dark">
      <div style="padding:18px 20px;border-bottom:1px solid var(--dark-line)"><h3 style="font-size:15px">AI and the future of work</h3>
        <p class="sub" style="font-size:12.5px;margin-top:3px">What is changing, and which human skills gain value as a result.</p></div>
      <div class="shift">${PSE.aiShift.map(r => `<div class="shift-row">
        <span class="a">${esc(r.today)}</span><span class="ar">${ic("arrow")}</span><span class="b">${esc(r.future)}</span>

/* ============================ PROFILE ===================================== */
V.profile = function () {
  const s = Store.get(), R = Store.readiness(), rows = Store.skillRows();
  const strengths = rows.filter(r => r.current >= 7).sort((a,b) => b.current-a.current).slice(0,4);
  const gaps = rows.filter(r => r.gap > 0).sort((a,b) => b.gap-a.gap).slice(0,4);
  const short = s.shortlist.map(id => PSE.careers.find(c => c.id === id)).filter(Boolean);

  return { title: "My Career", sub: "Everything you have built, in one place.", crumb: ["PSE","Profile"], html: `
    <div class="split">
      <div class="grid" style="gap:16px">
        <div class="card"><div class="card-h"><h3>About you</h3></div>
          <div class="card-b grid g2" style="gap:12px">
            <div class="field"><label>Name</label><input type="text" placeholder="Your full name" value="${esc(s.profile.name)}" data-set="profile.name" data-quiet="1"></div>
            <div class="field"><label>Major</label><input type="text" placeholder="BSc Business Management" value="${esc(s.profile.major)}" data-set="profile.major" data-quiet="1"></div>
            <div class="field"><label>Target entry-level role</label><input type="text" placeholder="Junior Data Analyst" value="${esc(s.profile.targetRole)}" data-set="profile.targetRole" data-quiet="1"></div>
            <div class="field"><label>Career interests</label><input type="text" placeholder="Fintech, analytics, consulting" value="${esc(s.profile.interests)}" data-set="profile.interests" data-quiet="1"></div>
          </div></div>

        <div class="card"><div class="card-h"><h3>Shortlisted careers</h3></div>
          ${short.length ? `<div class="list">${short.map(c => `<div class="row">
            <div class="grow"><div class="t">${esc(c.title)}</div><div class="s">${esc(c.industry)} · ${esc(c.growth)} growth · ${money(c.salary)}</div></div>
            <button class="btn btn-sm" data-act="go" data-route="#/career/${c.id}">Open</button></div>`).join("")}</div>`
            : `<div class="empty"><h4>Nothing shortlisted</h4><p>Shortlist careers from the explorer to compare them here.</p>
              <button class="btn btn-primary" data-act="go" data-route="#/careers">Explore careers</button></div>`}</div>

        <div class="card"><div class="card-h"><h3>Your data</h3></div>
          <div class="card-b" style="display:grid;gap:11px">
            <p style="font-size:13px;color:var(--ink-500)">Everything you enter is saved in this browser only — no account, no server. Export a backup before switching computers.</p>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <button class="btn" data-act="export">Export backup</button>
              <button class="btn" data-act="importopen">Import backup</button>
              <button class="btn btn-danger" data-act="resetall">Reset everything</button></div>
            <textarea id="importbox" hidden placeholder="Paste an exported backup here, then press Import"></textarea>
            <button class="btn btn-primary" id="importgo" hidden data-act="importgo">Import</button>
          </div></div>
      </div>

      <div class="grid" style="gap:16px">
        <div class="card"><div class="card-b" style="text-align:center;padding:22px">
          ${ring(R.total, 128, "of 100")}
          <div style="font-size:13px;font-weight:560;margin-top:10px">Career readiness</div>
          <div style="font-size:12px;color:var(--ink-400)">${esc(s.profile.targetRole || "Set a target role to sharpen this")}</div></div></div>
        <div class="card"><div class="card-h"><h3>Top strengths</h3></div><div class="card-b" style="display:grid;gap:8px">
          ${strengths.length ? strengths.map(x => `<div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(x.name)}</span><b>${x.current}/10</b></div>`).join("")
            : '<div style="font-size:13px;color:var(--ink-400)">Rate your skills to see this.</div>'}</div></div>
        <div class="card"><div class="card-h"><h3>Skills to improve</h3></div><div class="card-b" style="display:grid;gap:8px">
          ${gaps.length ? gaps.map(x => `<div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(x.name)}</span><span class="pill warn">gap ${x.gap}</span></div>`).join("")
            : '<div style="font-size:13px;color:var(--ink-400)">No gaps recorded yet.</div>'}</div></div>
      </div>
    </div>` };
};

</script>
<script>
/* =============================================================================
   ask.js — "Ask PSE": the deterministic assistant.

   store.js already contains the best reasoning in the project — checkGoal,
   checkReflection, checkCW1, nextStep and the readiness model — but those rules
   are scattered across four forms and cannot be reached from anywhere else.
   This module gives them one address. It runs those same functions over the
   live workspace at the moment the student clicks a question, and renders the
   result in the coach idiom the rest of the product already uses.

   It is deliberately NOT a chatbot: there is no free-text box, no model, no
   network and no generated prose. Every sentence below is either a fixed
   string written here or a value read out of Store. That is the academic
   integrity argument, and it is also why it can run from a USB stick.

   A            open or close the panel
   Esc          close (handled in capture so presenter mode never sees it)
   ========================================================================== */

PSEFX.ask = (function () {
  "use strict";

  /* Local, so the module does not depend on views.js having been parsed. */
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const CHECK = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 10.4 4 4 8-8.4"/></svg>';
  const ARROW = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h11M11 5.6 15.4 10 11 14.4"/></svg>';

  /* Which slide must carry the evidence for a ticked research requirement.
     A tick is a claim; this map is what lets the panel ask for the receipt. */
  const SLIDE_OF = { career: 1, research: 2, resp: 3, skills: 4, edu: 5,
                     demand: 6, outlook: 6, salary: 6, ai: 7, plan: 8 };

  const PART_ROUTE = { explore: "#/careers", skills: "#/skills", goals: "#/goals",
    cw1: "#/cw1", practice: "#/cw1", cw2: "#/cw2", reflect: "#/reflections" };
  const PART_CTA = { explore: "Open Career Explorer", skills: "Open Skills", goals: "Open Goals",
    cw1: "Open CW1", practice: "Open Practice", cw2: "Open LinkedIn", reflect: "Open Reflections" };

  let api = null, root = null, opener = null, answerEl = null;
  let open = false, current = null, routeAtOpen = null, timers = [];

  const reduced = () => (window.matchMedia
    ? matchMedia("(prefers-reduced-motion: reduce)").matches
    : !!(api && api.reduced));

  const plural = (n, one, many) => n + " " + (n === 1 ? one : (many || one + "s"));

  /* --- the questions -------------------------------------------------------
     Each build() runs live Store functions and returns
     { lead, rows: [{ tone, t, d, sub, list, route, cta }], tally }.
     A row's tone is the coach vocabulary already in app.css: yes / no, plus
     "tip" for a recommendation, which is neither a pass nor a failure. ---- */

  function qNext() {
    const ns = Store.nextStep();
    return {
      lead: "One recommendation, chosen by whatever is most blocking right now.",
      rows: [{ tone: "tip", t: ns.title, d: ns.why, route: ns.route, cta: ns.cta }],
      tally: "Recomputed every time you open this panel."
    };
  }

  function qCW1() {
    const s = Store.get(), rows = [];

    Store.checkCW1().forEach(c => {
      rows.push({ tone: c.ok ? "yes" : "no", t: c.label, d: c.fix, route: "#/cw1", cta: "Open CW1" });
    });

    /* The tick is free; the evidence is not. Anything marked complete whose
       slide is still empty gets named here rather than quietly counted. */
    PSE.cw1Checklist.forEach(item => {
      const n = SLIDE_OF[item.id];
      if (!n || !s.cw1.checklist[item.id]) return;
      const slide = s.cw1.slides[n] || {};
      const notes = (slide.notes || "").trim();
      if (notes.length >= 40) return;
      const srcs = (slide.sources || "").split(/[;,]/).map(x => x.trim()).filter(Boolean).length;
      rows.push({
        tone: "no",
        t: item.label + " is ticked, but slide " + n + " " +
           (notes.length ? "has only " + plural(notes.length, "character") + " of notes" : "has no notes") +
           (srcs ? " and " + plural(srcs, "source") + " attached" : " and no source attached"),
        d: "A tick with nothing behind it is not evidence. " + item.help,
        route: "#/cw1", cta: "Open CW1"
      });
    });

    return {
      lead: "Your checklist, your slide notes and your source library, read together.",
      rows,
      tally: "Evidence: " + s.cw1.sources.length + " of 5 Harvard sources · " +
             Store.slidesDone() + " of " + PSE.cw1Slides.length + " slides with research notes."
    };
  }

  function qGoals() {
    const goals = Store.get().goals;
    const lead = "Every goal is run through the eight SMART tests in store.js. Failures are named; nothing is rewritten for you.";
    if (!goals.length) {
      return { lead, rows: [{ tone: "no", t: "You have not written a SMART goal yet",
        d: "The goal builder walks through each letter of SMART and checks your wording as you type.",
        route: "#/goals", cta: "Open Goal Builder" }] };
    }
    let failing = 0;
    const rows = goals.map(g => {
      const fails = Store.checkGoal(g).filter(c => !c.ok);
      if (fails.length) failing++;
      return {
        tone: fails.length ? "no" : "yes",
        t: g.title || "Untitled goal",
        d: fails.length
          ? plural(fails.length, "test") + " of the eight " + (fails.length === 1 ? "fails" : "fail") + ":"
          : "Every SMART test passes.",
        sub: g.deadline ? "Deadline " + g.deadline + " · " + (g.progress || 0) + "% complete"
                        : "No deadline set · " + (g.progress || 0) + "% complete",
        list: fails.map(f => f.label + (f.fix ? " — " + f.fix : "")),
        route: "#/goals", cta: "Open Goals"
      };
    });
    return { lead, rows,
      tally: failing ? plural(failing, "goal") + " of " + goals.length + " still " + (failing === 1 ? "fails" : "fail") + " at least one test."
                     : "All " + goals.length + " goals pass every test." };
  }

  function qRefl() {
    const refl = Store.get().reflections;
    const lead = "Each reflection is checked against the five prompts, the word range and the first-person rule.";
    if (!refl.length) {
      return { lead, rows: [{ tone: "no", t: "You have not written a reflection yet",
        d: "Reflections are assessed evidence of professional growth. Aim for 70–100 words each.",
        route: "#/reflections", cta: "Open Reflections" }] };
    }
    const rows = refl.map(r => {
      const fails = Store.checkReflection(r).filter(c => !c.ok);
      const w = Store.wordCount([r.what, r.learn, r.skills, r.career, r.next].join(" "));
      const range = w < 70 ? plural(w, "word") + " — " + (70 - w) + " short of the 70-word minimum"
                  : w > 100 ? plural(w, "word") + " — " + (w - 100) + " over the 100-word LinkedIn target"
                  : plural(w, "word") + " — inside the 70–100 range";
      return {
        tone: fails.length ? "no" : "yes",
        t: r.title || "Untitled reflection",
        d: fails.length ? plural(fails.length, "check") + " still " + (fails.length === 1 ? "fails" : "fail") + ":" : "Every check passes.",
        sub: range,
        list: fails.map(f => f.label + (f.fix ? " — " + f.fix : "")),
        route: "#/reflections", cta: "Open Reflections"
      };
    });
    return { lead, rows,
      tally: Store.reflectionsInRange() + " of " + refl.length + " reflections reach the 70 words the score requires." };
  }

  function qLinkedIn() {
    const s = Store.get(), rows = [];
    PSE.linkedinSections.forEach(sec => {
      const v = s.cw2.sections[sec.id] || {};
      const min = sec.min || 20;
      const done = sec.type === "check" ? !!v.done : !!(v.value && v.value.trim().length >= min);
      if (done) return;
      const len = (v.value || "").trim().length;
      rows.push({
        tone: "no",
        t: sec.label + " — worth " + plural(sec.weight, "point"),
        d: sec.help,
        sub: sec.type === "check" ? "Not ticked yet."
                                  : len + " of the " + min + " characters this section needs.",
        route: "#/cw2", cta: "Open LinkedIn Builder"
      });
    });
    const c2 = Store.cw2Progress();
    if (!rows.length) {
      rows.push({ tone: "yes", t: "Nothing outstanding here",
        d: "All " + PSE.linkedinSections.length + " LinkedIn sections meet their minimum.", route: "#/cw2", cta: "Open LinkedIn Builder" });
    }
    return {
      lead: "Every section that does not yet meet its own minimum, heaviest weighting first in the builder.",
      rows,
      tally: c2.done + " of " + c2.total + " sections complete · profile strength " + c2.pct + "%."
    };
  }

  function qGaps() {
    const all = Store.skillRows();
    const unrated = all.filter(r => !r.current || !r.target).length;
    const gapped = all.slice().sort((a, b) => b.gap - a.gap).filter(r => r.gap > 0).slice(0, 3);
    const lead = "Your " + all.length + " skills, sorted by the distance between where you are and where you said you need to be.";

    /* An unrated skill is not a skill without a gap — it is a skill the model
       cannot see. Say that, rather than reporting an empty list as good news. */
    if (!gapped.length) {
      const rows = [unrated
        ? { tone: "no",
            t: plural(unrated, "skill") + " still " + (unrated === 1 ? "has" : "have") + " no rating",
            d: "A skill needs both a current level and a target before it can show a gap." +
               (unrated === all.length ? "" : " Nothing you have rated is below its target."),
            route: "#/skills", cta: "Open Skills" }
        : { tone: "yes", t: "Nothing outstanding here",
            d: "Every skill is at or above the target you set for it.",
            route: "#/skills", cta: "Open Skills" }];
      return { lead, rows };
    }

    return {
      lead, rows: gapped.map(r => ({
        tone: "no",
        t: r.name + " — gap of " + r.gap,
        d: "Now " + r.current + "/10, target " + r.target + "/10." + (r.why ? " You wrote: " + r.why : ""),
        list: r.actions || [],
        route: "#/skills", cta: "Open Skills"
      })),
      tally: unrated ? plural(unrated, "skill") + " not yet rated, so " + (unrated === 1 ? "it is" : "they are") + " not in this list." : ""
    };
  }

  function qScore() {
    const R = Store.readiness();
    return {
      lead: "Career readiness " + R.total + " / 100. Seven parts, each earned from work already recorded in this workspace.",
      rows: PSE.readinessParts.map(p => {
        const got = R.parts[p.id] || { earned: 0, max: p.max, detail: "" };
        /* Part-earned is progress, not a failure — only an untouched part
           gets the warning mark, or the breakdown reads as an accusation. */
        return {
          tone: got.earned >= got.max ? "yes" : got.earned > 0 ? "tip" : "no",
          t: p.label + " — " + got.earned + " of " + got.max,
          d: got.detail,
          sub: p.help,
          route: PART_ROUTE[p.id], cta: PART_CTA[p.id]
        };
      }),
      tally: "No part of this number is typed in by hand."
    };
  }

  const QUESTIONS = [
    { id: "next",  q: "What should I do next?",           build: qNext },
    { id: "cw1",   q: "What is missing from my CW1?",     build: qCW1 },
    { id: "goals", q: "Are my goals SMART?",              build: qGoals },
    { id: "refl",  q: "What is weak in my reflections?",  build: qRefl },
    { id: "li",    q: "How do I strengthen my LinkedIn?", build: qLinkedIn },
    { id: "gaps",  q: "Where are my biggest skill gaps?", build: qGaps },
    { id: "score", q: "What is my score made of?",        build: qScore }
  ];

  /* --- rendering ----------------------------------------------------------- */

  function rowHTML(r) {
    const tone = r.tone === "yes" ? "yes" : r.tone === "tip" ? "tip" : "no";
    const icon = tone === "yes" ? CHECK : tone === "tip" ? ARROW : "!";
    return '<div class="coach-item ask-row ask-in ' + tone + '">' +
      '<span class="ic" aria-hidden="true">' + icon + '</span>' +
      '<div class="ask-body-col">' +
        '<div class="t">' + esc(r.t) + '</div>' +
        (r.d   ? '<div class="fix">' + esc(r.d) + '</div>' : "") +
        (r.sub ? '<div class="ask-sub">' + esc(r.sub) + '</div>' : "") +
        (r.list && r.list.length
          ? '<ul class="ask-list">' + r.list.map(x => '<li>' + esc(x) + '</li>').join("") + '</ul>' : "") +
        (r.route
          ? '<button class="btn btn-sm ask-jump" data-act="go" data-route="' + esc(r.route) + '">' +
              esc(r.cta || "Open") + ARROW + '</button>' : "") +
      '</div></div>';
  }

  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  /* Rows arrive one finding at a time so the presenter can narrate each one.
     Capped at twelve: past that it would stop pacing and start stalling. */
  function reveal() {
    const rows = answerEl.querySelectorAll(".ask-row");
    if (reduced()) { rows.forEach(el => el.classList.remove("ask-in")); return; }
    rows.forEach((el, i) => {
      timers.push(setTimeout(() => el.classList.remove("ask-in"), Math.min(i, 11) * 60));
    });
  }

  function ask(id) {
    const item = QUESTIONS.find(q => q.id === id) || QUESTIONS[0];
    current = item.id;
    root.querySelectorAll(".ask-q").forEach(b => b.classList.toggle("on", b.getAttribute("data-q") === current));

    let out;
    try { out = item.build(); }
    catch (e) {
      out = { lead: "", rows: [{ tone: "no", t: "This check could not run",
        d: "Your work is safe — it is stored in this browser, not in this panel.", route: "#/", cta: "Back to Dashboard" }] };
      console.warn("[fx] ask: " + item.id + " failed:", e && e.message);
    }

    clearTimers();
    answerEl.innerHTML =
      '<h3 class="ask-atitle">' + esc(item.q) + '</h3>' +
      (out.lead ? '<p class="ask-lead">' + esc(out.lead) + '</p>' : "") +
      '<div class="coach ask-rows">' + out.rows.map(rowHTML).join("") + '</div>' +
      (out.tally ? '<p class="ask-tally">' + esc(out.tally) + '</p>' : "");
    answerEl.scrollTop = 0;
    reveal();
  }

  /* The rules, written out. Inspectable logic is the whole argument, so these
     are the literal thresholds the checks use — not a paraphrase of them. */
  function rulesHTML() {
    const parts = PSE.readinessParts.map(p => p.label + " " + p.max).join(", ");
    const rules = [
      "Measurable fails until the text contains a digit and reaches 10 characters.",
      "Specific needs 25 characters; Achievable, Relevant and Actions need 20 each; Time-bound needs a date; at least one obstacle needs a solution longer than 10 characters.",
      "A reflection must answer all " + PSE.reflectionPrompts.length + " prompts with 8 words or more each and be written in the first person — the words I, my or me. It counts towards your score at 70 words; the coach flags anything outside 70–140; 70–100 is the LinkedIn post target.",
      "Five or more Harvard sources counts as real research. The score awards one point per source, up to four.",
      "A LinkedIn About section needs 60 characters; every other written section needs 20. The photo and the AI Literacy certificate are simple ticks.",
      "A slide counts as planned once its notes pass 20 characters.",
      "Career readiness is out of 100: " + parts + "."
    ];
    return '<details class="ask-rules"><summary>How each check works</summary>' +
      '<ul>' + rules.map(r => '<li>' + esc(r) + '</li>').join("") + '</ul></details>';
  }

  /* --- shell --------------------------------------------------------------- */

  function build() {
    root = document.createElement("div");
    root.id = "pse-ask";
    root.className = "ask";
    root.hidden = true;
    root.setAttribute("data-fx-own", "ask");
    root.setAttribute("role", "dialog");
    root.setAttribute("aria-modal", "true");
    root.setAttribute("aria-labelledby", "pse-ask-title");
    root.innerHTML =
      '<div class="ask-panel">' +
        '<header class="ask-head">' +
          '<div>' +
            '<h2 id="pse-ask-title">Ask PSE</h2>' +
            '<p class="ask-honest">These answers are produced by fixed rules running in this browser. ' +
            'No model, no network, no generated text — and it will never write your coursework for you.</p>' +
          '</div>' +
          '<button class="btn btn-sm ask-x" type="button">Close</button>' +
        '</header>' +
        rulesHTML() +
        '<div class="ask-body">' +
          '<nav class="ask-qs" aria-label="Questions">' +
            QUESTIONS.map(q => '<button type="button" class="chip ask-q" data-q="' + q.id + '">' + esc(q.q) + '</button>').join("") +
          '</nav>' +
          '<div class="ask-answer" aria-live="polite"></div>' +
        '</div>' +
      '</div>';
    document.body.appendChild(root);
    answerEl = root.querySelector(".ask-answer");

    /* The topbar is static chrome — render() never replaces it — so one
       injection at boot is enough and there is nothing to redo per page. */
    const row = document.querySelector(".topbar-row");
    if (row) {
      opener = document.createElement("button");
      opener.type = "button";
      opener.className = "btn btn-sm ask-open";
      opener.setAttribute("data-fx-own", "ask");
      opener.setAttribute("aria-haspopup", "dialog");
      opener.setAttribute("aria-expanded", "false");
      opener.title = "Ask PSE — press A";
      opener.textContent = "Ask PSE";
      const menu = row.querySelector(".railtoggle");
      if (menu) row.insertBefore(opener, menu); else row.appendChild(opener);
      opener.addEventListener("click", () => setOpen(!open));
    }

    root.addEventListener("click", e => {
      if (e.target === root) { setOpen(false); return; }                 /* scrim */
      if (e.target.closest(".ask-x")) { setOpen(false); return; }
      const q = e.target.closest(".ask-q");
      if (q) { ask(q.getAttribute("data-q")); return; }
      /* A jump is an answer acted on: close, and let app.js's delegated
         handler receive the same click and navigate. Never stop it here. */
      if (e.target.closest("[data-act]")) setOpen(false);
    });
  }

  function setOpen(v) {
    if (v === open) return;
    open = v;
    document.body.classList.toggle("ask-open", open);
    if (opener) opener.setAttribute("aria-expanded", open ? "true" : "false");

    if (open) {
      routeAtOpen = location.hash || "#/";
      root.hidden = false;
      /* Never leave the panel empty on a projector: run the first question. */
      ask(current || QUESTIONS[0].id);
      if (reduced()) root.classList.add("on");
      /* One frame to let the panel exist before it transitions. Guarded, because
         a close can land between the two frames and must win. */
      else requestAnimationFrame(() => requestAnimationFrame(() => { if (open) root.classList.add("on"); }));
      const first = root.querySelector(".ask-q.on") || root.querySelector(".ask-q");
      if (first) first.focus({ preventScroll: true });
    } else {
      clearTimers();
      root.classList.remove("on");
      root.hidden = true;
      if (opener) opener.focus({ preventScroll: true });
    }
  }

  function onKey(e) {
    const tag = (e.target && e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || tag === "textarea" || (e.target && e.target.isContentEditable)) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;

    if (e.key === "a" || e.key === "A") { setOpen(!open); e.preventDefault(); e.stopPropagation(); return; }
    /* Capture phase, so presenter mode's Escape and app.js's Journey Escape
       never also fire while this panel owns the room. */
    if (open && e.key === "Escape") { setOpen(false); e.preventDefault(); e.stopPropagation(); }
  }

  return {
    init(a) {
      if (root) return;                 /* boot twice, decorate once */
      api = a;
      build();
      /* Registered raw rather than through api.on: FX.boot()'s fallback api
         drops the options argument, and capture is the whole point here. */
      document.addEventListener("keydown", onKey, true);
    },

    /* The panel is an overlay over a page it did not render. If something else
       navigated underneath it, the answer on screen is about the wrong screen. */
    onRender(pageRoot, ctx) {
      if (open && ctx && ctx.route !== routeAtOpen) setOpen(false);
    }
  };
})();

</script>
<script>
/* =============================================================================
   compare.js — career comparison.

   The contract names career comparison three times and nothing in the repo
   answers it: the explorer collects a shortlist, the profile page says
   "shortlist careers from the explorer to compare them here", and then lists
   them. This module is the missing join. It is also the only place where the
   two data sets the student owns — the career library and their own
   self-assessment — are read against each other, which is the difference
   between displaying research and reasoning over it.

   It adds no route. The panel is injected into two pages that already exist,
   and every button in it uses a data-act app.js already handles, so nothing
   outside this file and its stylesheet changes.

   Honesty rule, enforced throughout: every salary and growth figure in the
   library is a US Bureau of Labor Statistics proxy occupation, so no figure is
   ever rendered without the note naming that occupation and its year.
   ========================================================================== */

PSEFX.compare = (function () {

  /* Growth is drawn against a fixed ceiling rather than against the largest
     value in this particular shortlist: a fixed scale means two different
     shortlists can be read against each other. The ceiling is read off the
     library itself and rounded up to the next 5, so the strongest figure in
     the data (+33%, Cybersecurity Analyst) fills the bar without ever being
     clamped — a clamped bar would draw +33% and +25% at the same length, which
     is the one thing a chart of these figures must never do. Computed lazily,
     because this file must not depend on load order. */
  let ceiling = 0;
  function growthCeiling() {
    if (!ceiling) {
      const top = PSE.careers.reduce((m, c) => Math.max(m, growthOf(c)), 0);
      ceiling = Math.max(25, Math.ceil(top / 5) * 5);
    }
    return ceiling;
  }

  /* Chart geometry, in viewBox units. The svg is scaled to the card, so these
     are proportions rather than pixels. */
  const W = 720, LABEL = 168, VALUE = 86, ROW = 60, PAD = 8, BAR_H = 14;
  const BARW = W - LABEL - VALUE;

  /* Last painted bar fractions, keyed by career id. Module scope, not api
     state, so it survives the teardown between renders — that is what lets an
     added career grow into place while the bars already on screen only move if
     the rescale actually moved them. */
  const geom = new Map();

  const NWORD = { 1: "one", 2: "two", 3: "three", 4: "four" };

  const growthOf = c => parseFloat(c.growth) || 0;

  /* Education is a paragraph; the comparison only wants the route. */
  const firstSentence = t => ((String(t || "").match(/^[^.]+\./) || [String(t || "")])[0]).trim();

  function shortlisted() {
    return Store.get().shortlist
      .map(id => PSE.careers.find(c => c.id === id))
      .filter(Boolean)
      .slice(0, 4);
  }

  /* --- skills fit ---------------------------------------------------------
     A required skill counts as met only when the student has set a target and
     reached it: an unrated skill is not a pass, it is an unknown. --------- */
  function fit(c, rows) {
    const req = c.skillIds.map(id => rows.find(r => r.id === id)).filter(Boolean);
    const met = req.filter(r => r.target > 0 && r.current >= r.target);
    const short = req.filter(r => !(r.target > 0 && r.current >= r.target))
                     .sort((a, b) => b.gap - a.gap);
    return { req, met, short };
  }

  const shortLabel = r => r.target > 0
    ? r.name + " " + r.current + "→" + r.target
    : r.name + " (not rated)";

  /* --- chart --------------------------------------------------------------- */

  function chartSVG(list, maxSal) {
    const h = ROW * list.length - 8;
    const track = y => `<rect x="${LABEL}" y="${y}" width="${BARW}" height="${BAR_H}" rx="3" fill="var(--surface-2)"/>`;

    let s = `<svg class="fx-cmp-chart" viewBox="0 0 ${W} ${h}" role="img" data-fx-own="compare"
      aria-label="Median salary and projected growth for the careers on your shortlist">`;
    s += `<line x1="${LABEL - .5}" y1="0" x2="${LABEL - .5}" y2="${h}" stroke="var(--line)" stroke-width="1"/>`;

    list.forEach((c, i) => {
      const y = PAD + i * ROW, y2 = y + BAR_H + 10;
      s += `<text class="fx-cmp-name" x="${LABEL - 12}" y="${y + BAR_H + 5}" text-anchor="end">${esc(c.title)}</text>`;
      s += track(y) + track(y2);
      s += `<rect class="fx-cmp-bar" data-c="${c.id}" data-m="sal" x="${LABEL}" y="${y}" width="0" height="${BAR_H}" rx="3" fill="var(--s1)">
        <title>${esc(c.title)} — ${money(c.salary)}. ${esc(c.salaryNote)}.</title></rect>`;
      s += `<text class="fx-cmp-val" data-c="${c.id}" data-m="sal" x="${LABEL + 7}" y="${y + BAR_H / 2}">${money(c.salary)}</text>`;
      s += `<rect class="fx-cmp-bar" data-c="${c.id}" data-m="grw" x="${LABEL}" y="${y2}" width="0" height="${BAR_H}" rx="3" fill="var(--s3)">
        <title>${esc(c.title)} — ${esc(c.growth)} projected growth. ${esc(c.growthNote)}.</title></rect>`;
      s += `<text class="fx-cmp-val" data-c="${c.id}" data-m="grw" x="${LABEL + 7}" y="${y2 + BAR_H / 2}">${esc(c.growth)}</text>`;
    });

    return s + "</svg>";
  }

  function place(b, f) {
    const w = Math.max(0, f) * BARW;
    b.rect.setAttribute("width", w.toFixed(2));
    b.val.setAttribute("x", (LABEL + w + 7).toFixed(2));
  }

  /* Bars only move when the number behind them moved. Revisiting the page with
     the same shortlist repaints silently; adding a career grows its pair from
     zero and slides the others to their new share of the rescaled axis. */
  function grow(panel, list, maxSal, api) {
    const bars = [], next = new Map();

    list.forEach((c, i) => {
      const prev = geom.get(c.id);
      const to = { sal: c.salary / maxSal, grw: Math.min(1, growthOf(c) / growthCeiling()) };
      next.set(c.id, to);
      ["sal", "grw"].forEach(m => {
        const rect = panel.querySelector('rect.fx-cmp-bar[data-c="' + c.id + '"][data-m="' + m + '"]');
        const val = panel.querySelector('text.fx-cmp-val[data-c="' + c.id + '"][data-m="' + m + '"]');
        if (rect && val) bars.push({ rect, val, i, from: prev ? prev[m] : 0, to: to[m] });
      });
    });

    geom.clear();
    next.forEach((v, k) => geom.set(k, v));

    const moving = bars.filter(b => Math.abs(b.to - b.from) > 0.001);
    if (api.reduced || !moving.length) { bars.forEach(b => place(b, b.to)); return; }

    bars.forEach(b => place(b, moving.indexOf(b) >= 0 ? b.from : b.to));
    const D = 0.42, STAG = 0.07;
    api.raf(t => {
      let done = true;
      moving.forEach(b => {
        const p = Math.max(0, Math.min(1, (t - b.i * STAG) / D));
        if (p < 1) done = false;
        place(b, b.from + (b.to - b.from) * api.ease.out(p));
      });
      if (done) { moving.forEach(b => place(b, b.to)); return false; }
    });
  }

  /* --- panel --------------------------------------------------------------- */

  function tableHTML(list, rows) {
    const head = list.map(c =>
      `<th scope="col"><button class="btn btn-sm btn-ghost fx-cmp-open" data-act="go" data-route="#/career/${c.id}">${esc(c.title)}</button></th>`).join("");

    const row = (label, cell) =>
      `<tr><th scope="row">${esc(label)}</th>${list.map(cell).join("")}</tr>`;

    const fits = list.map(c => fit(c, rows));

    return `<div class="fx-cmp-scroll"><table class="tbl fx-cmp-tbl">
      <thead><tr><th scope="col" class="fx-cmp-corner">Compare on</th>${head}</tr></thead>
      <tbody>
        ${row("Demand", c => `<td>${demandPill(c.demand)}</td>`)}
        ${row("AI impact", c => `<td>${aiPill(c.ai)}</td>`)}
        ${row("Career level", c => `<td>${esc(c.level)}</td>`)}
        ${row("Education route", c => `<td>${esc(firstSentence(c.education))}</td>`)}
        ${row("Projected growth", c => `<td><b>${esc(c.growth)}</b><div class="fx-cmp-note">${esc(c.growthNote)}</div></td>`)}
        ${row("Median salary", c => `<td><b>${money(c.salary)}</b><div class="fx-cmp-note">${esc(c.salaryNote)}</div></td>`)}
        ${row("Skills fit", (c, i) => {
          const f = fits[i];
          return `<td><b>${f.met.length} of ${f.req.length} required skills at target</b>${
            f.short.length ? `<div class="fx-cmp-note">Short on ${f.short.map(shortLabel).map(esc).join(", ")}</div>` : ""}</td>`;
        })}
      </tbody>
      <tfoot><tr><td></td>${list.map(c => `<td class="fx-cmp-acts">
        <button class="btn btn-sm btn-primary" data-act="setcw1career" data-id="${c.id}">Use as my CW1 career</button>
        <button class="btn btn-sm" data-act="shortlist" data-id="${c.id}" data-stop="1">Remove</button></td>`).join("")}</tr></tfoot>
    </table></div>`;
  }

  /* One sentence, assembled from the data and nothing else. */
  function conclusion(list, rows) {
    const best = list.reduce((a, c) => growthOf(c) > growthOf(a) ? c : a, list[0]);
    const n = NWORD[list.length] || String(list.length);

    const tally = new Map();
    list.forEach(c => fit(c, rows).short.forEach(r => {
      const e = tally.get(r.id) || { row: r, n: 0 };
      e.n += 1; tally.set(r.id, e);
    }));
    const ranked = [...tally.values()].sort((a, b) => (b.row.gap - a.row.gap) || (b.n - a.n));
    const worst = ranked.find(e => e.row.gap > 0);
    const unrated = ranked.find(e => e.row.target === 0);

    if (worst) return { text: `${best.title} has the strongest outlook of your ${n}, but you are short on ${worst.row.name} — that gap is your goal.`,
      cta: "Turn that gap into a goal", route: "#/goals" };
    if (unrated) return { text: `${best.title} has the strongest outlook of your ${n}, but ${unrated.row.name} is still unrated — rate it before you choose.`,
      cta: "Open Skills", route: "#/skills" };
    return { text: `${best.title} has the strongest outlook of your ${n}, and you are at target on every skill these careers require.`,
      cta: "Open Goals", route: "#/goals" };
  }

  function panelHTML(list, rows, maxSal) {
    const shared = PSE.skills.filter(s => list.every(c => c.skillIds.includes(s.id)));
    const c = conclusion(list, rows);

    return `<div class="card-h"><div><h3>Compare your shortlist</h3>
        <p class="sub">${list.length} career${list.length === 1 ? "" : "s"} side by side. Choosing one is the reasoning CW1 is marked on — this is the evidence for it.</p></div></div>
      <div class="card-b fx-cmp-b">
        <div class="fx-cmp-legend">
          <span><i style="background:var(--s1)"></i>Median salary</span>
          <span><i style="background:var(--s3)"></i>Projected growth, scaled to ${growthCeiling()}%</span>
        </div>
        <div class="fx-cmp-scroll">${chartSVG(list, maxSal)}</div>
        <p class="fx-cmp-prov">Both figures are US Bureau of Labor Statistics proxy occupations. The exact occupation and year sits under every figure in the table.</p>
        ${tableHTML(list, rows)}
        <div class="fx-cmp-shared">
          ${shared.length
            ? `<div class="fx-cmp-chips">${shared.map(s => `<span class="pill acc">${esc(s.name)}</span>`).join("")}</div>
               <p class="fx-cmp-note">Required by all of these — worth building whichever you choose.</p>`
            : `<p class="fx-cmp-note">These careers share no required skill, so your shortlist spans different skill sets.</p>`}
        </div>
        <div class="fx-cmp-end">
          <p>${esc(c.text)}</p>
          <button class="btn btn-sm btn-primary" data-act="go" data-route="${c.route}">${esc(c.cta)}</button>
        </div>
      </div>`;
  }

  function liteHTML(n) {
    return n === 1
      ? "Shortlist a second career to compare them."
      : "Shortlist two careers to compare them side by side.";
  }

  /* --- placement ----------------------------------------------------------- */

  /* Ten engineers are building in parallel, so "the first card" means the first
     card the view itself rendered — anything another module injected is skipped
     rather than used as an anchor. */
  const mine = el => !el.closest('[data-fx-own]:not([data-fx-own="compare"])');

  function hostFor(root, route) {
    if (route === "#/careers") {
      const filter = [...root.querySelectorAll(".card")].find(mine);   /* the filter card */
      return filter ? { anchor: filter, mode: "after" } : null;
    }
    /* profile: inside the card that already promises a comparison */
    const h3 = [...root.querySelectorAll(".card .card-h h3")]
      .find(el => el.textContent.trim() === "Shortlisted careers" && mine(el));
    const card = h3 && h3.closest(".card");
    return card ? { anchor: card, mode: "append" } : null;
  }

  function mount(node, host) {
    if (host.mode === "after") host.anchor.insertAdjacentElement("afterend", node);
    else host.anchor.appendChild(node);
  }

  /* --- provenance on the explorer cards ------------------------------------
     Nothing visible is added to a card; the proxy occupation behind the growth
     figure simply becomes one hover away instead of one page away. -------- */
  function stampCards(root) {
    root.querySelectorAll(".career-card").forEach(card => {
      if (card.closest('[data-fx-own]:not([data-fx-own="compare"])')) return;
      const route = card.getAttribute("data-route") || "";
      const c = PSE.careers.find(x => "#/career/" + x.id === route);
      if (!c || !c.growthNote) return;
      card.querySelectorAll(".tags .pill").forEach(p => {
        /* A pill another module has taken over is that module's to label. */
        if (p.closest('[data-fx-own]:not([data-fx-own="compare"])')) return;
        if (p.textContent.trim() === c.growth + " growth") p.setAttribute("title", c.growth + " — " + c.growthNote);
      });
    });
  }

  return {
    onRender(root, ctx, api) {
      const route = ctx.route;
      if (route !== "#/careers" && route !== "#/profile") return;
      if (route === "#/careers") stampCards(root);

      const host = hostFor(root, route);
      if (!host) return;

      const list = shortlisted();

      /* A career dropped from the shortlist forgets its geometry, so putting it
         back later grows it from zero again rather than snapping it in. */
      [...geom.keys()].forEach(id => { if (!list.some(c => c.id === id)) geom.delete(id); });

      if (list.length < 2) {
        /* An empty comparison is worse than none, so this is one quiet line —
           except on the profile page with nothing shortlisted, where the
           existing empty state already says exactly this. */
        if (route === "#/profile" && !list.length) return;
        const lite = document.createElement("div");
        lite.className = "fx-compare-lite";
        lite.setAttribute("data-fx-own", "compare");
        lite.textContent = liteHTML(list.length);
        mount(lite, host);
        return;
      }

      const rows = Store.skillRows();
      const maxSal = Math.max.apply(null, list.map(c => c.salary));

      const panel = document.createElement("section");
      panel.className = "fx-compare" + (route === "#/careers" ? " card" : " inset");
      panel.setAttribute("data-fx-own", "compare");
      panel.innerHTML = panelHTML(list, rows, maxSal);
      mount(panel, host);

      grow(panel, list, maxSal, api);
    }
  };
})();

</script>
<script>
/* =============================================================================
   evidence.js — the CW1 research checklist, audited.

   Fourteen checkboxes that tick themselves for free are the one place in this
   product that rewards pretending, and they feed fourteen points into a score
   the rest of the platform asks to be believed. So this module puts the
   student's own work underneath each requirement: which slide is supposed to
   carry it, how much they have actually written there, and how many sources
   back it up — read live from Store, never asserted.

   It audits; it does not punish. Nothing here writes to state, patches
   Store.cw1Progress or changes a single point of the readiness score. A
   requirement ticked on thin evidence still counts — it just says so.

   The motion is the same argument: at the moment of the click the check draws
   itself (the click registered), the x/14 pill beats once (this is what it was
   worth), and the coach item that has just been satisfied strikes itself
   through and collapses instead of disappearing between two frames.
   ========================================================================== */

PSEFX.evidence = (function () {

  /* Which slide of the ten-slide plan is supposed to carry each requirement.
     Straight from section 16's slide order: 6 — Job Market — is the evidence
     for demand, outlook and salary alike. */
  const SLIDE = {
    career: 1, research: 2, resp: 3, skills: 4, edu: 5,
    demand: 6, ai: 7, outlook: 6, salary: 6, plan: 8
  };

  const REF_BAR = 5;          /* section 17: five sources is the referencing bar */
  const SLIDE_BAR = 10;

  /* A student ticks one box at a time. Four or more changing at once means the
     demo data was loaded or a workspace was imported — a state swap, not a
     recalculation the room just watched, so it gets no animation. */
  const MAX_DRAW = 3;
  const MAX_GHOSTS = 2;       /* a bulk change must not turn into a cascade */

  /* Generated, because the platform ships no icon library and no network. */
  const CHECK_SVG = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" ' +
    'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="m4 10.4 4 4 8-8.4" stroke-width="2.4"/></svg>';

  /* null until this tab has been seen once, so a first paint animates nothing. */
  let prevTick = null;        /* Map: requirement id -> was it ticked */
  let prevCoach = null;       /* the coach card's labels, in order */

  /* --- helpers ----------------------------------------------------------- */

  /* Ten engineers decorate this page and cannot see each other. */
  const foreign = el => {
    const owner = el.closest("[data-fx-own]");
    return !!owner && owner.getAttribute("data-fx-own") !== "evidence";
  };

  const plural = (n, word) => n + " " + word + (n === 1 ? "" : "s");

  const countSources = str =>
    String(str || "").split(/[,;]/).map(x => x.trim()).filter(Boolean).length;

  /* api.after collapses its delay to 0 under reduced motion, which is right for
     an animation and wrong for the 600ms the resolved coach label has to stay
     readable. This is the plain timer, still torn down with the page. */
  function hold(api, ms, fn) {
    const id = setTimeout(fn, ms);
    api.onTeardown(() => clearTimeout(id));
  }

  /* --- B. the evidence line ---------------------------------------------- */

  function evidenceFor(id, ticked, s) {
    const n = SLIDE[id];

    if (n) {
      const sl = s.cw1.slides[n] || {};
      const chars = (sl.notes || "").trim().length;
      const srcs = countSources(sl.sources);
      if (!chars) {
        return ticked
          ? { text: "Ticked, but slide " + n + " has no notes yet", thin: true }
          : { text: "Slide " + n + " carries this — no notes written there yet", thin: false };
      }
      return { text: "Slide " + n + " · " + plural(chars, "character") + " of notes · " +
                     (srcs ? plural(srcs, "source") : "no sources listed"), thin: false };
    }

    /* The four requirements whose evidence is not a slide but a whole workspace. */
    if (id === "refs") {
      const k = s.cw1.sources.length;
      if (ticked && k < REF_BAR) return { text: "Ticked, but only " + k + " of " + REF_BAR + " sources are in the library", thin: true };
      return { text: plural(k, "source") + " in the library" + (k < REF_BAR ? " · " + REF_BAR + " needed" : ""), thin: false };
    }
    if (id === "slides") {
      const k = Store.slidesDone();
      if (ticked && k < SLIDE_BAR) return { text: "Ticked, but only " + k + " of " + SLIDE_BAR + " slides have notes", thin: true };
      return { text: k + " of " + SLIDE_BAR + " slides planned", thin: false };
    }
    if (id === "practice") {
      const k = s.cw1.practice.length;
      if (ticked && !k) return { text: "Ticked, but no timed run is recorded", thin: true };
      return { text: k ? plural(k, "timed run") + " recorded" : "No timed run recorded yet", thin: false };
    }
    if (id === "intv") return { text: "Optional — not counted against you", thin: false };

    return null;
  }

  function paintEvidence(rows, s) {
    rows.forEach(row => {
      const t = row.querySelector(".t");
      if (!t) return;
      const block = t.parentNode;
      const ev = evidenceFor(row.getAttribute("data-id"), row.classList.contains("on"), s);
      if (!ev) return;

      /* render() hands us fresh HTML every time, but re-running over the same
         DOM must not stack two lines. */
      Array.prototype.forEach.call(block.querySelectorAll(".fx-ev"), n => n.remove());
      block.classList.remove("fx-ev-warn");

      const line = document.createElement("div");
      line.className = "fx-ev" + (ev.thin ? " fx-ev-thin" : "");
      line.setAttribute("data-fx-own", "evidence");
      line.textContent = ev.text;
      block.appendChild(line);
      if (ev.thin) block.classList.add("fx-ev-warn");
    });
  }

  /* --- C. the tick draws itself ------------------------------------------ */

  function drawCheck(row, api) {
    const path = row.querySelector(".box svg path");
    if (!path || typeof path.getTotalLength !== "function") return;
    let len;
    try { len = path.getTotalLength(); } catch (e) { return; }
    if (!len) return;

    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    void path.getBoundingClientRect();        /* commit the empty box before tweening away from it */

    api.raf(t => {
      const k = Math.min(1, t / 0.22);
      path.style.strokeDashoffset = (len * (1 - api.ease.out(k))).toFixed(2);
      if (k < 1) return true;
      path.style.strokeDasharray = "";        /* hand the mark back to the stylesheet */
      path.style.strokeDashoffset = "";
      return false;
    });
  }

  function flashPill(card, api) {
    const pill = card && card.querySelector(".card-h .pill");
    if (!pill || foreign(pill)) return;
    pill.classList.remove("fx-ev-pop");
    void pill.offsetWidth;
    pill.classList.add("fx-ev-pop");
    api.on(pill, "animationend", () => pill.classList.remove("fx-ev-pop"));
  }

  /* --- D. the resolved coach item ---------------------------------------- */

  function coachList(root) {
    const cards = Array.prototype.slice.call(root.querySelectorAll(".card"));
    const card = cards.filter(c => {
      const h = c.querySelector(".card-h h3");
      return h && /^coach/i.test(h.textContent.trim());
    })[0];
    return card ? card.querySelector(".coach") : null;
  }

  const labelsOf = coach => Array.prototype.slice.call(coach.children)
    .filter(el => !el.classList.contains("fx-ghost"))
    .map(el => { const t = el.querySelector(".t"); return t ? t.textContent.trim() : ""; });

  /* A label can also vanish because checkCW1() only shows the first six missing
     items — unticking something pushes the sixth off the end. Striking that
     through would claim a resolution that never happened, so every ghost has to
     be explained by the state actually being satisfied now. */
  function isResolved(label, s) {
    const item = PSE.cw1Checklist.filter(i => i.label === label)[0];
    if (item) return !!s.cw1.checklist[item.id];
    if (label === "Fewer than five references") return s.cw1.sources.length >= REF_BAR;
    if (/slides still have no notes$/.test(label)) return Store.slidesDone() === SLIDE_BAR;
    return false;
  }

  function ghost(coach, label, index, api) {
    const el = document.createElement("div");
    el.className = "coach-item yes fx-ghost";
    el.setAttribute("data-fx-own", "evidence");
    el.innerHTML = '<span class="ic">' + CHECK_SVG + '</span><div><div class="t fx-ev-struck"></div></div>';
    el.querySelector(".t").textContent = label;
    coach.insertBefore(el, coach.children[Math.min(index, coach.children.length)] || null);

    /* Reduced motion still gets the sentence — it just does not get the slide. */
    if (api.reduced) { hold(api, 600, () => el.remove()); return; }

    el.style.maxHeight = el.scrollHeight + "px";
    void el.offsetHeight;
    el.classList.add("fx-ev-out");
    el.style.maxHeight = "0px";
    hold(api, 280, () => el.remove());
  }

  /* --- the render pass ---------------------------------------------------- */

  return {
    init() { /* nothing outlives a page here, and Store.subscribe has no unsubscribe */ },

    onRender(root, ctx, api) {
      /* A. */
      if (!root || (ctx && ctx.route) !== "#/cw1") return;
      const rows = Array.prototype.slice.call(root.querySelectorAll(".check-row"))
        .filter(r => !foreign(r));
      if (!rows.length) return;

      const s = Store.get();

      paintEvidence(rows, s);

      /* C — what changed since the last time this tab was on screen. */
      const seen = !!prevTick;
      const now = new Map();
      const changed = [];
      let ticked = 0, wasTicked = 0;
      rows.forEach(row => {
        const id = row.getAttribute("data-id");
        const on = row.classList.contains("on");
        now.set(id, on);
        if (on) ticked++;
        if (seen && prevTick.get(id) === true) wasTicked++;
        if (seen && prevTick.get(id) === false && on) changed.push(row);
      });
      prevTick = now;

      /* Four or more boxes moving at once is a persona load or an import — a
         state swap, not something the room watched happen — so nothing moves. */
      const bulk = changed.length > MAX_DRAW || Math.abs(ticked - wasTicked) > MAX_DRAW;

      if (seen && !bulk && !api.reduced) {
        changed.forEach(row => drawCheck(row, api));
        /* The pill prints the count, so it beats whenever the count moved.
           Unticking is a recalculation too: the point leaves the score and the
           number must be seen to fall, or the one honest click in the demo is
           the only one the product does not acknowledge. */
        if (ticked !== wasTicked) flashPill(rows[0].closest(".card"), api);
      }

      /* D. */
      const coach = coachList(root);
      if (!coach || foreign(coach)) { prevCoach = null; return; }
      const labels = labelsOf(coach);
      if (prevCoach) {
        const gone = [];
        prevCoach.forEach((lab, i) => {
          if (lab && labels.indexOf(lab) < 0 && isResolved(lab, s)) gone.push({ lab: lab, i: i });
        });
        gone.slice(0, MAX_GHOSTS).forEach(g => ghost(coach, g.lab, g.i, api));
      }
      prevCoach = labels;
    }
  };
})();

</script>
<script>
/* =============================================================================
   journey.js — the Journey canvas earns its arrival.

   canvas.js already computes the single most meaningful figure on this screen:
   how far along the eight stages this student actually is. It writes that
   figure into the progress stroke at mount, so it is true but never seen to
   happen. Here the line grows to where the student stands and the stages
   arrive in chronological order, which turns a map into a story — and then the
   camera flies, as it always did.

   The other two things this module does are honesty repairs rather than motion:
   the canvas never says in words which stage the camera is on, and "Fly to my
   next step" silently lands on the current stage whenever the recommendation
   is a route no stage owns (#/profile — the very first recommendation an empty
   workspace produces). A mentor comparing two screens catches that in seconds.

   Owns: the progress path, the stage nodes' arrival, and the two elements it
   adds to .cv-hud (both marked data-fx-own="journey"). It never writes a
   transform to .cv-node or .cv-ring outside a one-shot keyframe, because
   canvas.js re-applies transforms to those on every camera move.
   ========================================================================== */

PSEFX.journey = (function () {
  const OWN = "journey";

  /* canvas.js matches Store.nextStep().route against stage routes and falls
     back to the current stage when nothing matches. Two module routes belong to
     no stage at all (#/profile, #/resources), so that fallback fires on exactly
     the recommendation a new student sees first. This is the honest mapping. */
  const ROUTE_STAGE = {
    "#/careers": "explore", "#/skills": "skills", "#/goals": "goals",
    "#/cw1": "cw1", "#/cw2": "cw2", "#/reflections": "reflect",
    "#/resources": "explore", "#/profile": "understand"
  };

  const DRAW_MS = 900, NODE_GAP = 70;

  let readout = null;        /* the HUD element — belongs to the current page only */
  let lastFocus = -2;        /* -2 so the first observer pass always paints */
  let nextTitle = "";

  const pad2 = n => String(n).padStart(2, "0");
  const stages = () => (window.PSE && PSE.roadmap) || [];

  function focusIndex(world) {
    const nodes = world.querySelectorAll(".cv-node");
    for (let i = 0; i < nodes.length; i++) if (nodes[i].classList.contains("focus")) return i;
    return -1;
  }

  /* Camera and caption are derived from the same index, so they cannot
     disagree — which is the whole reason the caption is there. */
  function paintReadout(i) {
    if (!readout) return;
    const list = stages(), t = readout.querySelector("b"), n = readout.querySelector("em");
    t.textContent = (i >= 0 && list[i])
      ? "Stage " + list[i].n + " of " + pad2(list.length) + " — " + list[i].title
      : "Overview — " + pad2(list.length) + " stages";
    n.textContent = nextTitle;
  }

  /* Where "my next step" really is: resolved here rather than letting
     canvas.js swallow a route no stage claims. */
  function trueNext() {
    const step = (window.Store && Store.nextStep()) || { route: "", title: "" };
    const id = ROUTE_STAGE[step.route];
    let i = id ? stages().findIndex(r => r.id === id) : -1;
    if (i < 0) i = window.Journey ? Journey.now() : 0;
    return { i: i, title: step.title || "" };
  }

  function flyTrue() {
    const t = trueNext();
    nextTitle = t.title;
    if (window.Journey && Journey.active()) Journey.stage(t.i, 2);
    lastFocus = t.i;
    paintReadout(t.i);
  }

  const fsNode = () => document.fullscreenElement || document.webkitFullscreenElement || null;

  function toggleFull(host) {
    if (fsNode()) {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) { const r = exit.call(document); if (r && r.catch) r.catch(() => {}); }
      return;
    }
    const req = host.requestFullscreen || host.webkitRequestFullscreen;
    if (req) { const r = req.call(host); if (r && r.catch) r.catch(() => {}); }
  }

  /* The only DOM this module creates: a stage readout and a full screen
     button, appended to the HUD canvas.js already drew. */
  function buildHud(host, hud, world, api) {
    const full = document.createElement("button");
    full.className = "btn btn-sm";
    full.type = "button";
    full.setAttribute("data-fx-own", OWN);
    const label = () => { full.textContent = fsNode() ? "Exit full screen" : "Full screen"; };
    label();
    /* No data-act attribute, so app.js's delegated handler never sees it. */
    api.on(full, "click", () => toggleFull(host));
    api.on(document, "fullscreenchange", label);
    api.on(document, "webkitfullscreenchange", label);
    api.on(document, "keydown", e => {
      if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
      /* The assistant overlay owns the keyboard while it is open. */
      if (document.body.classList.contains("ask-open")) return;
      const el = e.target, tag = (el.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea" || tag === "select" || el.isContentEditable) return;
      if (e.key === "f" || e.key === "F") { toggleFull(host); e.preventDefault(); }
    });
    hud.appendChild(full);

    readout = document.createElement("div");
    readout.className = "cv-stage";
    readout.setAttribute("data-fx-own", OWN);
    readout.innerHTML = '<b></b><span>Next step · <em></em></span>';
    hud.appendChild(readout);
    nextTitle = trueNext().title;
    paintReadout(focusIndex(world));

    /* canvas.js states the focused stage only as a class, so that class is the
       one reliable source for a caption that can never lag the camera. */
    const obs = new MutationObserver(() => {
