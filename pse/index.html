let reflDraft = null;
V.reflections = function () {
  const s = Store.get();
  if (reflDraft) {
    const r = reflDraft;
    const words = Store.wordCount([r.what,r.learn,r.skills,r.career,r.next].join(" "));
    const cls = words >= 70 && words <= 100 ? "ok" : words > 100 ? "warn" : "";
    const checks = Store.checkReflection(r);
    return { title: r.id ? "Edit reflection" : "New reflection", sub: "Structured reflection — the five prompts are what makes it assessable.", crumb: ["PSE","Reflections","Write"], html: `
      <div class="split">
        <div class="card">
          <div class="card-b" style="display:grid;gap:14px">
            <div class="grid" style="grid-template-columns:1fr 220px;gap:12px">
              <div class="field"><label>Title</label>
                <input type="text" placeholder="Guest lecture with a data team lead" value="${esc(r.title||"")}" data-act="rd" data-k="title"></div>
              <div class="field"><label>Type</label><select data-act="rd" data-k="type">
                ${PSE.reflectionTypes.map(t => `<option value="${t.id}" ${r.type===t.id?"selected":""}>${esc(t.label)}</option>`).join("")}</select></div>
            </div>
            ${PSE.reflectionPrompts.map(p => `<div class="field"><label>${esc(p.label)}</label>
              <textarea placeholder="${esc(p.hint)}" data-act="rd" data-k="${p.key}">${esc(r[p.key]||"")}</textarea></div>`).join("")}
          </div>
          <div class="card-f" style="display:flex;justify-content:space-between;align-items:center;background:var(--surface)">
            <span class="wordcount ${cls}" id="rwords">${words} / 70–100 words${words<70?" — keep going":words>100?" — tighten it":" — in range"}</span>
            <span style="display:flex;gap:8px"><button class="btn btn-ghost" data-act="rcancel">Cancel</button>
            <button class="btn btn-primary" data-act="rsave">Save reflection</button></span></div>
        </div>
        <div class="card"><div class="card-h"><div><h3>Coach</h3><p class="sub">Checks the structure. It will not write it for you.</p></div></div>
          <div class="card-b"><div class="coach" id="rcoach">${checks.map(c => `<div class="coach-item ${c.ok?"yes":"no"}">
            <span class="ic">${c.ok?ic("check"):"!"}</span><div><div class="t">${esc(c.label)}</div>
            ${!c.ok&&c.fix?`<div class="fix">${esc(c.fix)}</div>`:""}</div></div>`).join("")}</div></div></div>
      </div>` };
  }

  return { title: "Reflections", sub: "Turn experiences into evidence. Each LinkedIn reflection should land between 70 and 100 words.", crumb: ["PSE","Reflections"], html: `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div style="font-size:13px;color:var(--ink-500)">${s.reflections.length} written · ${Store.reflectionsInRange()} with enough depth</div>
      <button class="btn btn-primary" data-act="newrefl">${ic("plus")} New reflection</button></div>
    <div class="grid g2">
      ${PSE.reflectionTypes.map(t => { const have = s.reflections.filter(r => r.type === t.id).length;
        return `<div class="card" style="cursor:pointer" data-act="newrefl" data-type="${t.id}"><div class="card-b" style="display:flex;justify-content:space-between;align-items:center;gap:12px">
          <div><div style="font-size:13.5px;font-weight:560">${esc(t.label)}</div>
            <div style="font-size:12px;color:var(--ink-400)">${have ? have + " written" : "Not written yet"}</div></div>
          <span class="pill ${have?"ok":""}">${have?ic("check"):ic("plus")}</span></div></div>`; }).join("")}
    </div>
    ${s.reflections.length ? `<div class="card"><div class="card-h"><h3>Your reflections</h3></div><div class="list">
      ${s.reflections.map(r => { const w = Store.wordCount([r.what,r.learn,r.skills,r.career,r.next].join(" "));
        return `<div class="row"><div class="grow"><div class="t">${esc(r.title||"Untitled")}</div>
          <div class="s">${esc((PSE.reflectionTypes.find(t=>t.id===r.type)||{}).label||"")} · ${esc(r.date||"")}</div></div>
          <span class="wordcount ${w>=70&&w<=100?"ok":"warn"}">${w} words</span>
          <button class="btn btn-sm" data-act="editrefl" data-id="${r.id}">Edit</button>
          <button class="btn btn-sm btn-danger" data-act="delrefl" data-id="${r.id}">${ic("trash")}</button></div>`; }).join("")}
    </div></div>` : ""}` };
};

/* ============================ PROFILE ===================================== */
V.profile = function () {
  const s = Store.get(), R = Store.readiness(), rows = Store.skillRows();
  const strengths = rows.filter(r => r.current >= 7).sort((a,b) => b.current-a.current).slice(0,4);
  const gaps = rows.filter(r => r.gap > 0).sort((a,b) => b.gap-a.gap).slice(0,4);
  const short = s.shortlist.map(id => PSE.careers.find(c => c.id === id)).filter(Boolean);

  return { title: "My Career", sub: "Everything you have built, in one place.", crumb: ["PSE","Profile"], html: `
    <div class="split">
      <div class="grid" style="gap:16px">
        <div class="card"><div class="card-h"><h3>About you</h3></div>
          <div class="card-b grid g2" style="gap:12px">
            <div class="field"><label>Name</label><input type="text" placeholder="Your full name" value="${esc(s.profile.name)}" data-set="profile.name" data-quiet="1"></div>
            <div class="field"><label>Major</label><input type="text" placeholder="BSc Business Management" value="${esc(s.profile.major)}" data-set="profile.major" data-quiet="1"></div>
            <div class="field"><label>Target entry-level role</label><input type="text" placeholder="Junior Data Analyst" value="${esc(s.profile.targetRole)}" data-set="profile.targetRole" data-quiet="1"></div>
            <div class="field"><label>Career interests</label><input type="text" placeholder="Fintech, analytics, consulting" value="${esc(s.profile.interests)}" data-set="profile.interests" data-quiet="1"></div>
          </div></div>

        <div class="card"><div class="card-h"><h3>Shortlisted careers</h3></div>
          ${short.length ? `<div class="list">${short.map(c => `<div class="row">
            <div class="grow"><div class="t">${esc(c.title)}</div><div class="s">${esc(c.industry)} · ${esc(c.growth)} growth · ${money(c.salary)}</div></div>
            <button class="btn btn-sm" data-act="go" data-route="#/career/${c.id}">Open</button></div>`).join("")}</div>`
            : `<div class="empty"><h4>Nothing shortlisted</h4><p>Shortlist careers from the explorer to compare them here.</p>
              <button class="btn btn-primary" data-act="go" data-route="#/careers">Explore careers</button></div>`}</div>

        <div class="card"><div class="card-h"><h3>Your data</h3></div>
          <div class="card-b" style="display:grid;gap:11px">
            <p style="font-size:13px;color:var(--ink-500)">Everything you enter is saved in this browser only — no account, no server. Export a backup before switching computers.</p>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <button class="btn" data-act="export">Export backup</button>
              <button class="btn" data-act="importopen">Import backup</button>
              <button class="btn btn-danger" data-act="resetall">Reset everything</button></div>
            <textarea id="importbox" hidden placeholder="Paste an exported backup here, then press Import"></textarea>
            <button class="btn btn-primary" id="importgo" hidden data-act="importgo">Import</button>
          </div></div>
      </div>

      <div class="grid" style="gap:16px">
        <div class="card"><div class="card-b" style="text-align:center;padding:22px">
          ${ring(R.total, 128, "of 100")}
          <div style="font-size:13px;font-weight:560;margin-top:10px">Career readiness</div>
          <div style="font-size:12px;color:var(--ink-400)">${esc(s.profile.targetRole || "Set a target role to sharpen this")}</div></div></div>
        <div class="card"><div class="card-h"><h3>Top strengths</h3></div><div class="card-b" style="display:grid;gap:8px">
          ${strengths.length ? strengths.map(x => `<div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(x.name)}</span><b>${x.current}/10</b></div>`).join("")
            : '<div style="font-size:13px;color:var(--ink-400)">Rate your skills to see this.</div>'}</div></div>
        <div class="card"><div class="card-h"><h3>Skills to improve</h3></div><div class="card-b" style="display:grid;gap:8px">
          ${gaps.length ? gaps.map(x => `<div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(x.name)}</span><span class="pill warn">gap ${x.gap}</span></div>`).join("")
            : '<div style="font-size:13px;color:var(--ink-400)">No gaps recorded yet.</div>'}</div></div>
      </div>
    </div>` };
};

</script>
<script>
/* =============================================================================
   app.js — router, delegated events, and the shell.
   ========================================================================== */
(function () {
  "use strict";
  const $ = s => document.querySelector(s);
  const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));

  const NAV = [
    { g: "Workspace" },
    { r: "#/",            i: "home",    l: "Dashboard" },
    { r: "#/roadmap",     i: "compass", l: "Roadmap" },
    { r: "#/careers",     i: "compass", l: "Career Explorer" },
    { g: "Development" },
    { r: "#/skills",      i: "spark",   l: "Skills" },
    { r: "#/goals",       i: "target",  l: "Goals",       c: () => Store.get().goals.length },
    { g: "Coursework" },
    { r: "#/cw1",         i: "deck",    l: "CW1 — Presentation", c: () => Store.cw1Progress().pct + "%" },
    { r: "#/cw2",         i: "badge",   l: "CW2 — LinkedIn",     c: () => Store.cw2Progress().pct + "%" },
    { r: "#/reflections", i: "book",    l: "Reflections", c: () => Store.get().reflections.length },
    { g: "Reference" },
    { r: "#/resources",   i: "lib",     l: "Resources" },
    { r: "#/profile",     i: "user",    l: "My Career" }
  ];

  function renderRail(route) {
    const R = Store.readiness();
    $("#nav").innerHTML = NAV.map(n => {
      if (n.g) return `<div class="nav-label">${n.g}</div>`;
      const on = route === n.r || (n.r === "#/careers" && route.startsWith("#/career/"));
      const c = n.c ? n.c() : null;
      return `<a href="${n.r}" class="${on ? "on" : ""}" data-act="go" data-route="${n.r}">
        ${ic(n.i)}<span>${n.l}</span>${c ? `<span class="count">${c}</span>` : ""}</a>`;
    }).join("");
    $("#railscore").innerHTML = `<div class="k">Career readiness</div><div class="v">${R.total}<small>/100</small></div>
      <div class="bar" style="margin-top:7px;background:#1E2B45"><i style="width:${R.total}%"></i></div>`;
  }

  function route() {
    const h = location.hash || "#/";
    if (h.startsWith("#/career/")) return V.career(h.slice(9));
    if (h === "#/roadmap") { const i = journeyIntent; journeyIntent = null; return V.roadmap(i); }
    const map = { "#/": V.dashboard, "#/roadmap": V.roadmap, "#/careers": V.careers, "#/skills": V.skills,
      "#/goals": V.goals, "#/cw1": V.cw1, "#/cw2": V.cw2, "#/reflections": V.reflections,
      "#/resources": V.resources, "#/profile": V.profile };
    return (map[h] || V.dashboard)();
  }

  let lastHash = null, journeyIntent = null;
  function render(scroll) {
    if (window.Journey) Journey.destroy();
    const page = route();
    document.title = page.title + " · PSE";
    $("#crumb").innerHTML = (page.crumb || []).map(c => `<span>${esc(c)}</span>`).join("");
    $("#ptitle").textContent = page.title;
    $("#psub").textContent = page.sub || "";
    $("#psub").hidden = !page.sub;
    $("#page").innerHTML = page.html;
    if (page.mount) page.mount();
    renderRail(location.hash || "#/");
    if (scroll) window.scrollTo({ top: 0, behavior: "auto" });
    $("#rail").classList.remove("open");
    const sc = $(".scrim"); if (sc) sc.remove();
  }

  /* --- generic path setter for data-set inputs ---------------------------- */
  function setPath(obj, path, value) {
    const parts = path.split("."); let cur = obj;
    for (let i = 0; i < parts.length - 1; i++) {
      if (cur[parts[i]] == null || typeof cur[parts[i]] !== "object") cur[parts[i]] = {};
      cur = cur[parts[i]];
    }
    cur[parts[parts.length - 1]] = value;
  }
  function quietSet(path, value) {
    const s = Store.get(); setPath(s, path, value);
    Store.update(() => {});           /* persists + updates the rail score */
  }

  let toastT;
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2000);
  }

  /* --- practice timer ------------------------------------------------------ */
  let timerId = null, seconds = 0, pScores = {};
  function paintTimer() {
    const f = $("#tface"); if (!f) return;
    f.textContent = String(Math.floor(seconds / 60)).padStart(2, "0") + ":" + String(seconds % 60).padStart(2, "0");
    f.className = "timer-face" + (seconds >= 300 && seconds <= 420 ? " in" : seconds > 420 ? " over" : "");
  }
  function stopTimer() { clearInterval(timerId); timerId = null; const b = $("#tbtn"); if (b) b.innerHTML = ic("play") + " Start"; }

  /* --- click actions -------------------------------------------------------- */
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-act]");
    if (!t) return;
    const a = t.getAttribute("data-act"), s = Store.get();

    if (t.hasAttribute("data-stop")) e.stopPropagation();

    switch (a) {
      case "go": { e.preventDefault(); const r = t.getAttribute("data-route");
        if (location.hash === r) render(true); else location.hash = r; return; }

      case "railtoggle": {
        const rail = $("#rail"); rail.classList.toggle("open");
        if (rail.classList.contains("open")) {
          const sc = document.createElement("div"); sc.className = "scrim";
          sc.addEventListener("click", () => { rail.classList.remove("open"); sc.remove(); });
          document.body.appendChild(sc);
        } else { const sc = $(".scrim"); if (sc) sc.remove(); }
        return; }

      /* career explorer */
      case "jout":  Journey.overview(); return;
      case "jstep": Journey.step(+t.getAttribute("data-d")); return;
      case "jnext": Journey.flyNext(); toast("Your next step lives here"); return;
      case "jmap":  { journeyIntent = "next"; if (location.hash === "#/roadmap") render(true); else location.hash = "#/roadmap"; return; }
      case "jlist": { const l = $("#jlist"); l.hidden = !l.hidden; t.textContent = l.hidden ? "Show as list" : "Hide list"; return; }
      case "cset": careerFilter[t.getAttribute("data-k")] = t.getAttribute("data-v"); render(); return;
      case "cclear": careerFilter = { q: "", industry: "", demand: "", ai: "", major: "" }; render(); return;
      case "shortlist": {
        const id = t.getAttribute("data-id");
        Store.update(st => { const i = st.shortlist.indexOf(id); i >= 0 ? st.shortlist.splice(i, 1) : st.shortlist.push(id); });
        toast(s.shortlist.includes(id) ? "Added to shortlist" : "Removed from shortlist"); render(); return; }
      case "setcw1career": {
        Store.update(st => { st.cw1.career = t.getAttribute("data-id"); st.cw1.checklist.career = true; });
        toast("Set as your CW1 career"); render(); return; }
      case "addsource": {
        const r = PSE.resources.find(x => x.id === t.getAttribute("data-res"));
        if (!r) return;
        if (s.cw1.sources.some(x => x.url === r.url)) { toast("Already in your library"); return; }
        Store.update(st => st.cw1.sources.push({ id: Store.uid(), title: r.name, author: r.org, year: String(new Date().getFullYear()), url: r.url, accessed: new Date().toISOString().slice(0, 10) }));
        toast("Added to CW1 references"); render(); return; }

      /* goals */
      case "newgoal": goalDraft = { obstacles: [] }; goalStep = 0; render(true); return;
      case "editgoal": goalDraft = JSON.parse(JSON.stringify(s.goals.find(g => g.id === t.getAttribute("data-id")))); goalStep = 0; render(true); return;
      case "gcancel": goalDraft = null; render(true); return;
      case "gstep": { const i = +t.getAttribute("data-i"); if (i >= 0 && i < GOAL_STEPS.length) { goalStep = i; render(true); } return; }
      case "gsave": {
        const g = goalDraft;
        if (!(g.title || "").trim()) { toast("Give the goal a title first"); goalStep = 0; render(); return; }
        Store.update(st => {
          if (g.id) { const i = st.goals.findIndex(x => x.id === g.id); st.goals[i] = g; }
          else { g.id = Store.uid(); g.progress = 0; st.goals.push(g); }
        });
        goalDraft = null; toast("Goal saved"); render(true); return; }
      case "delgoal": {
        if (!confirm("Delete this goal?")) return;
        Store.update(st => st.goals = st.goals.filter(g => g.id !== t.getAttribute("data-id")));
        toast("Goal deleted"); render(); return; }
      case "obs-toggle": {
        const o = t.getAttribute("data-o"); goalDraft.obstacles = goalDraft.obstacles || [];
        const i = goalDraft.obstacles.findIndex(x => x.type === o);
        i >= 0 ? goalDraft.obstacles.splice(i, 1) : goalDraft.obstacles.push({ type: o, solution: "", date: "" });
        render(); return; }

      /* CW1 */
      case "cw1tab": cw1Tab = t.getAttribute("data-k"); stopTimer(); render(true); return;
      case "cw1check": { const id = t.getAttribute("data-id");
        Store.update(st => st.cw1.checklist[id] = !st.cw1.checklist[id]); render(); return; }
      case "savesource": {
        const v = id => ($("#" + id) || {}).value || "";
        if (!v("sr-title").trim()) { toast("A source needs a title"); return; }
        Store.update(st => st.cw1.sources.push({ id: Store.uid(), title: v("sr-title"), author: v("sr-author"), year: v("sr-year"), url: v("sr-url"), accessed: v("sr-accessed") }));
        toast("Source added"); render(); return; }
      case "delsource": Store.update(st => st.cw1.sources = st.cw1.sources.filter(x => x.id !== t.getAttribute("data-id"))); render(); return;
      case "copyref": {
        const src = s.cw1.sources.find(x => x.id === t.getAttribute("data-id"));
        const text = Store.harvard(src);
        (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
          .then(() => toast("Reference copied")).catch(() => { window.prompt("Copy this reference:", text); });
        return; }
      case "tstart": {
        if (timerId) { stopTimer(); return; }
        timerId = setInterval(() => { seconds++; paintTimer(); }, 1000);
        t.innerHTML = ic("pause") + " Pause"; return; }
      case "treset": stopTimer(); seconds = 0; paintTimer(); return;
      case "savepractice": {
        if (!seconds) { toast("Run the timer first"); return; }
        const vals = PSE.practiceCriteria.map(c => pScores[c.id] || 3);
        const avg = (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1);
        const improve = ($("#p-improve") || {}).value || "";
        Store.update(st => st.cw1.practice.push({ id: Store.uid(), seconds, avg, improvement: improve, date: new Date().toISOString().slice(0, 10), scores: Object.assign({}, pScores) }));
        stopTimer(); seconds = 0; pScores = {}; toast("Practice run saved"); render(); return; }

      /* CW2 */
      case "cw2check": { const id = t.getAttribute("data-id");
        Store.update(st => { st.cw2.sections[id] = st.cw2.sections[id] || {}; st.cw2.sections[id].done = !st.cw2.sections[id].done; });
        render(); return; }
      case "usehead": quietSet("cw2.sections.headline.value", t.getAttribute("data-v")); render(); return;

      /* reflections */
      case "newrefl": reflDraft = { type: t.getAttribute("data-type") || PSE.reflectionTypes[0].id }; render(true); return;
      case "editrefl": reflDraft = JSON.parse(JSON.stringify(s.reflections.find(r => r.id === t.getAttribute("data-id")))); render(true); return;
      case "rcancel": reflDraft = null; render(true); return;
      case "rsave": {
        const r = reflDraft;
        if (!(r.title || "").trim()) { toast("Give the reflection a title"); return; }
        r.date = r.date || new Date().toISOString().slice(0, 10);
        Store.update(st => {
          if (r.id) { const i = st.reflections.findIndex(x => x.id === r.id); st.reflections[i] = r; }
          else { r.id = Store.uid(); st.reflections.unshift(r); }
        });
        reflDraft = null; toast("Reflection saved"); render(true); return; }
      case "delrefl": {
        if (!confirm("Delete this reflection?")) return;
        Store.update(st => st.reflections = st.reflections.filter(x => x.id !== t.getAttribute("data-id")));
        render(); return; }

      /* data */
      case "export": {
        const text = Store.exportJSON();
        (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
          .then(() => toast("Backup copied to clipboard")).catch(() => window.prompt("Copy your backup:", text));
        return; }
      case "importopen": $("#importbox").hidden = false; $("#importgo").hidden = false; $("#importbox").focus(); return;
      case "importgo": {
        try { Store.importJSON($("#importbox").value); toast("Backup restored"); render(true); }
        catch (err) { toast("That does not look like a valid backup"); }
        return; }
      case "loadsample": Store.loadSample(); toast("Sample workspace loaded"); render(true); return;
      case "resetall": {
        if (!confirm("Delete everything you have entered? This cannot be undone.")) return;
        Store.reset(); toast("Workspace reset"); render(true); return; }
    }
  });

  /* --- input / change ------------------------------------------------------- */
  document.addEventListener("input", e => {
    const el = e.target, act = el.getAttribute("data-act"), path = el.getAttribute("data-set");

    if (path) {
      const num = el.type === "range" || el.type === "number";
      quietSet(path, num ? +el.value : el.value);
      /* targeted repaints so typing never loses focus */
      const m = path.match(/^skills\.([^.]+)\.(current|target)$/);
      if (m) {
        const row = Store.skillRows().find(r => r.id === m[1]);
        const v = $("#sv-" + m[1] + "-" + m[2]); if (v) v.textContent = el.value + "/10";
        const cur = $("#gb-" + m[1] + "-cur"), tgt = $("#gb-" + m[1] + "-tgt");
        if (cur) cur.style.width = (row.current / 10) * 100 + "%";
        if (tgt) { tgt.style.left = "calc(" + (row.target / 10) * 100 + "% - 1px)"; tgt.style.display = row.target ? "" : "none"; }
      }
      const c2 = path.match(/^cw2\.sections\.([^.]+)\.value$/);
      if (c2) { const p = $("#li-" + c2[1]); if (p) { p.textContent = el.value.slice(0, 260) + (el.value.length > 260 ? "…" : "") || "Not written yet"; p.parentElement.classList.toggle("missing", !el.value); } }
      return;
    }

    if (act === "cfilter") { careerFilter[el.getAttribute("data-k")] = el.value; clearTimeout(toastT); debounceRender(); return; }
    if (act === "gd") { goalDraft[el.getAttribute("data-k")] = el.value; return; }
    if (act === "obs-sol" || act === "obs-date") {
      const o = goalDraft.obstacles.find(x => x.type === el.getAttribute("data-o"));
      if (o) o[act === "obs-sol" ? "solution" : "date"] = el.value; return; }
    if (act === "rd") {
      reflDraft[el.getAttribute("data-k")] = el.value;
      const w = Store.wordCount([reflDraft.what, reflDraft.learn, reflDraft.skills, reflDraft.career, reflDraft.next].join(" "));
      const wc = $("#rwords");
      if (wc) { wc.textContent = w + " / 70–100 words" + (w < 70 ? " — keep going" : w > 100 ? " — tighten it" : " — in range");
        wc.className = "wordcount " + (w >= 70 && w <= 100 ? "ok" : w > 100 ? "warn" : ""); }
      const co = $("#rcoach");
      if (co) co.innerHTML = Store.checkReflection(reflDraft).map(c => `<div class="coach-item ${c.ok ? "yes" : "no"}">
        <span class="ic">${c.ok ? ic("check") : "!"}</span><div><div class="t">${esc(c.label)}</div>
        ${!c.ok && c.fix ? `<div class="fix">${esc(c.fix)}</div>` : ""}</div></div>`).join("");
      return; }
    if (act === "goalprogress") {
      const id = el.getAttribute("data-id");
      Store.update(st => { const g = st.goals.find(x => x.id === id); if (g) g.progress = +el.value; });
      const wrap = el.closest(".card-b"); if (wrap) { const b = wrap.querySelector(".bar > i"); if (b) b.style.width = el.value + "%"; }
      return; }
    if (act === "pscore") { pScores[el.getAttribute("data-id")] = +el.value;
      const o = $("#pv-" + el.getAttribute("data-id")); if (o) o.textContent = el.value; return; }
  });

  let dT; function debounceRender() { clearTimeout(dT); dT = setTimeout(() => render(), 220); }

  document.addEventListener("change", e => {
    const act = e.target.getAttribute("data-act");
    if (act === "gd" || act === "rd") render();     /* re-run coach checks on blur */
  });

  /* keyboard on the journey canvas */
  document.addEventListener("keydown", e => {
    if (!window.Journey || !Journey.active()) return;
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "select") return;
    if (e.key === "ArrowRight") { Journey.step(1); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { Journey.step(-1); e.preventDefault(); }
    else if (e.key === "Enter") { Journey.deeper(); e.preventDefault(); }
    else if (e.key === "Escape") { Journey.overview(); }
    else if (e.key === "n" || e.key === "N") { Journey.flyNext(); }
  });

  window.addEventListener("hashchange", () => {
    if (location.hash !== lastHash) { goalDraft = null; reflDraft = null; }
    lastHash = location.hash; stopTimer(); render(true);
  });

  /* --- boot ----------------------------------------------------------------- */
  Store.load();
  Store.subscribe(() => renderRail(location.hash || "#/"));
  lastHash = location.hash;
  render(false);
})();

</script>
</body>
</html>
