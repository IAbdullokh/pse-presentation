      const i = focusIndex(world);
      if (i === lastFocus) return;
      lastFocus = i;
      paintReadout(i);
    });
    obs.observe(world, { subtree: true, attributes: true, attributeFilter: ["class"] });
    api.observe(obs);
  }

  return {
    onRender(root, ctx, api) {
      const host = root.querySelector(".journey");
      const world = host && host.querySelector(".cv-world");
      if (!world) { readout = null; return; }             /* not the canvas page */
      const hud = host.querySelector(".cv-hud");

      lastFocus = -2;
      readout = null;

      /* --- the progress line draws to where the student stands ------------ */
      const line = host.querySelectorAll(".cv-path path")[1];
      if (line) {
        const prog = parseFloat(line.getAttribute("stroke-dasharray")) || 0;
        if (prog > 0 && !api.reduced) {
          line.setAttribute("stroke-dasharray", "0 1");
          void line.getBoundingClientRect();
          /* 900ms against canvas.js's 420ms hand-off and its 900ms camera
             transition: the line finishes about as the camera settles. */
          api.raf(t => {
            const k = Math.min(1, t * 1000 / DRAW_MS);
            line.setAttribute("stroke-dasharray", (prog * api.ease.out(k)).toFixed(4) + " 1");
            if (k >= 1) { line.setAttribute("stroke-dasharray", prog + " 1"); return false; }
          });
          api.onTeardown(() => line.setAttribute("stroke-dasharray", prog + " 1"));
        }
      }

      /* --- the stages arrive in chronological order ----------------------- */
      const nodes = Array.prototype.slice.call(world.querySelectorAll(".cv-node"));
      if (!api.reduced) {
        nodes.forEach((node, i) => {
          const ring = node.querySelector(".cv-ring"), delay = (i * NODE_GAP) + "ms";
          node.style.animationDelay = delay;
          node.classList.add("fx-node-in");
          api.on(node, "animationend", e => {
            if (e.target !== node) return;                /* the ring bubbles its own */
            node.classList.remove("fx-node-in"); node.style.animationDelay = "";
          });
          if (ring) {
            ring.style.animationDelay = delay;
            ring.classList.add("fx-ring-in");
            /* Removed on end so canvas.js's .focus scaling — and the pulse on
               the stage the student is standing on — own the transform again. */
            api.on(ring, "animationend", () => {
              ring.classList.remove("fx-ring-in"); ring.style.animationDelay = "";
            });
          }
        });
        api.onTeardown(() => nodes.forEach(node => {
          const ring = node.querySelector(".cv-ring");
          node.classList.remove("fx-node-in"); node.style.animationDelay = "";
          if (ring) { ring.classList.remove("fx-ring-in"); ring.style.animationDelay = ""; }
        }));
      }

      /* --- stages 01 and 02 are attendance, not earned work ---------------- */
      stages().forEach((r, i) => {
        if (r.id !== "meet" && r.id !== "understand") return;
        const live = nodes[i] && nodes[i].querySelector(".cv-live");
        if (live && live.querySelector("[data-fx-own]")) return;   /* not ours to rewrite */
        if (live && live.textContent.indexOf("assumed from attendance") < 0) {
          live.textContent = live.textContent + " · assumed from attendance";
        }
      });

      /* render() rebuilds #page wholesale, so the HUD is normally brand new. If
         a pass ever finds our own elements still there, replace them rather than
         skip: the observer and listeners behind them were torn down, and a
         readout left in place would silently stop following the camera. */
      if (hud) {
        hud.querySelectorAll('[data-fx-own="' + OWN + '"]').forEach(el => el.remove());
        buildHud(host, hud, world, api);
      }

      /* --- "Fly to my next step" must land where it says ------------------- */
      api.on(document, "click", e => {
        const btn = e.target.closest && e.target.closest('[data-act="jnext"]');
        if (!btn) return;
        e.stopPropagation(); e.preventDefault();          /* capture: app.js never sees it */
        flyTrue();
      }, true);

      /* The dashboard's "Fly to my next step" reaches the same broken fallback
         through a route change, where there is no click left to intercept.
         canvas.js's own hand-off is the only thing that arrives at zoom level 2
         (the host gains .z3), so a mismatch at that moment is the same defect:
         correct it once, quietly, while the camera is still moving. */
      let touched = false;
      const touch = () => { touched = true; };
      api.on(host, "pointerdown", touch);
      api.on(host, "wheel", touch, { passive: true });
      api.after(470, () => {
        if (touched) return;                              /* the presenter is driving */
        if (!host.classList.contains("z3")) return;
        if (focusIndex(world) === trueNext().i) return;
        flyTrue();
      });
    }
  };
})();

</script>
<script>
/* =============================================================================
   pageflow.js — navigation continuity.

   app.css binds `.page { animation: zoomin .28s }` to #page, but render() only
   swaps innerHTML, so that entrance has not played since boot: every one of the
   hundreds of navigations in a two-hour demo is a hard content swap. This module
   gives the swap a reading order — hero, then next step, then the stat row —
   which is the spec's "where am I / what am I doing" answered in motion, and
   gives the SMART wizard a direction so six steps read as one procedure rather
   than six unrelated forms.

   It also installs an error floor. A thrown view today leaves the previous page
   sitting under a changed hash; a white screen mid-presentation costs more marks
   than any feature gains.

   Everything is driven from a single class on #page with nth-child rules. Nine
   other engineers are writing inline styles onto children of #page in the same
   pass, so this module never writes transform or opacity onto a child itself,
   and it removes its class again the moment the animation is over.
   ========================================================================== */

PSEFX.pageflow = (function () {
  "use strict";

  const OWN = "pageflow";

  /* Long enough to outlast the last child's delay (.294s) plus its .22s run. */
  const ENTER_FALLBACK = 700;

  /* A view that throws never reaches FX.run, so "onRender has not fired for this
     hash yet" is the only reliable signal that a screen failed to build. 320ms is
     comfortably past app.js's synchronous render and well short of a human's
     "is it broken?" threshold. */
  const RECOVER_AFTER = 900;

  const RECOVERY =
    '<div class="card fx-recover" data-fx-own="' + OWN + '">' +
      '<div class="card-b">' +
        '<h3>This screen hit an error</h3>' +
        '<p>Your work is safe — it is stored in this browser, not in the page.</p>' +
        '<button class="btn btn-primary" data-act="go" data-route="#/">Back to Dashboard</button>' +
      '</div>' +
    '</div>';

  let lastRoute = null;
  let lastWizStep = null;

  /* Set by onRender, read by the error floor. Module scope, not api state, so it
     survives the teardown that runs between renders. */
  let lastRenderedHash = null;
  let recoveredHash = null;
  let recoverTimer = null;

  const hash = () => location.hash || "#/";

  /* Ownership: another module may have claimed a subtree of #page for itself. */
  function foreign(el) {
    const owner = el.closest("[data-fx-own]");
    return !!owner && owner.getAttribute("data-fx-own") !== OWN;
  }

  /* --- A. route entrance ---------------------------------------------------- */

  function enter(root, api) {
    /* The canvas owns its own arrival — stages fly in on their own schedule and a
       transform on the page would fight the camera. */
    if (root.querySelector(".journey")) return false;

    /* One card rising on its own reads as a glitch, not as an order of reading. */
    if (root.children.length < 2) return false;

    root.classList.remove("fx-enter");
    void root.offsetWidth;
    root.classList.add("fx-enter");

    /* Teardown runs inside FX.run immediately after the next innerHTML swap and
       before the browser paints, so this leaves the DOM clean for the next pass
       without ever showing a half-faded child. */
    api.onTeardown(() => root.classList.remove("fx-enter"));

    const done = () => root.classList.remove("fx-enter");

    /* animationend bubbles, so one listener covers children other modules append
       during this same pass. */
    api.on(root, "animationend", e => {
      if (e.animationName === "fx-rise" && e.target === root.lastElementChild) done();
    });

    /* A child that is hidden or display:none never fires animationend at all. */
    api.after(ENTER_FALLBACK, done);
    return true;
  }

  /* --- C. wizard direction -------------------------------------------------- */

  function wizard(root, api, entered) {
    const steps = root.querySelector(".wiz-steps");
    if (!steps) { lastWizStep = null; return; }

    const pips = Array.prototype.slice.call(steps.children);
    const idx = pips.findIndex(el => el.classList.contains("on"));
    if (idx < 0) { lastWizStep = null; return; }

    const prev = lastWizStep;
    lastWizStep = idx;
    if (entered || api.reduced) return;
    if (typeof prev !== "number" || prev === idx) return;

    const body = steps.parentElement && steps.parentElement.querySelector(".card-b");
    if (body && !foreign(body)) {
      const cls = idx > prev ? "fx-slide-next" : "fx-slide-back";
      body.classList.remove("fx-slide-next", "fx-slide-back");
      void body.offsetWidth;
      body.classList.add(cls);
      api.on(body, "animationend", e => {
        if (e.target === body) body.classList.remove("fx-slide-next", "fx-slide-back");
      });
      api.onTeardown(() => body.classList.remove("fx-slide-next", "fx-slide-back"));
    }

    /* The step just left behind is the one that turned green — pop its pip so the
       viewer sees the wizard bank the step rather than merely change form. */
    const left = pips[prev];
    if (left && left.classList.contains("ok") && !foreign(left)) {
      const pip = left.querySelector("b");
      if (pip) {
        pip.classList.remove("fx-pop");
        void pip.offsetWidth;
        pip.classList.add("fx-pop");
        api.on(pip, "animationend", () => pip.classList.remove("fx-pop"));
      }
    }
  }

  /* --- D. error floor ------------------------------------------------------- */

  function recover(reason) {
    const page = document.getElementById("page");
    if (!page) return;
    const h = hash();
    if (recoveredHash === h) return;                       /* at most once per hash */

    /* Only step in when the page is GENUINELY BLANK. The earlier guard also
       required lastRenderedHash === h, which races: navigating at roughly the
       recovery interval — which is exactly what a presenter stepping with the
       arrow keys produces — let the timer fire between a hash change and its
       render, and this wiped a page that was about to be fine. An empty #page
       is the only unambiguous signal that a view failed; if anything at all is
       on screen, replacing it is worse than leaving it. */
    if (page.children.length) return;

    recoveredHash = h;
    console.warn("[fx] pageflow: " + h + " did not render (" + reason + ")");
    page.classList.remove("fx-enter");
    page.innerHTML = RECOVERY;
  }

  function installErrorFloor() {
    window.addEventListener("hashchange", () => {
      clearTimeout(recoverTimer);
      /* Plain setTimeout on purpose: this has to outlive the FX teardown that a
         successful render would trigger. */
      recoverTimer = setTimeout(() => {
        if (lastRenderedHash !== hash()) recover("view threw");
      }, RECOVER_AFTER);
    });

    const prior = window.onerror;
    window.onerror = function (msg) {
      try { recover(String(msg)); } catch (e) {}
      if (typeof prior === "function") return prior.apply(this, arguments);
      return false;
    };
  }

  return {
    init(api) {
      installErrorFloor();
    },

    onRender(root, ctx, api) {
      lastRenderedHash = ctx.route;
      recoveredHash = null;                                /* this screen is alive again */
      clearTimeout(recoverTimer);

      const changed = ctx.route !== lastRoute;
      lastRoute = ctx.route;

      /* A same-route re-render is a checkbox tick or a filter keystroke. Nothing
         arrived, so nothing should enter — that rule is the whole difference
         between continuity and a screensaver. */
      const entered = changed && !api.reduced ? enter(root, api) : false;

      wizard(root, api, entered);
    }
  };
})();

</script>
<script>
/* =============================================================================
   present.js — presenter mode: the room, not the page.

   A two-hour live demo is a navigation problem before it is a design problem.
   Three students take turns at one laptop, a projector sits eight metres from
   the back row, and the interesting states of this product — a specific CW1
   tab, a pre-filtered explorer, the goal wizard on its obstacles step — have
   no addresses. So this module gives the demo four things the app cannot give
   itself: a scripted arc that always knows where the next key press goes, a
   zoom level that makes 12px captions legible from the back, honest demo
   personas, and one keymap that does not fight the app's own.

   P            enter or leave presenter mode
   ← →          step the arc — on the journey canvas, fly the camera first
   1-9          jump to a section head
   + − 0        projector zoom
   D            cycle the demo workspace
   ?            the key map            Esc  back out, one level at a time

   Two rules shape the implementation. It decorates no page DOM at all — the
   bar, the sheet and one hidden button are the only nodes it owns — and it
   registers its keydown listener in the CAPTURE phase, because app.js listens
   on document in the bubble phase for the same arrow keys on the roadmap.
   Capture runs first, so stopPropagation there genuinely settles who wins.
   ========================================================================== */

PSEFX.present = (function () {

  /* --- the arc -------------------------------------------------------------
     Twenty-four beats in the order the demo should actually run, which is the
     student's journey and not the order of the sidebar. `say` is the line the
     presenter reads; `before()` sets the view state that gives a beat its
     address. Those assignments reach the module-scope `let`s in views.js
     because both files are classic scripts sharing the global lexical scope,
     and this one is loaded after it. ------------------------------------- */

  const FRESH_FILTER = { q: "", industry: "", demand: "", ai: "", major: "" };
  const clone = o => JSON.parse(JSON.stringify(o));

  const ARC = [
    { r: "#/", k: "1", beat: "Where this student stands today",
      say: "One number, seven parts. Every screen after this one is an input to it." },
    /* `replay` is the ONE beat that repaints a route it is already on. Every
       other same-route step only moves the bar, because a re-render with no
       state behind it is an animation that traces nothing. */
    { r: "#/", beat: "What the number is made of", replay: true,
      say: "The ring redraws its seven segments in the order the module teaches them." },

    { r: "#/roadmap", k: "2", beat: "The eight stages, as one canvas",
      say: "Arrow keys fly the camera stage by stage; every live line is real state." },

    { r: "#/careers", k: "3", beat: "Ten occupations, before we narrow anything",
      say: "Real labour-market figures, each printed with its proxy occupation and year.",
      before: () => { careerFilter = Object.assign({}, FRESH_FILTER); } },
    { r: "#/careers", beat: "Narrowed to technology, high demand",
      say: "Two occupations left. The filters are the research method, not decoration.",
      before: () => { careerFilter = { q: "", industry: "Technology & Data", demand: "High", ai: "", major: "" }; } },
    { r: "#/career/data-analyst", beat: "One occupation, in depth",
      say: "Opening a career is worth five points — watch the rail on the way back." },
    { r: "#/careers", beat: "The shortlist, compared side by side",
      say: "Salary and growth grow from zero; the shared skills are named underneath.",
      before: () => { careerFilter = Object.assign({}, FRESH_FILTER); } },

    { r: "#/skills", k: "4", beat: "Rating yourself against the target",
      say: "Ten skills, current and target. The gap is the shape of the work ahead." },
    { r: "#/skills", beat: "One slider, four consequences",
      say: "Drag presentation to nine: the radar dents, the tile renames, the score moves." },

    { r: "#/goals", k: "5", beat: "The gap, with a deadline attached",
      say: "Four points for writing a goal, six more for the progress you actually make.",
      before: () => { goalDraft = null; } },
    { r: "#/goals", beat: "The SMART wizard, step one of six",
      say: "Six steps, one idea each, so the panel slides read as a single process.",
      before: () => { goalDraft = { obstacles: [] }; goalStep = 0; } },
    { r: "#/goals", beat: "Step five — obstacles, and the plan around each",
      say: "Naming a barrier without a solution earns nothing, and the coach checks both.",
      before: () => {
        const g = Store.get().goals[0];
        goalDraft = g ? clone(g) : { obstacles: [] };
        goalStep = 4;
      } },

    { r: "#/cw1", k: "6", beat: "CW1 — fourteen assessed requirements",
      say: "Tick one: the evidence line names the slide and counts the sources behind it.",
      before: () => { cw1Tab = "checklist"; } },
    { r: "#/cw1", beat: "The ten-slide plan",
      say: "A slide counts as planned once it has real notes, not once it has a title.",
      before: () => { cw1Tab = "slides"; } },
    { r: "#/cw1", beat: "References, formatted from the fields",
      say: "Westminster Harvard, built from four inputs. Five sources is the threshold.",
      before: () => { cw1Tab = "sources"; } },
    { r: "#/cw1", beat: "Rehearsing to the five-to-seven minute window",
      say: "Start the clock and deliver the real section. Green at five, red past seven.",
      before: () => { cw1Tab = "practice"; } },
    { r: "#/cw1", beat: "Ask PSE — press A",
      say: "Fixed rules, in this browser. No model, no network, and it writes nothing.",
      before: () => { cw1Tab = "checklist"; } },

    { r: "#/cw2", k: "7", beat: "The profile, scored section by section",
      say: "Ten weighted sections. Type into the headline and the preview follows." },

    { r: "#/reflections", k: "8", beat: "Reflections as assessed evidence",
      say: "Three of sufficient depth is what the score asks for, not three entries.",
      before: () => { reflDraft = null; } },
    { r: "#/reflections", beat: "The editor — seventy to a hundred words",
      say: "The counter and the coach check structure and person. Neither writes it.",
      before: () => {
        const r = Store.get().reflections[0];
        reflDraft = r ? clone(r) : { type: PSE.reflectionTypes[0].id };
      } },

    { r: "#/resources", beat: "Where every figure came from",
      say: "Eight labour-market sources; one click files any of them as a reference." },

    { r: "#/profile", k: "9", beat: "The whole picture, scored",
      say: "Seven segments draw in module order while the total counts up beside them." },
    { r: "#/profile", beat: "Week nine, on the same screens",
      say: "Press D twice: every number re-animates to what a term of work produces." },
    { r: "#/profile", beat: "Questions",
      say: "The bar stays up — any screen in the product is one key press away." }
  ];

  /* The nine section names, as the rail calls them — used by the help sheet so
     the key map names screens the way the product does. */
  const SECTION = {
    "#/": "Dashboard", "#/roadmap": "Roadmap", "#/careers": "Career Explorer",
    "#/career/data-analyst": "Career detail", "#/skills": "Skills", "#/goals": "Goals",
    "#/cw1": "CW1 — Presentation", "#/cw2": "CW2 — LinkedIn",
    "#/reflections": "Reflections", "#/resources": "Resources", "#/profile": "My Career"
  };

  /* --- demo personas -------------------------------------------------------
     Every persona is the shipped sample workspace with parts removed or ticked
     — never new prose. A mentor should be able to ask "is that made up?" and
     get the same answer for all four: no, it is one sample, shown at three
     moments of the term, and the fourth is the presenter's own workspace. */
  const PERSONAS = [
    { id: "mine",  label: "My workspace" },
    { id: "week1", label: "Sample — Week 1" },
    { id: "week9", label: "Sample — Week 9" },
    { id: "ready", label: "Sample — Submission ready" }
  ];

  const KEY = "pse-workspace-v1";
  const BACKUP = "pse-workspace-backup";
  const ZOOMS = [1, 1.15, 1.32, 1.5];

  let on = false, idx = 0, zoom = 1, pending = null;
  let bar = null, help = null, goBtn = null;
  let persona = 0, backed = false, captured = false, backup = null;
  let startedAt = 0, clockId = 0;
  let runSeen = false, runSecs = 0, runIn = false;

  const mmss = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(Math.floor(s) % 60).padStart(2, "0");
  const esc2 = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const hash = () => location.hash || "#/";
  const clamp = i => Math.max(0, Math.min(ARC.length - 1, i));
  const matches = (a, h) => a.r === h || (a.r.indexOf("#/career/") === 0 && h.indexOf("#/career/") === 0);
  const safely = fn => { try { fn(); } catch (e) { console.warn("[present] " + (e && e.message)); } };

  /* --- repainting without editing app.js -----------------------------------
     app.js's delegated handler renders in place when the clicked route equals
     the current hash, so a hidden button is a legitimate way to ask for a
     repaint after a before() hook has changed cw1Tab or goalStep. */
  function repaint(r) {
    goBtn.setAttribute("data-route", r || hash());
    goBtn.click();
  }

  function jump(i) {
    idx = clamp(i);
    const b = ARC[idx];
    if (b.before) safely(b.before);
    /* exact route: repaint in place — but only if this beat actually changed
       something (a before() hook, or the one declared replay). A beat that
       changes no state must not re-run the page's build animations for a room
       that would learn nothing from them. Different route: let the router run,
       then re-arm the beat on hashchange, because app.js clears drafts on the
       way. */
    if (b.r === hash()) { if (b.before || b.replay) repaint(b.r); }
    else { pending = b; location.hash = b.r; }
    paint();
  }

  function step(d) { jump(idx + d); }

  function syncFromRoute() {
    const h = hash();
    if (!ARC[idx] || !matches(ARC[idx], h)) {
      const i = ARC.findIndex(a => matches(a, h));
      if (i >= 0) idx = i;
    }
    paint();
  }

  /* --- the journey camera owns the arrows while it is on screen ------------- */
  const stageNodes = () => document.querySelectorAll(".cv-node");
  function focusedStage() {
    const n = document.querySelector(".cv-node.focus");
    return n ? +n.getAttribute("data-i") : -1;
  }
  /* canvas.js declares `const Journey`, which is a global LEXICAL binding and
     never a property of window — so the window.Journey test app.js uses for its
     own canvas keys is permanently false. Reach it by bare identifier, or the
     camera silently loses the arrow keys it is supposed to own. */
  const onCanvas = () => {
    try { return typeof Journey !== "undefined" && Journey.active(); }
    catch (e) { return false; }
  };

  /* --- personas ------------------------------------------------------------- */
  function ensureBackup() {
    if (backed) return;
    backed = true;
    try {
      /* A demo gets reloaded. If the page comes back with a sample already in
         storage, the workspace sitting there is NOT the presenter's own work,
         and copying it over the backup would destroy the real thing for good.
         So never back up a sample: adopt the backup already on disk instead,
         so "My workspace" still restores the right thing after a reload. */
      if (Store.get().isSample) {
        backup = localStorage.getItem(BACKUP);
        captured = backup !== null;
        return;
      }
      backup = localStorage.getItem(KEY);
      captured = true;
      if (backup === null) localStorage.removeItem(BACKUP);
      else localStorage.setItem(BACKUP, backup);
    } catch (e) { /* private mode: the session still works, it just cannot be restored */ }
  }

  function restoreMine() {
    let raw = backup;
    try { if (raw == null) raw = localStorage.getItem(BACKUP); } catch (e) {}
    if (raw) { try { localStorage.setItem(KEY, raw); } catch (e) {} Store.load(); }
    else if (captured) Store.reset();   /* we saw an empty workspace before the demo */
    /* otherwise nothing here was ever ours to replace — leave the disk alone */
  }

  function applyPersona() {
    const p = PERSONAS[persona];
    if (p.id === "mine") { restoreMine(); repaint(); paint(); return; }

    ensureBackup();
    Store.loadSample();

    if (p.id === "week1") {
      /* the same student, before the term did anything to the workspace */
      Store.update(st => {
        st.viewed = st.viewed.slice(0, 4);
        st.goals = [];
        st.skills = {};
        st.cw1.checklist = {};
        st.cw1.sources = [];
        st.cw1.practice = [];
        st.cw2.sections = {};
        st.reflections = [];
      });
    }

    if (p.id === "ready") {
      /* the same student at hand-in: numbers and existing text only */
      Store.update(st => {
        PSE.cw1Checklist.forEach(i => { st.cw1.checklist[i.id] = true; });
        st.cw2.sections.ai = Object.assign({}, st.cw2.sections.ai, { done: true });
        const last = st.cw1.practice[st.cw1.practice.length - 1];
        st.cw1.practice.push({
          id: Store.uid(), seconds: 402, avg: "4.1",
          improvement: last ? last.improvement : "",
          date: new Date().toISOString().slice(0, 10),
          scores: last ? Object.assign({}, last.scores) : {}
        });
      });
    }

    repaint();
    paint();
  }

  function personaLabel() {
    /* after a reload the cycle starts at "My workspace" again, so never claim
       that a sample sitting in localStorage is the presenter's own work */
    if (persona === 0 && Store.get().isSample) return "Sample workspace";
    return PERSONAS[persona].label;
  }

  /* --- zoom ----------------------------------------------------------------
     app.css sizes everything in px, so zoom on .app is the one lever that
     scales the whole product — type, rules, charts and all — without a
     parallel set of presenter styles that could drift from the real thing. */
  function setZoom(i) {
    zoom = Math.max(0, Math.min(ZOOMS.length - 1, i));
    document.body.style.setProperty("--pm-zoom", ZOOMS[zoom]);
    paint();
  }

  /* --- the bar -------------------------------------------------------------- */
  function build() {
    bar = document.createElement("div");
    bar.className = "pm-bar";
    bar.setAttribute("data-fx-own", "present");
    bar.innerHTML =
      '<div class="pm-track" aria-hidden="true">' +
        ARC.map(a => '<i class="pm-tick' + (a.k ? " head" : "") + '"></i>').join("") +
      '</div>' +
      '<div class="pm-row">' +
        '<span class="pm-step"><b>01</b> / ' + ARC.length + '</span>' +
        '<div class="pm-beat"><div class="pm-t"></div><div class="pm-say"></div></div>' +
        '<div class="pm-meta">' +
          '<span class="pm-chip pm-persona"></span>' +
          '<span class="pm-chip pm-zoomv"></span>' +
          '<span class="pm-chip pm-clock" title="Time since presenter mode started">00:00</span>' +
          '<span class="pm-chip pm-run" hidden></span>' +
        '</div>' +
      '</div>' +
      '<div class="pm-keys"><kbd>←</kbd><kbd>→</kbd> step · <kbd>1</kbd>–<kbd>9</kbd> section · ' +
        '<kbd>+</kbd><kbd>−</kbd> zoom · <kbd>D</kbd> workspace · <kbd>A</kbd> ask · ' +
        '<kbd>F</kbd> full screen · <kbd>?</kbd> keys · <kbd>Esc</kbd> back</div>';
    document.body.appendChild(bar);

    help = document.createElement("div");
    help.className = "pm-help";
    help.setAttribute("data-fx-own", "present");
    help.hidden = true;
    document.body.appendChild(help);
    help.addEventListener("click", e => {
      const row = e.target.closest("[data-i]");
      if (row) { help.hidden = true; jump(+row.getAttribute("data-i")); return; }
      if (!e.target.closest(".pm-help-in")) help.hidden = true;
    });

    /* app.js repaints in place when a "go" click names the current route — the
       only way to re-render after a before() hook without editing app.js */
    goBtn = document.createElement("button");
    goBtn.setAttribute("data-act", "go");
    goBtn.setAttribute("data-fx-own", "present");
    goBtn.className = "pm-go";
    goBtn.hidden = true;
    document.body.appendChild(goBtn);
  }

  function paint() {
    if (!bar || !on) return;
    const b = ARC[idx] || {};
    bar.querySelector(".pm-step").innerHTML = "<b>" + String(idx + 1).padStart(2, "0") + "</b> / " + ARC.length;
    bar.querySelector(".pm-t").textContent = b.beat || "";
    bar.querySelector(".pm-say").textContent = b.say || "";
    bar.querySelectorAll(".pm-tick").forEach((t, i) => {
      t.classList.toggle("on", i === idx);
      t.classList.toggle("past", i < idx);
    });
    bar.querySelector(".pm-persona").textContent = personaLabel();
    bar.querySelector(".pm-zoomv").textContent = Math.round(ZOOMS[zoom] * 100) + "%";
    bar.querySelector(".pm-clock").textContent = mmss(startedAt ? (Date.now() - startedAt) / 1000 : 0);
    paintRun();
  }

  function paintRun() {
    if (!bar) return;
    const el = bar.querySelector(".pm-run");
    el.hidden = !runSeen;
    if (!runSeen) return;
    el.textContent = mmss(runSecs);
    el.classList.toggle("in", runIn);
    el.classList.toggle("over", runSecs > 420);
  }

  /* --- the key map, regenerated from the arc -------------------------------- */
  function paintHelp() {
    const heads = ARC.filter(a => a.k);
    help.innerHTML =
      '<div class="pm-help-in">' +
        '<div class="pm-help-head"><h3>Presenter mode</h3>' +
          '<span class="pm-chip">Beat ' + (idx + 1) + ' of ' + ARC.length + ' · ' +
          esc2(personaLabel()) + ' · ' + Math.round(ZOOMS[zoom] * 100) + '%</span></div>' +
        '<div class="pm-help-cols">' +
          '<div><h4>Keys</h4><dl>' +
            '<dt><kbd>←</kbd> <kbd>→</kbd></dt><dd>Step the arc. On the journey canvas these fly the camera stage by stage first, and move on only from the last stage.</dd>' +
            '<dt><kbd>1</kbd>–<kbd>9</kbd></dt><dd>' + heads.map(a => "<b>" + a.k + "</b> " + esc2(SECTION[a.r] || a.beat)).join(" · ") + '</dd>' +
            '<dt><kbd>+</kbd> <kbd>−</kbd> <kbd>0</kbd></dt><dd>Projector zoom — ' + ZOOMS.map(z => Math.round(z * 100) + "%").join(" / ") + '. <kbd>0</kbd> returns to 115%.</dd>' +
            '<dt><kbd>D</kbd></dt><dd>Cycle the workspace — ' + PERSONAS.map(p => esc2(p.label)).join(" → ") + '. Yours is backed up before the first switch and written back when the cycle returns to it.</dd>' +
            '<dt><kbd>A</kbd></dt><dd>Ask PSE, the offline assistant. It belongs to the assistant, not to presenter mode, and works with presenter mode off.</dd>' +
            '<dt><kbd>F</kbd></dt><dd>Full screen on the journey canvas.</dd>' +
            '<dt><kbd>?</kbd></dt><dd>This sheet. Click any beat on the right to jump straight to it.</dd>' +
            '<dt><kbd>P</kbd> <kbd>Esc</kbd></dt><dd>Leave presenter mode. On the journey canvas <kbd>Esc</kbd> returns the camera to the overview first.</dd>' +
          '</dl></div>' +
          '<div><h4>The arc</h4><ol class="pm-arc">' +
            ARC.map((a, i) => '<li class="' + (i === idx ? "on" : "") + '" data-i="' + i + '">' +
              '<span class="n">' + String(i + 1).padStart(2, "0") + '</span>' +
              '<span class="b">' + esc2(a.beat) + '</span>' +
              '<span class="s">' + esc2(SECTION[a.r] || a.r) + (a.k ? " · key " + a.k : "") + '</span></li>').join("") +
          '</ol></div>' +
        '</div>' +
        '<p>Presenter mode changes only how fast you reach a screen — never what a mentor sees on it.</p>' +
      '</div>';
  }

  function setOn(v) {
    on = v;
    document.body.classList.toggle("presenting", on);
    if (on) {
      if (!startedAt) startedAt = Date.now();
      /* The bar outlives every page, so its clock cannot be handed to the
         render cycle's teardown — this module owns it and stops it itself the
         moment the bar goes away, so nothing ticks outside presenter mode. */
      if (!clockId) clockId = setInterval(paint, 1000);
      setZoom(zoom);
      syncFromRoute();
    } else {
      if (clockId) { clearInterval(clockId); clockId = 0; }
      if (help) help.hidden = true;
    }
  }

  const stop = e => { e.preventDefault(); e.stopPropagation(); };

  return {
    init() {
      build();
      zoom = 1;                                   /* 115% is the default demo size */

      window.addEventListener("hashchange", () => {
        const b = pending; pending = null;
        if (b && matches(b, hash()) && b.before) {
          safely(b.before);
          /* app.js clears goalDraft and reflDraft on every hash change, so a
             beat that opens the wizard or the reflection editor has to re-arm
             it and force the repaint itself. Both renders happen inside this
             one event dispatch, so nothing intermediate ever reaches the glass. */
          let draft = null;
          try { draft = goalDraft || reflDraft; } catch (e) {}
          if (draft) repaint(b.r);
        }
        syncFromRoute();
      });

      /* the practice timer's own module owns the clock; this only mirrors it */
      document.addEventListener("pse:timer", e => {
        const d = (e && e.detail) || {};
        runSeen = true;
        runSecs = +d.seconds || 0;
        runIn = !!d.inWindow;
        paintRun();
      });

      /* CAPTURE phase: app.js listens on document in the bubble phase for the
         same arrows on the roadmap, so this is the only place a decision about
         who handles a key can actually be enforced. */
      document.addEventListener("keydown", e => {
        const t = e.target, tag = (t.tagName || "").toLowerCase();
        if (tag === "input" || tag === "select" || tag === "textarea" || t.isContentEditable) return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;

        const k = e.key;

        if (k === "p" || k === "P") { setOn(!on); e.preventDefault(); return; }
        if (!on) return;                /* off, every key still belongs to the app */

        if (k === "Escape") {
          if (document.body.classList.contains("ask-open")) return;   /* the assistant owns Escape */
          if (!help.hidden) { help.hidden = true; stop(e); return; }
          if (onCanvas() && focusedStage() >= 0) { Journey.overview(); stop(e); return; }
          setOn(false); stop(e); return;
        }

        if (k === "?" || (k === "/" && e.shiftKey)) {
          if (help.hidden) {
            paintHelp();
            help.hidden = false;
            /* open the script where the presenter actually is, not at beat one */
            const cur = help.querySelector(".pm-arc li.on");
            if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "center" });
          } else help.hidden = true;
          stop(e); return;
        }

        if (k === "ArrowRight" || k === "PageDown" ||
            (k === " " && tag !== "button" && tag !== "a" && tag !== "summary")) {
          if (onCanvas() && focusedStage() < stageNodes().length - 1) { Journey.step(1); stop(e); return; }
          step(1); stop(e); return;
        }
        if (k === "ArrowLeft" || k === "PageUp") {
          if (onCanvas() && focusedStage() > 0) { Journey.step(-1); stop(e); return; }
          step(-1); stop(e); return;
        }

        if (k === "+" || k === "=") { setZoom(zoom + 1); stop(e); return; }
        if (k === "-" || k === "_") { setZoom(zoom - 1); stop(e); return; }
        if (k === "0") { setZoom(1); stop(e); return; }

        if (k === "d" || k === "D") {
          persona = (persona + 1) % PERSONAS.length;
          applyPersona(); stop(e); return;
        }

        if (/^[1-9]$/.test(k)) {
          const i = ARC.findIndex(a => a.k === k);
          if (i >= 0) { jump(i); stop(e); }
          return;
        }
      }, true);
    },

    /* No page DOM is decorated here — the bar only has to stay honest about
       where the presenter has ended up, including navigation by mouse. */
    onRender() { if (on) syncFromRoute(); }
  };
})();

</script>
<script>
/* =============================================================================
   radar.js — the skill gap as a shape.

   Section 10 asks for a gap analysis; the page answers it with ten separate
   rows, which is a table of differences rather than a picture of one. A radar
   states the same numbers as a silhouette, so the dent is the finding.

   It also repairs a half-live screen. app.js patches the two value readouts
   and the gap bar on every slider move but nothing else, so the summary tiles
   keep naming a gap the student has just closed — a UI where some derived
   values follow the drag and others freeze reads as broken, and undermines the
   claim that the score is computed. This module makes the whole consequence
   chain move at once: shape, tiles, row pill.
   ========================================================================== */

PSEFX.radar = (function () {
  const R = 110;          /* outer radius, in viewBox units                   */
  const LAB = 128;        /* label ring, far enough out to clear the spokes   */
  const LH = 12;          /* line height for a wrapped label                  */
  const RINGS = [2, 4, 6, 8, 10];

  /* The viewBox is wider than it is tall because the labels, not the chart,
     decide the horizontal extent: "Time management" and "Adaptability" sit on
     the near-horizontal axes and must never be clipped or truncated. */
  const VB = "-196 -150 392 300";

  let api = null;
  let elCur = null, elTgt = null, dots = [], statGrid = null;
  let dispC = [], dispT = [];     /* what is on screen right now, 0-10        */
  let gen = 0;                    /* cancels a tween that a newer one replaced */

  /* Module scope, so it survives the teardown between renders: it is the only
     way to know whether a value actually changed since it was last drawn. */
  let drawn = null;

  const esc = s => String(s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const ang = (i, n) => (-90 + i * (360 / n)) * Math.PI / 180;

  /* Decorate only our own DOM: anything another module has claimed is theirs. */
  function foreign(el) {
    const o = el.closest("[data-fx-own]");
    return !!o && o.getAttribute("data-fx-own") !== "radar";
  }

  /* Long names wrap at their space; they are never shortened, because a
     truncated axis label would misreport the student's own skill list. */
  function wrap(name) {
    if (name.length <= 11) return [name];
    const sp = name.indexOf(" ");
    return sp > 0 ? [name.slice(0, sp), name.slice(sp + 1)] : [name];
  }

  function dotTitle(r) {
    if (!r.current && !r.target) return r.name + " — not rated";
    return r.name + " — " + r.current + " of 10, target " + (r.target ? r.target + " of 10" : "not set");
  }

  function points(vals, n) {
    return vals.map((v, i) => {
      const rr = (v / 10) * R, a = ang(i, n);
      return (rr * Math.cos(a)).toFixed(2) + "," + (rr * Math.sin(a)).toFixed(2);
    }).join(" ");
  }

  function markup(rows) {
    const n = rows.length;
    const rings = RINGS.map(v =>
      `<circle class="fx-r-ring" cx="0" cy="0" r="${(v / 10 * R).toFixed(1)}"/>`).join("");

    const spokes = rows.map((r, i) => {
      const a = ang(i, n);
      return `<line class="fx-r-spoke" x1="0" y1="0" x2="${(R * Math.cos(a)).toFixed(1)}" y2="${(R * Math.sin(a)).toFixed(1)}"/>`;
    }).join("");

    const labs = rows.map((r, i) => {
      const a = ang(i, n), cs = Math.cos(a), sn = Math.sin(a);
      const anchor = cs > 0.15 ? "start" : cs < -0.15 ? "end" : "middle";
      const lines = wrap(r.name);
      /* A label above the chart grows upward from its anchor, one below grows
         downward, one at the side is centred on it — so no label ever sits on
         top of the axis it names. */
      const y = sn < -0.35 ? LAB * sn - (lines.length - 1) * LH
              : sn > 0.35  ? LAB * sn + 9
              : LAB * sn - (lines.length - 1) * LH / 2 + 4;
      const x = (LAB * cs).toFixed(1);
      return `<text class="fx-r-lab" x="${x}" y="${y.toFixed(1)}" text-anchor="${anchor}">` +
        lines.map((t, j) => `<tspan x="${x}" dy="${j ? LH : 0}">${esc(t)}</tspan>`).join("") +
        `</text>`;
    }).join("");

    const dotm = rows.map(r =>
      `<circle class="fx-r-dot" r="3" cx="0" cy="0"><title>${esc(dotTitle(r))}</title></circle>`).join("");

    return `<svg class="fx-r-svg" viewBox="${VB}" role="img" aria-label="Radar of your skill ratings: the solid shape is where you are now, the dashed outline is your target.">` +
      `<g class="fx-r-grid">${rings}${spokes}</g>` +
      `<g class="fx-r-labs">${labs}</g>` +
      `<polygon class="fx-r-target" points=""/>` +
      `<polygon class="fx-r-current" points=""/>` +
      `<g class="fx-r-dots">${dotm}</g>` +
      `</svg>` +
      `<figcaption>Your ten skills: solid shape is where you are, dashed outline is where you need to be.</figcaption>`;
  }

  function paint() {
    if (!elCur) return;
    const n = dispC.length;
    elCur.setAttribute("points", points(dispC, n));
    elTgt.setAttribute("points", points(dispT, n));
    for (let i = 0; i < n; i++) {
      const rr = (dispC[i] / 10) * R, a = ang(i, n);
      dots[i].setAttribute("cx", (rr * Math.cos(a)).toFixed(2));
      dots[i].setAttribute("cy", (rr * Math.sin(a)).toFixed(2));
    }
  }

  /* Every move starts from whatever is currently on screen, so a fast drag
     re-aims the same vertex instead of stacking fighting animations. */
  function tweenTo(nc, nt, ms) {
    gen++;
    if (!elCur) return;
    if (api.reduced || !ms) { dispC = nc.slice(); dispT = nt.slice(); paint(); return; }
    const g = gen, fc = dispC.slice(), ft = dispT.slice();
    api.raf(elapsed => {
      if (g !== gen || !elCur) return false;
      const t = Math.min(1, elapsed * 1000 / ms), e = api.ease.out(t);
      for (let i = 0; i < nc.length; i++) {
        dispC[i] = fc[i] + (nc[i] - fc[i]) * e;
        dispT[i] = ft[i] + (nt[i] - ft[i]) * e;
      }
      paint();
      return t < 1;
    });
  }

  function record(rows) {
    drawn = {};
    rows.forEach(r => { drawn[r.id] = [r.current, r.target]; });
  }

  function changed(rows) {
    if (!drawn) return true;
    return rows.some(r => {
      const d = drawn[r.id];
      return !d || d[0] !== r.current || d[1] !== r.target;
    });
  }

  /* --- the three summary tiles, recomputed exactly as V.skills computes them */
  function tile(key) {
    if (!statGrid) return null;
    const all = statGrid.querySelectorAll(".card.stat");
    for (let i = 0; i < all.length; i++) {
      const k = all[i].querySelector(".k");
      if (k && k.textContent.trim() === key) return all[i];
    }
    return null;
  }

  function syncTiles(rows) {
    const rated = rows.filter(r => r.current && r.target);
    const top = rows.filter(r => r.gap > 0).sort((a, b) => b.gap - a.gap)[0];
    const strengths = rows.filter(r => r.current >= 7).sort((a, b) => b.current - a.current).slice(0, 3);

    const t1 = tile("Skills rated");
    if (t1) {
      /* The "/10" lives in a sibling <span>; only the leading text node is ours. */
      const v = t1.querySelector(".v");
      if (v && v.firstChild && v.firstChild.nodeType === 3) v.firstChild.nodeValue = String(rated.length);
    }

    const t2 = tile("Biggest opportunity");
    if (t2) {
      const v = t2.querySelector(".v"), d = t2.querySelector(".d");
      if (v) v.textContent = top ? top.name : "—";
      if (d) d.textContent = top
        ? top.current + "/10 → " + top.target + "/10, a gap of " + top.gap
        : "Rate your skills to see this";
    }

    const t3 = tile("Strengths");
    if (t3) {
      const v = t3.querySelector(".v");
      if (v) v.textContent = strengths.length ? strengths.map(s => s.name).join(", ") : "—";
    }
  }

  /* The row is rewritten by class and text only — its <input> must keep focus
     through the whole drag, so innerHTML is never an option here. */
  function syncPill(input, row) {
    const host = input.closest(".skill-row");
    if (!host || foreign(host)) return;
    const pill = host.querySelector(".skill-top > .pill");
    if (!pill) return;
    if (row.gap > 0)      { pill.className = "pill warn"; pill.textContent = "Gap of " + row.gap; }
    else if (row.current) { pill.className = "pill ok";   pill.textContent = "At target"; }
    else                  { pill.className = "pill";      pill.textContent = "Not rated"; }
  }

  function onInput(e) {
    const el = e.target;
    if (!elCur || !el || !el.getAttribute) return;
    const path = el.getAttribute("data-set");
    if (!path) return;
    const m = path.match(/^skills\.([^.]+)\.(current|target)$/);
    if (!m) return;

    /* This listener is registered after app.js's, so the store has already
       taken the new value by the time we read it back. */
    const rows = Store.skillRows();
    const i = rows.findIndex(r => r.id === m[1]);
    if (i < 0) return;

    tweenTo(rows.map(r => r.current), rows.map(r => r.target), 180);
    const ttl = dots[i] && dots[i].querySelector("title");
    if (ttl) ttl.textContent = dotTitle(rows[i]);
    syncTiles(rows);
    syncPill(el, rows[i]);
    record(rows);
  }

  return {
    init(a) { api = a; },

    onRender(root, ctx, a) {
      api = a;
      elCur = elTgt = statGrid = null; dots = [];
      if (ctx.route !== "#/skills") return;

      const first = root.querySelector(".skill-row");
      if (!first || foreign(first)) return;
      const card = first.closest(".card");
      if (!card || !card.parentNode) return;

      const rows = Store.skillRows();
      if (rows.length < 3) return;

      const fig = document.createElement("figure");
      fig.className = "fx-radar";
      fig.setAttribute("data-fx-own", "radar");
      fig.innerHTML = markup(rows);
      card.parentNode.insertBefore(fig, card);

      elCur = fig.querySelector(".fx-r-current");
      elTgt = fig.querySelector(".fx-r-target");
      dots = Array.prototype.slice.call(fig.querySelectorAll(".fx-r-dot"));

      /* Claim the summary row so the counters module leaves those numbers to
         us — we are the ones that have to keep them true during a drag. */
      const grid = root.querySelector(".grid.g3");
      if (grid && !foreign(grid)) { grid.setAttribute("data-fx-own", "radar"); statGrid = grid; }

      const nc = rows.map(r => r.current), nt = rows.map(r => r.target);
      const moved = changed(rows);
      if (!drawn) {
        /* First sight of the page this session: the shape grows out of the
           centre, which is the one moment the chart explains what it is. */
        dispC = nc.map(() => 0); dispT = nt.map(() => 0);
        paint(); tweenTo(nc, nt, 600);
      } else if (moved) {
        dispC = rows.map(r => (drawn[r.id] || [0, 0])[0]);
        dispT = rows.map(r => (drawn[r.id] || [0, 0])[1]);
        paint(); tweenTo(nc, nt, 420);
      } else {
        dispC = nc.slice(); dispT = nt.slice();
        paint();
      }
      record(rows);

      /* document, not #page: app.js writes the store from its own document
         listener, and ours must run after that write, not before it. */
      api.on(document, "input", onInput);
      api.onTeardown(() => { elCur = elTgt = statGrid = null; dots = []; });
    }
  };
})();

</script>
<script>
/* =============================================================================
   ring.js — the readiness ring, drawn as the seven parts it is actually made of.

   Section 24 insists the score never feels arbitrary. The page does explain it,
   but in a separate card of seven flat bars sitting a long way from the ring
   that states the number — so the explanation and the claim never meet. Here
   the ring itself carries the composition: one arc per readiness part, drawn in
   PSE.readinessParts order, which is also the order the module teaches
   (exploration, skills, goals, CW1, practice, LinkedIn, reflections — stage 03
   through stage 08). The motion is the lesson: by the time the number stops
   counting, the viewer has seen where it came from.

   Nothing here loops. A segment moves only when its part's earned value moved.
   ========================================================================== */

PSEFX.ring = (function () {

  /* One accent ramp, not seven hues. The ring states a single number; seven
     competing colours would read as seven unrelated metrics and would collide
     with the chart palette, which belongs to comparison charts only. */
  const RAMP = {
    explore:  "var(--accent-deep)",   /* #1B4296 — the token, not the literal */
    skills:   "var(--accent)",        /* #2559C7 — likewise                   */
    goals:    "#2F68DC",
    cw1:      "#3E7BE8",
    practice: "#5B90EE",
    cw2:      "#7BA7F2",
    reflect:  "#9CBDF6"
  };

  const STROKE   = 8;    /* matches the ring the view prints, so nothing shifts */
  const GAP      = 2;    /* separator between segments, in path pixels          */
  const SEG_MS   = 260;
  const STAGGER  = 90;
  const NUM_MS   = 420;  /* a number counting in 260ms reads as a flicker       */

  const SVGNS = "http://www.w3.org/2000/svg";

  /* What each route's ring last showed. Module scope rather than api state:
     everything held through api is torn down before the next onRender, and
     this record has to survive exactly that gap to know what changed. */
  const seen = new Map();   /* route -> { total, parts: { id: earned } } */

  /* The rows of "What builds your score", claimed once per render so a hovered
     segment can light the row that explains it. */
  let rows = null, lit = null;

  const clamp01 = t => (t < 0 ? 0 : t > 1 ? 1 : t);

  function svgEl(name, attrs) {
    const n = document.createElementNS(SVGNS, name);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }

  /* Skip anything another engineer has claimed; claim nothing of theirs. */
  function claimable(node) {
    const owner = node.closest("[data-fx-own]");
    return !owner || owner.getAttribute("data-fx-own") === "ring";
  }

  /* --- geometry -----------------------------------------------------------
     Every part contributes earned/100 of the circumference, so the seven arcs
     laid end to end are exactly the total the centre number claims. The svg
     already carries transform: rotate(-90deg), so a running sum of arc lengths
     lands the segments clockwise from twelve o'clock with no trigonometry. */
  function geometry(parts, c) {
    const out = [];
    let run = 0;
    PSE.readinessParts.forEach(p => {
      const got = parts[p.id] || { earned: 0, max: p.max };
      const span = (got.earned / 100) * c;
      /* A part worth nothing gets no arc at all — an empty score should look
         empty, not like seven hairlines. */
      if (got.earned > 0) {
        out.push({
          id: p.id, label: p.label, earned: got.earned, max: got.max,
          len: Math.max(0, span - GAP), off: run
        });
      }
      run += span;
    });
    return out;
  }

  function setArc(node, len, off, c) {
    const L = Math.max(0, len);
    node.setAttribute("stroke-dasharray", L + " " + Math.max(0, c - L));
    /* Negative offset walks the dash forward along the path, which is how a
       segment starts where the previous one ended. */
    node.setAttribute("stroke-dashoffset", String(-off));
  }

  /* --- the hover link between an arc and the row that explains it ---------- */
  function claimRows(root) {
    const cards = root.querySelectorAll(".card");
    for (let i = 0; i < cards.length; i++) {
      const h = cards[i].querySelector(".card-h h3");
      if (!h || h.textContent.trim() !== "What builds your score") continue;
      if (!claimable(cards[i])) return null;
      const body = cards[i].querySelector(".card-b");
      if (!body) return null;
      let n = 0;
      for (let c = body.firstElementChild; c; c = c.nextElementSibling) {
        const p = PSE.readinessParts[n++];
        /* Stamp only — another module animates the bars inside these rows and
           rewriting their markup would destroy its work mid-tween. */
        if (p) c.setAttribute("data-part", p.id);
      }
      return body;
    }
    return null;
  }

  function light(segs, id) {
    segs.forEach(s => { s.style.opacity = s.getAttribute("data-arc") === id ? "1" : ".32"; });
    if (lit) lit.classList.remove("fx-lit");
    lit = rows ? rows.querySelector('[data-part="' + id + '"]') : null;
    if (lit) lit.classList.add("fx-lit");
  }

  function unlight(segs) {
    segs.forEach(s => { s.style.opacity = ""; });
    if (lit) lit.classList.remove("fx-lit");
    lit = null;
  }

  /* --- one ring ------------------------------------------------------------ */
  function decorate(host, ctx, api) {
    const size = parseFloat(host.style.width) || host.offsetWidth || 132;
    const svg  = host.querySelector("svg");
    const num  = host.querySelector(".mid b");
    if (!svg) return;

    const r = size / 2 - 7, c = 2 * Math.PI * r, mid = size / 2;
    const R = Store.readiness();
    const geo = geometry(R.parts, c);

    /* The hero ring sits on --dark and My Career's sits on white; one hard
       coded track colour would look broken on one of them. */
    const track = host.closest(".panel-dark") ? "#1E2B45" : "var(--surface-3)";

    const before = seen.get(ctx.route);
    const prevGeo = before ? geometry(inflate(before.parts), c) : null;
    const prevOf = id => {
      if (!prevGeo) return null;
      for (let i = 0; i < prevGeo.length; i++) if (prevGeo[i].id === id) return prevGeo[i];
      return null;
    };

    /* render() hands us brand-new default markup every time, so the two
       printed circles are replaced rather than edited. */
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.appendChild(svgEl("circle", {
      cx: mid, cy: mid, r: r, fill: "none", stroke: track, "stroke-width": STROKE
    }));

    const segs = geo.map(g => {
      const node = svgEl("circle", {
        cx: mid, cy: mid, r: r, fill: "none",
        stroke: RAMP[g.id] || "var(--accent)",
        "stroke-width": STROKE, "stroke-linecap": "butt",
        "data-arc": g.id, tabindex: "0", role: "img"
      });
      const words = g.label + " — " + g.earned + " of " + g.max;
      const t = svgEl("title", {});
      t.textContent = words;
      node.appendChild(t);
      /* <title> gives the pointer a tooltip; aria-label is what a screen
         reader reliably reads off a focused shape. */
      node.setAttribute("aria-label", words);
      svg.appendChild(node);
      return node;
    });

    host.setAttribute("data-fx-own", "ring");

    const setNum = v => { if (num) num.textContent = String(Math.round(v)); };
    const final = () => { geo.forEach((g, i) => setArc(segs[i], g.len, g.off, c)); setNum(R.total); };

    if (api.reduced) {
      final();                                   /* every value still visible */
    } else if (!before) {
      /* First sight of this ring: it composes itself, part by part, and the
         number finishes counting on the same frame the last arc lands. */
      const span = geo.length ? (geo.length - 1) * STAGGER + SEG_MS : 0;
      if (!span) { final(); }
      else {
        geo.forEach((g, i) => setArc(segs[i], 0, g.off, c));
        setNum(0);
        api.raf(t => {
          const ms = t * 1000;
          geo.forEach((g, i) => {
            setArc(segs[i], g.len * api.ease.out(clamp01((ms - i * STAGGER) / SEG_MS)), g.off, c);
          });
          setNum(R.total * api.ease.out(clamp01(ms / span)));
          if (ms < span) return true;
          final();
          return false;
        });
      }
    } else {
      /* A return visit. Only what the student actually changed may move — an
         arc that redraws itself on every navigation is the screensaver the
         brief forbids. An upstream part growing does shift everything after
         it, so a segment tweens when its start moved as well as its length. */
      const moved = [];
      geo.forEach((g, i) => {
        const was = prevOf(g.id);
        const from = was ? was : { len: 0, off: g.off };
        if (Math.abs(from.len - g.len) < 0.01 && Math.abs(from.off - g.off) < 0.01) {
          setArc(segs[i], g.len, g.off, c);
        } else {
          setArc(segs[i], from.len, from.off, c);
          moved.push({ node: segs[i], from: from, to: g });
        }
      });
      const numMoved = before.total !== R.total;
      if (!moved.length && !numMoved) { final(); }
      else {
        setNum(before.total);
        const span = Math.max(moved.length ? SEG_MS : 0, numMoved ? NUM_MS : 0);
        api.raf(t => {
          const ms = t * 1000;
          const ea = api.ease.out(clamp01(ms / SEG_MS));
          moved.forEach(m => setArc(m.node,
            m.from.len + (m.to.len - m.from.len) * ea,
            m.from.off + (m.to.off - m.from.off) * ea, c));
          setNum(before.total + (R.total - before.total) * api.ease.out(clamp01(ms / NUM_MS)));
          if (ms < span) return true;
          final();
          return false;
        });
      }
    }

    /* Hovering an arc isolates it and, on the dashboard, lights the sentence
       that earned it. This is information, not motion, so reduced motion keeps
       it — and it is what makes the tab stop on each segment worth having even
       on My Career, where there is no breakdown card to light. */
    if (segs.length) {
      segs.forEach(node => {
        const id = node.getAttribute("data-arc");
        api.on(node, "pointerenter", () => light(segs, id));
        api.on(node, "focus", () => light(segs, id));
        api.on(node, "pointerleave", () => unlight(segs));
        api.on(node, "blur", () => unlight(segs));
      });
      api.onTeardown(() => { if (lit) lit.classList.remove("fx-lit"); lit = null; });
    }

    const record = {};
    PSE.readinessParts.forEach(p => { record[p.id] = (R.parts[p.id] || {}).earned || 0; });
    seen.set(ctx.route, { total: R.total, parts: record });
  }

  /* The record stores plain earned values; geometry() wants readiness shapes. */
  function inflate(parts) {
    const out = {};
    PSE.readinessParts.forEach(p => { out[p.id] = { earned: parts[p.id] || 0, max: p.max }; });
    return out;
  }

  return {
    onRender(root, ctx, api) {
      const hosts = root.querySelectorAll(".ring");
      if (!hosts.length || !window.PSE || !window.Store) return;
      rows = claimRows(root);
      lit = null;
      hosts.forEach(host => { if (claimable(host)) decorate(host, ctx, api); });
    }
  };
})();

</script>
<script>
/* =============================================================================
   score.js — the live readiness ledger.

   The platform's whole argument is that a seven-part weighted model reads the
   student's own work and turns it into a number. render() replaces #page
   wholesale, so every stat, bar and rail score is printed already at its final
   value and no number has visibly moved since boot — the model computes, but
   nobody in the room can see it compute.

   This module makes the arithmetic legible. It records a career view (the
   single most demoable action on the platform, and the one piece of state
   nothing outside loadSample() ever wrote), then counts the rail score to its
   new total and names the part that moved. Nothing here loops and nothing
   animates a value that did not change: an unchanged number is left exactly as
   the view printed it.
   ========================================================================== */

PSEFX.score = (function () {

  const DUR_NUM = 520;          /* the count */
  const DUR_BAR = 600;          /* the fill, a touch behind it */
  const CHIP_LIFE = 1600;
  const CHIP_STILL = 2400;      /* reduced motion: long enough to read, static */
  const PULSE = 600;
  const STAGGER = 40, STAGGER_MAX = 8;

  /* Rings, the journey canvas, the LinkedIn preview and the skills gap bar are
     other engineers' surfaces; their numbers are theirs to move. */
  const SKIP = ".ring, .journey, .li-prev, .gapbar";

  let boot = null;              /* the api handed to init() — outlives every page */
  let prev = null;              /* the readiness the rail is currently showing */
  let prevAch = {};
  let shown = 0;                /* the rail number as a float, mid-count */

  let chip = null, chipObs = null, chipT = 0, chipBorn = 0;
  let pulseT = 0;
  let railCancel = null;

  /* Survives the teardown between renders on purpose: knowing what a number was
     last time is the only way to tell a recalculation from a re-render. */
  const seen = new Map();

  /* data.js, store.js and fx.js declare PSE / Store / FX with `const` in a
     classic script, so they are script-scope bindings and NOT properties of
     window — reach them by bare name, never through window.<x>. */
  const reduced = () => (typeof FX !== "undefined" ? FX.reduced() : !!(boot && boot.reduced));
  const now = () => (typeof performance !== "undefined" && performance.now ? performance.now() : Date.now());
  const easeOut = t => (boot && boot.ease ? boot.ease.out(t) : 1 - Math.pow(1 - t, 3));

  /* --- A. record a career view -------------------------------------------
     state.viewed is read in five places and was never written outside the
     sample workspace, so a real student capped at 85/100 and roadmap stage 03
     could never complete. Opening a career detail page is the evidence; this
     is where it gets recorded. ------------------------------------------- */
  function recordView(ctx) {
    const r = (ctx && ctx.route) || "";
    if (r.indexOf("#/career/") !== 0) return;
    const id = r.slice(9);
    if (!id || typeof PSE === "undefined" || !PSE.careers.some(c => c.id === id)) return;
    const st = Store.get();
    if (!st || !Array.isArray(st.viewed) || st.viewed.indexOf(id) >= 0) return;
    /* Store.update only notifies renderRail and this module, never render(), so
       there is no recursion back into onRender. */
    Store.update(s => { s.viewed.push(id); });
  }

  /* --- B. the rail ---------------------------------------------------------
     app.js reprints #railscore wholesale on every state change AND again at the
     end of render(), so nodes are re-queried on every frame rather than held. */

  function railHost() { return document.getElementById("railscore"); }

  function paintRail(num, pct, last) {
    const host = railHost();
    if (!host) return;
    const v = host.querySelector(".v");
    if (v && v.firstChild && v.firstChild.nodeType === 3) {
      v.firstChild.nodeValue = String(Math.round(num));   /* the <small>/100</small> sibling is untouched */
    }
    const fill = host.querySelector(".bar > i");
    if (fill) {
      /* app.css gives .bar > i a .5s width transition; driving it per frame and
         easing it at the same time would produce two overlapping curves. */
      fill.style.transition = last ? "" : "none";
      fill.style.width = Math.max(0, Math.min(100, pct)) + "%";
    }
  }

  function railTo(total) {
    if (railCancel) railCancel();
    if (reduced()) { shown = total; paintRail(total, total, true); return; }

    const from = shown, to = total;
    if (from === to) return;
    let raf = 0, dead = false, t0 = null;
    const step = ts => {
      if (dead) return;
      if (t0 === null) t0 = ts;
      const ms = ts - t0;
      const n = from + (to - from) * easeOut(Math.min(1, ms / DUR_NUM));
      const b = from + (to - from) * easeOut(Math.min(1, ms / DUR_BAR));
      shown = n;
      const done = ms >= DUR_BAR;
      paintRail(done ? to : n, done ? to : b, done);
      if (done) { shown = to; railCancel = null; return; }
      raf = requestAnimationFrame(step);
    };
    /* Not api.raf: this is started from a Store subscription that can fire at
       any moment, and api.raf is torn down by the next navigation mid-count. */
    raf = requestAnimationFrame(step);
    railCancel = () => { dead = true; cancelAnimationFrame(raf); railCancel = null; };
  }

  function removeChip() {
    clearTimeout(chipT);
    if (chipObs) { chipObs.disconnect(); chipObs = null; }
    if (chip && chip.parentNode) chip.parentNode.removeChild(chip);
    chip = null;
  }

  function showChip(text, down) {
    removeChip();
    const host = railHost();
    if (!host) return;
    chip = document.createElement("span");
    chip.className = "fx-delta" + (down ? " down" : "") + (reduced() ? " still" : "");
    chip.setAttribute("data-fx-own", "score");
    chip.textContent = text;
    chipBorn = now();
    host.appendChild(chip);

    /* renderRail rewrites #railscore.innerHTML on every state change, and one
       click can trigger two of them, so the chip re-seats itself rather than
       being lost between the score changing and the page finishing its render. */
    chipObs = new MutationObserver(() => {
      if (chip && !chip.isConnected) {
        const h = railHost();
        if (h) {
          /* Re-inserting a node restarts its CSS animation, but the removal
             timer is absolute — navigate during the chip's life and it would
             snap back to full opacity and then be cut off mid-fade. A negative
             delay resumes the fade exactly where the reprint interrupted it. */
          chip.style.animationDelay = -(now() - chipBorn) + "ms";
          h.appendChild(chip);
        }
      }
      /* The reprint carries the final total. Observer callbacks run before the
         browser paints, so putting the count back where it actually is here is
         what stops a one-frame jump to the answer halfway through the count. */
      if (railCancel) paintRail(shown, shown, false);
    });
    chipObs.observe(host, { childList: true });
    chipT = setTimeout(removeChip, reduced() ? CHIP_STILL : CHIP_LIFE);
  }

  function pulse() {
    if (reduced()) return;
    const host = railHost();
    if (!host) return;
    host.classList.remove("fx-pulse");
    void host.offsetWidth;
    host.classList.add("fx-pulse");
    clearTimeout(pulseT);
    pulseT = setTimeout(() => { const h = railHost(); if (h) h.classList.remove("fx-pulse"); }, PULSE + 40);
  }

  const snap = R => {
    const parts = {};
    Object.keys(R.parts).forEach(k => { parts[k] = R.parts[k].earned; });
    return { total: R.total, parts: parts };
  };

  /* Which part of the model moved most — ties go to the first part in the
     order PSE.readinessParts teaches, which is also the module's own order. */
  function mover(before, after) {
    let best = null, size = 0;
    PSE.readinessParts.forEach(p => {
      const d = Math.abs((after[p.id] || 0) - (before.parts[p.id] || 0));
      if (d > size) { size = d; best = p; }
    });
    return best;
  }

  function onState() {
    const R = Store.readiness();
    if (!prev) { prev = snap(R); shown = R.total; return; }

    const ach = Store.achievements();
    let won = null;
    ach.forEach(a => { if (a.earned && !prevAch[a.id] && !won) won = a; });

    const d = R.total - prev.total;
    const after = snap(R);

    if (d !== 0) {
      const p = mover(prev, after.parts);
      showChip((d > 0 ? "+" : "−") + Math.abs(d) + (p ? " · " + p.label : ""), d < 0);
      railTo(R.total);
    } else if (won) {
      /* A threshold crossed without the total moving is still news. */
      showChip("Achievement · " + won.label, false);
      pulse();
    }

    prev = after;
    prevAch = {};
    ach.forEach(a => { prevAch[a.id] = a.earned; });
  }

  /* --- C. the numbers on the page ----------------------------------------- */

  function ownedByUs(el) {
    if (el.closest(SKIP)) return false;
    const own = el.closest("[data-fx-own]");
    return !own || own.getAttribute("data-fx-own") === "score";
  }

  /* A chain of child indices from #page: stable across renders of the same
     route, and unique enough to tell the third stat tile from the fourth. */
  function pathOf(el, root) {
    const out = [];
    let n = el;
    while (n && n !== root && n.parentNode) {
      out.push(Array.prototype.indexOf.call(n.parentNode.children, n));
      n = n.parentNode;
    }
    return out.reverse().join(".");
  }

  function readNumber(el) {
    const t = el.firstChild;
    if (!t || t.nodeType !== 3) return null;
    const m = /^\s*([+-]?\d+(?:\.\d+)?)([\s\S]*)$/.exec(t.nodeValue);
    if (!m) return null;
    const dec = m[1].indexOf(".") >= 0;
    const tail = m[2];                      /* "%" and the like stay put */
    /* A tail that opens with a digit or a separator means the match cut a
       grouped figure in half ("1,234"); counting it would print "0,234". */
    if (/^[.,\d]/.test(tail)) return null;
    return {
      value: parseFloat(m[1]),
      write: v => { t.nodeValue = (dec ? v.toFixed(1) : String(Math.round(v))) + tail; },
      dur: DUR_NUM
    };
  }

  function readBar(el) {
    const m = /^\s*([\d.]+)%\s*$/.exec(el.style.width || "");
    if (!m) return null;
    return {
      value: parseFloat(m[1]),
      write: (v, last) => {
        el.style.transition = last ? "" : "none";
        el.style.width = Math.max(0, Math.min(100, v)) + "%";
      },
      dur: DUR_BAR
    };
  }

  function tween(api, delay, job, from, to) {
    if (api.reduced) { job.write(to, true); return; }
    job.write(from, false);                 /* freeze at the start before the frame paints */
    const go = () => api.raf(t => {
      const p = Math.min(1, (t * 1000) / job.dur);
      if (p >= 1) { job.write(to, true); return false; }
      job.write(from + (to - from) * api.ease.out(p), false);
    });
    if (delay) api.after(delay, go); else go();
  }

  function sweep(root, ctx, api) {
    const stamp = (ctx && ctx.route ? ctx.route : "") + "|";
    let step = 0;
    Array.prototype.forEach.call(root.querySelectorAll(".stat .v, .bar > i"), el => {
      if (!ownedByUs(el)) return;
      const job = el.tagName === "I" ? readBar(el) : readNumber(el);
      if (!job) return;                     /* a name, a dash, an em rule — leave it as rendered */

      const key = stamp + pathOf(el, root);
      const known = seen.has(key);
      const from = known ? seen.get(key) : 0;
      seen.set(key, job.value);

      /* The rule that keeps this from becoming a screensaver: a value that did
         not change is not a recalculation, so it does not move. */
      if (known && Math.abs(from - job.value) < 0.005) return;

      tween(api, Math.min(step, STAGGER_MAX) * STAGGER, job, from, job.value);
      step++;
    });
  }

  return {
    init(api) {
      boot = api;
      const R = Store.readiness();
      prev = snap(R);
      shown = R.total;
      Store.achievements().forEach(a => { prevAch[a.id] = a.earned; });
      /* Once, here — there is no unsubscribe, so a subscription per navigation
         would leak one listener for every click of a two-hour demo. */
      Store.subscribe(onState);
    },

    onRender(root, ctx, api) {
      recordView(ctx);

      /* Other modules stamp data-fx-own during this same synchronous sweep and
         script order belongs to the integrator, not to us. A microtask is the
         last moment that is after every module has had its turn and still
         before the browser paints, so nothing is claimed twice and nothing
         flashes at its final value first. */
      const pass = { dead: false };
      api.onTeardown(() => { pass.dead = true; });
      Promise.resolve().then(() => {
        if (pass.dead || !root.isConnected) return;
        try { sweep(root, ctx, api); }
        catch (e) { console.warn("[fx] score sweep:", e && e.message); }
      });
    }
  };
})();

</script>
<script>
/* =============================================================================
   timer.js — the 5–7 minute window, drawn.

   Section 18 asks for a 5–7 minute individual speaking target. What the app
   paints is a stopwatch whose target window exists only as a sentence in a
   caption, so a presenter rehearsing to it has to do the arithmetic in their
   head while they are talking. The dial states it instead: the green band IS
   the window, and the hand crossing into it is a thing a whole room can see.

   app.js owns the clock inside a closure — timerId, seconds, paintTimer. This
   module never drives it. It reads #tface's text and #tbtn's label and draws a
   pure reflection of them, using the same 300 / 420 second thresholds
   paintTimer uses, so the arc and the digits can never disagree on screen.
   ========================================================================== */

PSEFX.timer = (function () {

  /* An eight-minute face rather than a seven-minute one: the window has to sit
     inside the sweep with room left over, or a student who overruns sees a full
     ring and learns nothing about how far over they went. */
  const SWEEP = 480, WIN_A = 300, WIN_B = 420;
  const SIZE = 230, SW = 12, MID = SIZE / 2, R = (SIZE - SW) / 2 - 4;
  const C = 2 * Math.PI * R;

  let api = null;
  let face = null, btn = null, prog = null, band = null;

  /* Read from the DOM, never authored here. */
  let secs = 0, running = false, markAt = 0;
  let looping = false, hit300 = false, sent = { s: 0, r: false };

  /* Survives teardown so a saved run can collapse on the page that replaces it. */
  let lastCount = -1, collapseFrom = 0, collapsing = false;

  const now = () => (window.performance ? performance.now() : Date.now());
  const mmss = n => Math.floor(n / 60) + ":" + String(Math.round(n) % 60).padStart(2, "0");
  const colour = s => s > WIN_B ? "var(--bad)" : s >= WIN_A ? "var(--ok)" : "var(--accent)";

  /* 0 seconds at twelve o'clock, running clockwise. */
  function pt(t, rad) {
    const a = (t / SWEEP) * 2 * Math.PI - Math.PI / 2;
    return [MID + rad * Math.cos(a), MID + rad * Math.sin(a)];
  }

  function dial() {
    const start = (WIN_A / SWEEP) * C, len = ((WIN_B - WIN_A) / SWEEP) * C;
    const cap = t => {
      const a = pt(t, R - SW / 2 - 1), b = pt(t, R + SW / 2 + 1);
      return '<line class="fx-cap" x1="' + a[0].toFixed(2) + '" y1="' + a[1].toFixed(2) +
             '" x2="' + b[0].toFixed(2) + '" y2="' + b[1].toFixed(2) + '"/>';
    };
    /* The band is positioned with a leading zero-length dash so nothing depends
       on the sign convention of stroke-dashoffset. */
    return '<svg class="fx-dial" viewBox="0 0 ' + SIZE + ' ' + SIZE + '" aria-hidden="true" focusable="false">' +
      '<g transform="rotate(-90 ' + MID + ' ' + MID + ')" fill="none" stroke-width="' + SW + '">' +
        '<circle class="fx-track" cx="' + MID + '" cy="' + MID + '" r="' + R + '"/>' +
        '<circle class="fx-band" cx="' + MID + '" cy="' + MID + '" r="' + R + '" opacity=".28"' +
          ' stroke-dasharray="0 ' + start.toFixed(2) + ' ' + len.toFixed(2) + ' ' + C.toFixed(2) + '"/>' +
        '<circle class="fx-prog" cx="' + MID + '" cy="' + MID + '" r="' + R + '"' +
          ' stroke-dasharray="0 ' + C.toFixed(2) + '"/>' +
      '</g>' + cap(WIN_A) + cap(WIN_B) + '</svg>';
  }

  function draw(v, fixed) {
    if (!prog) return;
    const f = Math.max(0, Math.min(1, v / SWEEP));          /* past 8:00 the arc holds full */
    prog.setAttribute("stroke-dasharray", (f * C).toFixed(2) + " " + C.toFixed(2));
    /* Inline style, not a presentation attribute: var() substitution inside a
       presentation attribute is unreliable in WebKit, and this demo runs off a
       USB stick on whatever laptop is in the room. */
    prog.style.setProperty("stroke", fixed || colour(v));
  }

  const interp = () => secs + Math.min(1, Math.max(0, (now() - markAt) / 1000));

  /* Presenter mode mirrors this in its bar. The field names are a contract. */
  function emit() {
    if (secs === sent.s && running === sent.r) return;
    sent = { s: secs, r: running };
    document.dispatchEvent(new CustomEvent("pse:timer", {
      detail: { seconds: secs, running: running, inWindow: secs >= WIN_A && secs <= WIN_B }
    }));
  }

  /* One brightening as the hand enters the window, and never again this run.
     A loop here would be exactly the screensaver the brief warns against. */
  function flash() {
    if (!band || api.reduced) return;
    band.classList.remove("fx-band-lit");
    void band.getBoundingClientRect();
    band.classList.add("fx-band-lit");
    api.on(band, "animationend", () => band.classList.remove("fx-band-lit"), { once: true });
  }

  function kick() {
    if (looping || !running || api.reduced) return;
    looping = true;
    api.raf(() => {
      if (!running || collapsing) { looping = false; return false; }
      draw(interp());
    });
  }

  function sync() {
    if (!face) return;
    const m = /(\d+):(\d+)/.exec(face.textContent || "");
    const s = m ? (+m[1]) * 60 + (+m[2]) : 0;
    const run = !!btn && (btn.textContent || "").indexOf("Pause") >= 0;
    const t = now();

    if (s !== secs) { secs = s; markAt = t; if (s < WIN_A) hit300 = false; }
    if (run !== running) { running = run; if (run) markAt = t; }

    collapsing = false;                 /* a live clock outranks the filing animation */
    if (secs >= WIN_A && !hit300) { hit300 = true; flash(); }
    emit();
    draw(running && !api.reduced ? interp() : secs);
    kick();
  }

  /* Existing data that is written once at save time and then never shown again,
     which is the half of reflective practice the module actually marks. */
  function lastRun(host) {
    const runs = (Store.get().cw1.practice || []);
    if (!runs.length) return;
    const r = runs[runs.length - 1], note = (r.improvement || "").trim();
    const el = document.createElement("div");
    el.className = "fx-lastrun";
    el.setAttribute("data-fx-own", "timer");
    el.textContent = note
      ? "Last time you said: “" + note + "” · " + mmss(r.seconds) + (r.date ? " on " + r.date : "")
      : "Last run: " + mmss(r.seconds) + ", average " + (r.avg || "—") + "/5";
    host.parentNode.insertBefore(el, host);
  }

  function onRender(root, ctx, a) {
    api = a;
    face = root.querySelector("#tface");
    /* Ten of us are decorating this app blind: if anyone else has claimed the
       subtree the clock lives in, it is theirs and we leave it alone. */
    const owner = face && face.closest("[data-fx-own]");
    if (!face || (owner && owner.getAttribute("data-fx-own") !== "timer")) {
      face = prog = band = btn = null; collapseFrom = 0; return;
    }
    btn = root.querySelector("#tbtn");

    /* paintTimer re-queries $("#tface") by id on every tick, so moving the node
       into a positioned wrapper costs app.js nothing. */
    const host = document.createElement("div");
