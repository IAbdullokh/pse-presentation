<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSE Career Platform</title>
<meta name="description" content="A career-development workspace for the Westminster International University Professional Skills and Employability module: career research, skills assessment, SMART goals, CW1 presentation preparation and LinkedIn development.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* =============================================================================
   PSE Career Platform — design system
   A light foundation with one accent, deliberately committed to a single
   visual world (the brief specifies a white/light product). Dark panels are
   used as emphasis, not as a theme.
   ========================================================================== */

:root {
  color-scheme: light;

  --canvas:    #F6F8FB;
  --surface:   #FFFFFF;
  --surface-2: #F1F4F9;
  --surface-3: #E8EDF5;
  --ink-900:   #0C1425;
  --ink-700:   #2B3648;
  --ink-500:   #55617A;
  --ink-400:   #7C889F;
  --ink-300:   #A3AEC2;
  --line:      #E2E8F0;
  --line-2:    #CBD5E4;

  --accent:      #2559C7;
  --accent-deep: #1B4296;
  --accent-soft: #EDF2FD;
  --accent-line: #C3D4F5;

  --ok:    #0B7A4B;
  --ok-bg: #E8F6EF;
  --warn:  #A8620A;
  --warn-bg:#FDF3E5;
  --bad:   #B3261E;
  --bad-bg:#FCEDEC;

  --dark:      #0E1626;
  --dark-2:    #17223A;
  --dark-line: #263349;
  --dark-ink:  #F2F5FA;
  --dark-ink-2:#9FADC6;

  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;

  --sans:  "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Instrument Serif", Georgia, serif;
  --mono:  ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;

  --r-sm: 6px; --r: 10px; --r-lg: 14px; --r-xl: 20px;
  --sh-1: 0 1px 2px rgba(12,20,37,.05);
  --sh-2: 0 1px 3px rgba(12,20,37,.06), 0 8px 24px -12px rgba(12,20,37,.14);
  --sh-3: 0 12px 40px -12px rgba(12,20,37,.24);
  --rail: 258px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--canvas); color: var(--ink-900);
  font-family: var(--sans); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4 { margin: 0; text-wrap: balance; letter-spacing: -0.019em; line-height: 1.2; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* --- shell ------------------------------------------------------------------ */
.app { display: grid; grid-template-columns: var(--rail) minmax(0,1fr); min-height: 100vh; }

.rail {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--dark); border-right: 1px solid var(--dark-line);
  display: flex; flex-direction: column; gap: 6px; padding: 18px 14px 14px;
}
.brand { display: flex; gap: 11px; align-items: center; padding: 4px 8px 16px; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 9px; flex: none;
  background: linear-gradient(150deg, #3E7BE8, #2559C7 62%, #1B4296);
  display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px;
  letter-spacing: -0.03em; box-shadow: 0 2px 10px rgba(37,89,199,.4);
}
.brand-txt { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.brand-txt b { color: var(--dark-ink); font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.brand-txt span { color: var(--dark-ink-2); font-size: 11px; }

.nav { display: flex; flex-direction: column; gap: 1px; }
.nav-label {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .11em;
  color: #6B7A96; padding: 14px 10px 6px; font-weight: 600;
}
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px;
  border-radius: 8px; color: var(--dark-ink-2); text-decoration: none;
  font-size: 13.5px; font-weight: 500; transition: background .13s, color .13s;
}
.nav a svg { width: 17px; height: 17px; flex: none; opacity: .85; }
.nav a .count {
  margin-left: auto; font-size: 11px; color: #7E8DA8; background: #1C2941;
  padding: 1px 7px; border-radius: 999px; font-variant-numeric: tabular-nums;
}
.nav a:hover { background: #18233A; color: var(--dark-ink); }
.nav a.on { background: #1E3A6B; color: #EAF1FE; }
.nav a.on svg { opacity: 1; }
.nav a.on .count { background: #2A4C86; color: #CFE0FB; }

.rail-foot { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--dark-line); display: grid; gap: 8px; }
.rail-score { padding: 10px 11px; background: var(--dark-2); border: 1px solid var(--dark-line); border-radius: var(--r); }
.rail-score .k { font-size: 11px; color: var(--dark-ink-2); }
.rail-score .v { font-size: 22px; font-weight: 650; color: var(--dark-ink); letter-spacing: -0.03em; }
.rail-score .v small { font-size: 12px; font-weight: 500; color: var(--dark-ink-2); }
.rail-mini { display: flex; gap: 6px; }
.rail-mini button {
  flex: 1; background: transparent; border: 1px solid var(--dark-line); color: var(--dark-ink-2);
  border-radius: 7px; padding: 6px; font-size: 11.5px; cursor: pointer;
}
.rail-mini button:hover { color: var(--dark-ink); border-color: #35455F; }

/* --- main ------------------------------------------------------------------- */
main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20; background: rgba(246,248,251,.86);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
  padding: 14px clamp(20px,3.4vw,40px) 13px;
}
.crumb { font-size: 12px; color: var(--ink-400); display: flex; gap: 7px; align-items: center; margin-bottom: 5px; }
.crumb span + span::before { content: "/"; margin-right: 7px; color: var(--line-2); }
.topbar-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.topbar h1 { font-size: clamp(20px,2.4vw,26px); font-weight: 650; }
.topbar .sub { font-size: 13.5px; color: var(--ink-500); margin-top: 3px; max-width: 68ch; }
.page { padding: 24px clamp(20px,3.4vw,40px) 72px; display: grid; gap: 18px; animation: zoomin .28s cubic-bezier(.2,.8,.2,1); transform-origin: 50% 12%; }
@keyframes zoomin { from { opacity: 0; transform: scale(.985); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .page { animation: none; } * { transition: none !important; } }

/* --- primitives -------------------------------------------------------------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--sh-1); }
.card-h { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.card-h h3 { font-size: 15px; font-weight: 620; }
.card-h .sub { font-size: 12.5px; color: var(--ink-400); margin-top: 2px; max-width: 62ch; }
.card-b { padding: 18px; }
.card-f { padding: 12px 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-400); background: var(--surface-2); border-radius: 0 0 var(--r-lg) var(--r-lg); }

.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit,minmax(320px,1fr)); }
.g3 { grid-template-columns: repeat(auto-fit,minmax(250px,1fr)); }
.g4 { grid-template-columns: repeat(auto-fit,minmax(200px,1fr)); }
.split { display: grid; grid-template-columns: minmax(0,1.55fr) minmax(280px,1fr); gap: 16px; align-items: start; }
@media (max-width: 1080px) { .split { grid-template-columns: 1fr; } }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 15px; border-radius: 8px; border: 1px solid var(--line-2);
  background: var(--surface); color: var(--ink-700); font-size: 13.5px; font-weight: 550;
  cursor: pointer; transition: background .13s, border-color .13s, color .13s; text-decoration: none;
}
.btn:hover { background: var(--surface-2); color: var(--ink-900); }
.btn svg { width: 15px; height: 15px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: var(--sh-1); }
.btn-primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); color: #fff; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-500); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-sm { padding: 5px 10px; font-size: 12.5px; border-radius: 7px; }
.btn-danger { color: var(--bad); border-color: #F0C9C6; background: var(--surface); }
.btn-danger:hover { background: var(--bad-bg); }
.btn[disabled] { opacity: .45; pointer-events: none; }

.field { display: grid; gap: 6px; }
.field > label { font-size: 12.5px; font-weight: 550; color: var(--ink-700); }
.field .help { font-size: 12px; color: var(--ink-400); }
input[type=text], input[type=number], input[type=date], input[type=url], select, textarea {
  width: 100%; padding: 9px 11px; background: var(--surface);
  border: 1px solid var(--line-2); border-radius: 8px; font-size: 14px; transition: border-color .13s, box-shadow .13s;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { resize: vertical; min-height: 84px; line-height: 1.55; }
input[type=range] { width: 100%; accent-color: var(--accent); }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 550;
  padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-500); background: var(--surface); white-space: nowrap; }
.pill.ok   { color: var(--ok);   background: var(--ok-bg);   border-color: #BFE5D2; }
.pill.warn { color: var(--warn); background: var(--warn-bg); border-color: #F2DCBB; }
.pill.bad  { color: var(--bad);  background: var(--bad-bg);  border-color: #F2C9C6; }
.pill.acc  { color: var(--accent-deep); background: var(--accent-soft); border-color: var(--accent-line); }
.pill.dot::before { content:""; width:6px; height:6px; border-radius:50%; background: currentColor; }

.bar { height: 7px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .5s cubic-bezier(.2,.7,.2,1); }
.bar.ok > i { background: var(--ok); }

.ring { display: grid; place-items: center; position: relative; }
.ring svg { transform: rotate(-90deg); }
.ring .mid { position: absolute; text-align: center; }
.ring .mid b { display: block; font-size: 26px; font-weight: 680; letter-spacing: -0.03em; line-height: 1; }
.ring .mid span { font-size: 11px; color: var(--ink-400); }

.stat { padding: 14px 16px; }
.stat .k { font-size: 12px; color: var(--ink-400); }
.stat .v { font-size: 25px; font-weight: 660; letter-spacing: -0.028em; line-height: 1.15; margin-top: 2px; }
.stat .d { font-size: 12px; color: var(--ink-400); margin-top: 2px; }

.empty { text-align: center; padding: 34px 20px; color: var(--ink-400); }
.empty h4 { font-size: 14.5px; color: var(--ink-700); margin-bottom: 5px; }
.empty p { font-size: 13px; max-width: 46ch; margin: 0 auto 14px; }

.list { display: grid; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-size: 13.5px; font-weight: 550; }
.row .s { font-size: 12px; color: var(--ink-400); }

table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.tbl th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-400); font-weight: 600; }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }

/* --- dark emphasis panel ------------------------------------------------------ */
.panel-dark {
  background: var(--dark); color: var(--dark-ink); border-radius: var(--r-lg);
  border: 1px solid var(--dark-line); box-shadow: var(--sh-2);
}
.panel-dark .k, .panel-dark .sub { color: var(--dark-ink-2); }
.panel-dark h2, .panel-dark h3 { color: #fff; }

/* --- hero / dashboard --------------------------------------------------------- */
.hero-dark { padding: 26px 28px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 26px; align-items: center; }
@media (max-width: 820px) { .hero-dark { grid-template-columns: 1fr; } }
.hero-dark .greet { font-size: 13px; color: var(--dark-ink-2); }
.hero-dark h2 { font-size: clamp(21px,2.6vw,29px); font-weight: 620; margin: 5px 0 8px; letter-spacing: -0.026em; }
.hero-dark p { font-size: 14px; color: var(--dark-ink-2); max-width: 56ch; }
.hero-actions { display: flex; gap: 9px; margin-top: 16px; flex-wrap: wrap; }
.hero-dark .btn { background: #1E2B45; border-color: #2C3B58; color: var(--dark-ink); }
.hero-dark .btn:hover { background: #253355; color: #fff; }
.hero-dark .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.hero-dark .btn-primary:hover { background: #2F68DC; }

.nextstep { border: 1px solid var(--accent-line); background: var(--accent-soft); border-radius: var(--r-lg); padding: 16px 18px; display: flex; gap: 14px; align-items: flex-start; }
.nextstep .ic { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
.nextstep h3 { font-size: 15px; font-weight: 620; color: var(--accent-deep); }
.nextstep p { font-size: 13px; color: var(--ink-700); margin-top: 3px; max-width: 62ch; }

/* --- roadmap ------------------------------------------------------------------ */
.road { display: grid; gap: 0; }
.road-item { display: grid; grid-template-columns: 46px minmax(0,1fr) auto; gap: 14px; padding: 14px 18px; border-top: 1px solid var(--line); align-items: center; cursor: pointer; transition: background .13s; }
.road-item:first-child { border-top: 0; }
.road-item:hover { background: var(--surface-2); }
.road-n { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 640;
  background: var(--surface-2); color: var(--ink-400); border: 1px solid var(--line-2); }
.road-item.done .road-n { background: var(--ok-bg); color: var(--ok); border-color: #BFE5D2; }
.road-item.now .road-n { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.road-item .t { font-size: 14px; font-weight: 570; }
.road-item .s { font-size: 12.5px; color: var(--ink-400); margin-top: 1px; }

/* --- career cards -------------------------------------------------------------- */
.career-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 17px; display: flex; flex-direction: column; gap: 11px; transition: border-color .14s, box-shadow .14s, transform .14s; cursor: pointer; }
.career-card:hover { border-color: var(--accent-line); box-shadow: var(--sh-2); transform: translateY(-1px); }
.career-card h3 { font-size: 15.5px; font-weight: 620; }
.career-card .ind { font-size: 12px; color: var(--ink-400); }
.career-card .ov { font-size: 13px; color: var(--ink-500); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.career-card .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.career-card .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 4px; }
.chipbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); font-size: 12.5px; color: var(--ink-500); cursor: pointer; }
.chip:hover { border-color: var(--line-2); background: var(--surface-2); }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }

/* --- detail sections ----------------------------------------------------------- */
.detail-sec { padding: 18px; border-top: 1px solid var(--line); }
.detail-sec:first-child { border-top: 0; }
.detail-sec h4 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-400); font-weight: 620; margin-bottom: 9px; }
.detail-sec p { font-size: 14px; color: var(--ink-700); max-width: 74ch; }
.bullets { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
.bullets li { display: grid; grid-template-columns: 16px 1fr; gap: 9px; font-size: 13.5px; color: var(--ink-700); }
.bullets li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent-line); margin-top: 8px; }
.steps-flow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.steps-flow .st { padding: 6px 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12.5px; }
.steps-flow .ar { color: var(--ink-300); }

/* --- AI shift ------------------------------------------------------------------ */
.shift { display: grid; gap: 0; }
.shift-row { display: grid; grid-template-columns: minmax(0,1fr) 28px minmax(0,1fr); gap: 12px; align-items: center; padding: 13px 18px; border-top: 1px solid var(--dark-line); }
.shift-row:first-child { border-top: 0; }
.shift .a { font-size: 13.5px; color: var(--dark-ink-2); }
.shift .b { font-size: 13.5px; color: #fff; font-weight: 550; }
.shift .ar { color: #46587A; text-align: center; }
.shift .note { grid-column: 1/-1; font-size: 12px; color: #7286A6; }

/* --- skills --------------------------------------------------------------------- */
.skill-row { padding: 15px 18px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.skill-row:first-child { border-top: 0; }
.skill-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.skill-top .nm { font-size: 14px; font-weight: 570; }
.skill-top .hint { font-size: 12.5px; color: var(--ink-400); }
.skill-scale { display: grid; grid-template-columns: 74px 1fr 64px; gap: 12px; align-items: center; }
.skill-scale .lab { font-size: 12px; color: var(--ink-400); }
.skill-scale .val { font-size: 13px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.gapbar { position: relative; height: 8px; background: var(--surface-3); border-radius: 999px; }
.gapbar .cur { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 999px; transition: width .4s; }
.gapbar .tgt { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--ink-900); border-radius: 2px; transition: left .4s; }

/* --- wizard ---------------------------------------------------------------------- */
.wiz-steps { display: flex; gap: 4px; padding: 14px 18px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.wiz-step { display: flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; font-size: 12.5px; color: var(--ink-400); white-space: nowrap; cursor: pointer; border: 1px solid transparent; }
.wiz-step b { width: 18px; height: 18px; border-radius: 50%; background: var(--surface-3); display: grid; place-items: center; font-size: 10.5px; color: var(--ink-500); }
.wiz-step.on { background: var(--accent-soft); color: var(--accent-deep); border-color: var(--accent-line); }
.wiz-step.on b { background: var(--accent); color: #fff; }
.wiz-step.ok b { background: var(--ok); color: #fff; }

/* --- checklist ------------------------------------------------------------------- */
.check-row { display: flex; gap: 12px; padding: 12px 18px; border-top: 1px solid var(--line); align-items: flex-start; cursor: pointer; }
.check-row:first-child { border-top: 0; }
.check-row:hover { background: var(--surface-2); }
.box { width: 19px; height: 19px; border-radius: 6px; border: 1.5px solid var(--line-2); flex: none; display: grid; place-items: center; margin-top: 1px; background: var(--surface); transition: background .13s, border-color .13s; }
.box svg { width: 12px; height: 12px; color: #fff; opacity: 0; }
.check-row.on .box { background: var(--accent); border-color: var(--accent); }
.check-row.on .box svg { opacity: 1; }
.check-row.on .t { color: var(--ink-400); text-decoration: line-through; }

/* --- coach ------------------------------------------------------------------------ */
.coach { display: grid; gap: 8px; }
.coach-item { display: grid; grid-template-columns: 18px 1fr; gap: 10px; font-size: 13px; align-items: start; }
.coach-item .ic { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; margin-top: 1px; }
.coach-item.yes .ic { background: var(--ok-bg); color: var(--ok); }
.coach-item.no  .ic { background: var(--warn-bg); color: var(--warn); }
.coach-item .fix { font-size: 12px; color: var(--ink-400); margin-top: 2px; }
.coach-item.yes .t { color: var(--ink-400); }

/* --- LinkedIn preview --------------------------------------------------------------- */
.li-prev { border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; background: var(--surface); position: sticky; top: 90px; }
.li-cover { height: 74px; background: linear-gradient(120deg,#1B4296,#2559C7 55%,#3E7BE8); }
.li-body { padding: 0 18px 18px; }

@media (max-width: 720px) { .cv-hint, .cv-mini { display: none; } .journey { height: 62vh; } }

<script>
/* =============================================================================
   store.js — everything the student creates.
   Saved to this browser with localStorage: no account, no server, works from a
   USB stick. Views subscribe to changes and re-render.
   ========================================================================== */

const Store = (function () {
  const KEY = "pse-workspace-v1";

  const blank = () => ({
    profile: { name: "", major: "", targetRole: "", interests: "" },
    shortlist: [], viewed: [],
    skills: {},                 /* skillId -> { current, target, why } */
    goals: [],
    cw1: { career: "", checklist: {}, slides: {}, sources: [], practice: [] },
    cw2: { sections: {}, headline: "" },
    reflections: [],
    createdAt: new Date().toISOString()
  });

  let state = blank();
  const listeners = [];

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) state = Object.assign(blank(), JSON.parse(raw));
    } catch (e) { /* private mode or corrupt — start clean */ }
    return state;
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { /* quota or private mode: the session still works, it just won't persist */ }
  }

  function get() { return state; }

  /* Mutate through here so every change persists and re-renders exactly once. */
  function update(fn) {
    fn(state);
    save();
    listeners.forEach(l => l(state));
  }

  function subscribe(fn) { listeners.push(fn); }
  function reset() { state = blank(); save(); listeners.forEach(l => l(state)); }

  function exportJSON() { return JSON.stringify(state, null, 2); }
  function importJSON(text) {
    const parsed = JSON.parse(text);
    state = Object.assign(blank(), parsed);
    save(); listeners.forEach(l => l(state));
  }

  const uid = () => Math.random().toString(36).slice(2, 10);

  /* --- derived ------------------------------------------------------------- */

  function skillRows() {
    return PSE.skills.map(s => {
      const v = state.skills[s.id] || {};
      return { ...s, current: v.current || 0, target: v.target || 0, why: v.why || "",
               gap: Math.max(0, (v.target || 0) - (v.current || 0)) };
    });
  }

  function cw1Progress() {
    const done = PSE.cw1Checklist.filter(i => state.cw1.checklist[i.id]).length;
    return { done, total: PSE.cw1Checklist.length, pct: Math.round(done / PSE.cw1Checklist.length * 100) };
  }

  function slidesDone() {
    return PSE.cw1Slides.filter(s => {
      const v = state.cw1.slides[s.n];
      return v && v.notes && v.notes.trim().length > 20;
    }).length;
  }

  function cw2Progress() {
    let earned = 0, total = 0, done = 0;
    PSE.linkedinSections.forEach(sec => {
      total += sec.weight;
      const v = state.cw2.sections[sec.id] || {};
      const ok = sec.type === "check" ? !!v.done : !!(v.value && v.value.trim().length >= (sec.min || 20));
      if (ok) { earned += sec.weight; done += 1; }
    });
    return { pct: Math.round(earned / total * 100), done, total: PSE.linkedinSections.length };
  }

  const wordCount = t => (t || "").trim().split(/\s+/).filter(Boolean).length;

  function reflectionsInRange() {
    return state.reflections.filter(r => {
      const w = wordCount([r.what, r.learn, r.skills, r.career, r.next].join(" "));
      return w >= 70;
    }).length;
  }

  /* Career readiness — every part is explained in the UI so it never feels
     arbitrary. Each returns { earned, max, detail }. */
  function readiness() {
    const parts = {};
    const s = state;

    const explored = new Set(s.viewed).size;
    parts.explore = { earned: Math.min(15, explored * 5), max: 15,
      detail: explored + " career" + (explored === 1 ? "" : "s") + " explored (5 points each, up to 3)" };

    const rated = skillRows().filter(r => r.current > 0 && r.target > 0).length;
    parts.skills = { earned: Math.round(Math.min(1, rated / PSE.skills.length) * 15), max: 15,
      detail: rated + " of " + PSE.skills.length + " skills rated with a target" };

    const goalPts = s.goals.reduce((a, g) => a + 4 + Math.round((g.progress || 0) / 100 * 6), 0);
    parts.goals = { earned: Math.min(20, goalPts), max: 20,
      detail: s.goals.length + " goal" + (s.goals.length === 1 ? "" : "s") + " created; progress counts towards the score" };

    const c1 = cw1Progress();
    const srcPts = Math.min(4, s.cw1.sources.length);
    parts.cw1 = { earned: Math.min(20, Math.round(c1.pct / 100 * 14) + srcPts + Math.min(2, Math.floor(slidesDone() / 5))), max: 20,
      detail: c1.done + "/" + c1.total + " checklist items, " + s.cw1.sources.length + " sources, " + slidesDone() + "/10 slides" };

    const runs = s.cw1.practice.length;
    parts.practice = { earned: Math.min(10, runs * 5), max: 10,
      detail: runs + " timed practice run" + (runs === 1 ? "" : "s") + " recorded" };

    const c2 = cw2Progress();
    parts.cw2 = { earned: Math.round(c2.pct / 100 * 12), max: 12,
      detail: c2.done + "/" + c2.total + " LinkedIn sections complete" };

    const refl = reflectionsInRange();
    parts.reflect = { earned: Math.min(8, refl * 3), max: 8,
      detail: refl + " reflection" + (refl === 1 ? "" : "s") + " of sufficient depth" };

    const total = Object.values(parts).reduce((a, p) => a + p.earned, 0);
    return { total: Math.round(total), parts };
  }

  function achievements() {
    const s = state;
    const got = {
      explorer:   new Set(s.viewed).size >= 3,
      goalsetter: s.goals.length >= 1,
      researcher: s.cw1.sources.length >= 5,
      presenter:  s.cw1.practice.length >= 1,
      identity:   cw2Progress().done >= 6,
      reflective: reflectionsInRange() >= 3
    };
    return PSE.achievements.map(a => ({ ...a, earned: !!got[a.id] }));
  }

  /* --- "Your next step" ----------------------------------------------------
     One recommendation, chosen by what is most blocking right now. --------- */
  function nextStep() {
    const s = state;
    if (!s.profile.targetRole) return { title: "Set your target role", why: "Everything else — skills, goals, CW1 — gets sharper once you name the job you are aiming at.", cta: "Open Profile", route: "#/profile" };
    if (new Set(s.viewed).size < 3) return { title: "Explore three careers", why: "Compare at least three before committing. You cannot judge one career in isolation.", cta: "Open Career Explorer", route: "#/careers" };
    const unrated = skillRows().filter(r => !r.current || !r.target);
    if (unrated.length > 4) return { title: "Rate your skills", why: "You have " + unrated.length + " skills without a rating. The gap analysis needs both a current and a target level.", cta: "Open Skills", route: "#/skills" };
    if (!s.goals.length) return { title: "Write your first SMART goal", why: "Your biggest skill gap is " + (skillRows().sort((a, b) => b.gap - a.gap)[0] || {}).name + ". Turn it into a goal with a deadline.", cta: "Open Goal Builder", route: "#/goals" };
    const c1 = cw1Progress();
    if (c1.pct < 100) {
      const missing = PSE.cw1Checklist.find(i => !s.cw1.checklist[i.id]);
      return { title: "CW1: " + missing.label, why: missing.help, cta: "Open CW1 Workspace", route: "#/cw1" };
    }
    if (s.cw1.sources.length < 5) return { title: "Add more references", why: "You have " + s.cw1.sources.length + " sources. A Harvard reference list of five or more shows real research.", cta: "Open Source Library", route: "#/cw1" };
    if (!s.cw1.practice.length) return { title: "Run a timed practice", why: "You have never rehearsed to the clock. Your individual share is 5–7 minutes.", cta: "Open Practice", route: "#/cw1" };
    const c2 = cw2Progress();
    if (c2.pct < 100) {
      const sec = PSE.linkedinSections.find(x => { const v = s.cw2.sections[x.id] || {}; return x.type === "check" ? !v.done : !(v.value && v.value.trim().length >= (x.min || 20)); });
      return { title: "LinkedIn: add your " + sec.label.toLowerCase(), why: sec.help, cta: "Open LinkedIn Builder", route: "#/cw2" };
    }
    if (reflectionsInRange() < 3) return { title: "Write a reflection", why: "Reflections are assessed evidence of professional growth. Aim for 70–100 words each.", cta: "Open Reflections", route: "#/reflections" };
    return { title: "Keep your goals moving", why: "The structure is complete. Progress now comes from advancing your goals and rehearsing.", cta: "Open Goals", route: "#/goals" };
  }

  /* --- The offline coach ---------------------------------------------------
     Deterministic checks, not generated prose. Works with no network, and is
     the honest form of help for assessed work: it points at what is missing
     rather than writing the submission. ---------------------------------- */

  function checkGoal(g) {
    const out = [];
    const has = (v, n) => (v || "").trim().length >= n;
    out.push({ ok: has(g.title, 4), label: "Goal has a title" });
    out.push({ ok: has(g.specific, 25), label: "Specific — says exactly what will be accomplished",
      fix: "One sentence naming the concrete outcome, not the intention." });
    out.push({ ok: /\d/.test(g.measurable || "") && has(g.measurable, 10), label: "Measurable — contains a number",
      fix: "Add a quantity: how many, how much, what score." });
    out.push({ ok: has(g.achievable, 20), label: "Achievable — names the resources you have",
      fix: "What skills, time or support make this realistic?" });
    out.push({ ok: has(g.relevant, 20), label: "Relevant — links to your career",
      fix: "Connect it to your target role explicitly." });
    out.push({ ok: !!g.deadline, label: "Time-bound — has a deadline",
      fix: "Pick a date. A goal without one is a wish." });
    out.push({ ok: has(g.actions, 20), label: "Actions listed",
      fix: "What will you actually do — modules, courses, practice?" });
    out.push({ ok: (g.obstacles || []).some(o => (o.solution || "").trim().length > 10), label: "At least one obstacle has a solution",
      fix: "Naming a barrier without a plan does not help you." });
    return out;
  }

  function checkReflection(r) {
    const out = [];
    PSE.reflectionPrompts.forEach(p => {
      out.push({ ok: wordCount(r[p.key]) >= 8, label: p.label, fix: p.hint });
    });
    const w = wordCount([r.what, r.learn, r.skills, r.career, r.next].join(" "));
    out.push({ ok: w >= 70 && w <= 140, label: "Length is in a sensible range (" + w + " words)",
      fix: w < 70 ? "Too thin — the LinkedIn post alone needs 70–100 words." : "Long for a LinkedIn post; tighten it." });
    out.push({ ok: /\b(I|my|me)\b/i.test([r.learn, r.next].join(" ")), label: "Written in the first person",
      fix: "A reflection is about you. Use 'I'." });
    return out;
  }

  function checkCW1() {
    const missing = PSE.cw1Checklist.filter(i => !state.cw1.checklist[i.id]);
    const out = missing.slice(0, 6).map(m => ({ ok: false, label: m.label, fix: m.help }));
    if (state.cw1.sources.length < 5) out.push({ ok: false, label: "Fewer than five references", fix: "Westminster Harvard referencing is assessed. Add sources as you research, not at the end." });
    if (slidesDone() < 10) out.push({ ok: false, label: (10 - slidesDone()) + " slides still have no notes", fix: "Every slide needs a purpose and research notes before you design it." });
    if (!out.length) out.push({ ok: true, label: "Every CW1 requirement is marked complete" });
    return out;
  }

  /* --- Harvard reference formatting ---------------------------------------
     Westminster Harvard: Author (Year) Title. Available at: URL
     (Accessed: D Month YYYY). ------------------------------------------- */
  function harvard(src) {
    const author = (src.author || "Anon.").trim().replace(/\.$/, "");
    const year = (src.year || "n.d.").trim();
    const title = (src.title || "Untitled").trim().replace(/\.$/, "");
    let out = author + " (" + year + ") " + title + ".";
    if (src.url) out += " Available at: " + src.url.trim();
    if (src.accessed) {
      const d = new Date(src.accessed);
      if (!isNaN(d)) {
        const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
        out += " (Accessed: " + d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear() + ")";
      }
    }
    return out + ".";
  }
  function citation(src) {
    const a = (src.author || "Anon.").split(",")[0].trim();
    return "(" + a + ", " + (src.year || "n.d.") + ")";
  }

  /* --- sample workspace ----------------------------------------------------
     An empty product demonstrates nothing. This fills the workspace with a
     plausible student so every screen can be seen working; it is clearly
     labelled and one click removes it. ------------------------------------ */
  function isEmpty() {
    return !state.profile.targetRole && !state.goals.length && !state.reflections.length
      && !Object.keys(state.skills).length && !state.cw1.sources.length;
  }

  function loadSample() {
    const today = new Date();
    const iso = d => d.toISOString().slice(0, 10);
    const plus = n => { const d = new Date(today); d.setDate(d.getDate() + n); return iso(d); };

    state = blank();
    state.isSample = true;
    state.profile = { name: "Sample Student", major: "BSc Business Management",
      targetRole: "Junior Data Analyst", interests: "Analytics, fintech, consulting" };
    state.viewed = ["data-analyst", "business-analyst", "financial-analyst", "marketing-specialist"];
    state.shortlist = ["data-analyst", "business-analyst"];

    const rate = { communication: [6,8,"Confident in seminars, weaker in front of a large room."],
      presentation: [5,8,"I rush when I am nervous and read from the slide."],
      teamwork: [7,8,"Comfortable, but I avoid disagreeing with the group."],
      problem: [6,8,"Fine with structured problems, less so with open ones."],
      technical: [4,8,"Excel is solid, SQL is beginner level, no Python yet."],
      ailiteracy: [5,8,"I use AI tools but cannot always tell when they are wrong."],
      criticalthink: [6,8,"I take published figures at face value too often."],
      timemgmt: [5,7,"I start coursework late and compress the research."],
      adaptability: [7,8,"I adjust well once I understand why something changed."],
      networking: [3,7,"I have almost no professional connections yet."] };
    Object.keys(rate).forEach(k => { state.skills[k] = { current: rate[k][0], target: rate[k][1], why: rate[k][2] }; });

    state.goals = [
      { id: uid(), title: "Reach working SQL competence for analyst roles",
        why: "Every junior analyst advert I have read lists SQL as essential, and it is my largest gap.",
        specific: "Complete a structured SQL course and use it to build two analysis projects from public datasets.",
        measurable: "Finish 40 course exercises and publish 2 projects with written findings.",
        achievable: "I already use Excel well and have 6 free hours a week; the course is free.",
        relevant: "SQL is the single most requested skill for the Junior Data Analyst role I am targeting.",
        deadline: plus(75), progress: 45,
        actions: "Finish the SQL basics course\nRebuild one Excel report as SQL queries\nPublish two projects with written findings",
        obstacles: [{ type: "Lack of time", solution: "Two fixed 90-minute blocks on Tuesday and Saturday mornings.", date: plus(7) },
                    { type: "Lack of confidence", solution: "Work through problems with a study partner from the seminar group.", date: plus(14) }] },
      { id: uid(), title: "Present for seven minutes without reading from the slides",
        why: "Presentation is assessed in CW1 and it is the skill I am weakest at.",
        specific: "Deliver my CW1 section from memory using only keyword prompts.",
        measurable: "Complete 5 timed practice runs scoring 4/5 or above on fluency.",
        achievable: "I can rehearse alone and record on my phone; the group meets weekly.",
        relevant: "Presenting confidently is required for CW1 and for any graduate interview.",
        deadline: plus(30), progress: 20,
        actions: "Record and watch back each run\nCut slide text to keywords only\nRehearse the opening 30 seconds daily",
        obstacles: [{ type: "Lack of confidence", solution: "Practise first to one friend, then to the whole group.", date: plus(10) }] }
    ];

    state.cw1.career = "data-analyst";
    ["career","research","resp","skills","edu","demand","ai","outlook","salary"].forEach(k => state.cw1.checklist[k] = true);
    state.cw1.slides = {
      1: { notes: "Group introduction, why we chose Data Analyst: highest demand of the four careers we compared and it matches three of our majors.", sources: "Team decision" },
      2: { notes: "Definition of the role, the sectors that employ analysts, and how it differs from data scientist and business analyst.", sources: "BLS OOH; O*NET" },
      3: { notes: "Daily duties from O*NET task list; hybrid working; monthly reporting cycle drives the workload peaks.", sources: "O*NET" },
      4: { notes: "SQL, Excel, one BI tool, statistics, and the communication skills to present a finding to a non-analyst.", sources: "O*NET; job adverts sampled on hh.uz" },
      5: { notes: "Bachelor's degree routes plus certification alternatives; portfolio increasingly substitutes for the degree title.", sources: "National Careers Service" },
      6: { notes: "Vacancy counts sampled from UzJobs and hh.uz; BLS projection of +23% to 2033 for operations research analysts.", sources: "BLS OOH; UzJobs; hh.uz" },
      7: { notes: "AI automates query writing and first-draft reporting; judgement about which question matters is what remains scarce.", sources: "Seminar notes; WEF Future of Jobs" }
    };
    state.cw1.sources = [
      { id: uid(), title: "Occupational Outlook Handbook: Operations Research Analysts", author: "US Bureau of Labor Statistics", year: "2024", url: "https://www.bls.gov/ooh/", accessed: iso(today) },
      { id: uid(), title: "O*NET OnLine summary report for Data Scientists", author: "US Department of Labor", year: "2024", url: "https://www.onetonline.org/", accessed: iso(today) },
      { id: uid(), title: "Data analyst job profile", author: "National Careers Service", year: "2024", url: "https://nationalcareers.service.gov.uk/", accessed: iso(today) },
      { id: uid(), title: "Analyst vacancy listings, Tashkent", author: "HeadHunter", year: "2025", url: "https://hh.uz/", accessed: iso(today) },
      { id: uid(), title: "Entry-level analyst listings", author: "UzJobs", year: "2025", url: "https://uzjobs.uz/", accessed: iso(today) }
    ];
    state.cw1.practice = [{ id: uid(), seconds: 388, avg: "3.4", improvement: "Slow down on the job-market slide and stop reading the salary figures.", date: iso(today), scores: {} }];

    const li = { headline: "Undergraduate Student | Aspiring Data Analyst | SQL & Excel",
      about: "Second-year Business Management student at Westminster International University, working towards a junior data analyst role.\n\nI am building practical analysis skills through the PSE module and self-directed projects: SQL, Excel modelling and clear reporting. I am most interested in how organisations use data to make decisions they can defend.\n\nCurrently looking for a summer internship in analytics or finance.",
      education: "BSc Business Management, Westminster International University, 2024–2027. Relevant modules: Professional Skills and Employability, Quantitative Methods, Management Information Systems.",
      experience: "Student ambassador, university open days (2025–present). Guided prospective students and their families, presenting to groups of up to 30 people.",
      volunteer: "Volunteer tutor, community maths club — weekly sessions with secondary school students preparing for exams.",
      orgs: "Member, University Business Society. Participant, Zakovat intellectual quiz team.",
      skills: "SQL (developing) · Microsoft Excel · Data visualisation · Report writing · Presentation · Teamwork · Problem solving",
      courses: "Professional Skills and Employability; Quantitative Methods; AI Literacy Course (in progress)" };
    Object.keys(li).forEach(k => { state.cw2.sections[k] = { value: li[k] }; });
    state.cw2.sections.photo = { done: true };

    state.reflections = [
      { id: uid(), type: "lecture", title: "Guest lecture: analytics in retail banking", date: iso(today),
        what: "A senior analyst from a local bank described how her team turns transaction data into decisions about branch staffing.",
        learn: "I learned that most of the job is deciding which question is worth answering, not running the analysis itself.",
        skills: "I improved my understanding of how analytical work is framed commercially, and I practised asking a question in front of the room.",
        career: "It confirmed that a junior analyst role in financial services is a realistic first step for me.",
        next: "I will rebuild one of my Excel reports as SQL queries this month to close the technical gap she described." },
      { id: uid(), type: "interview", title: "Mock job interview", date: iso(today),
        what: "I took part in a 20-minute mock interview for a graduate analyst position with feedback afterwards.",
        learn: "I learned that my answers were accurate but far too long, and that I gave no concrete examples.",
        skills: "I developed my ability to structure an answer and to stop talking once the question is answered.",
        career: "Interviews are the gate to every role I want, so this is a directly transferable skill.",
        next: "I will prepare five STAR examples and practise each to under 90 seconds before the next mock." },
      { id: uid(), type: "ailit", title: "AI Literacy Course", date: iso(today),
        what: "I completed the modules on how large language models work and where they fail.",
        learn: "I learned that confident output and correct output are unrelated, and that verification is my responsibility.",
        skills: "I developed practical AI literacy and a habit of checking generated claims against a primary source.",
        career: "Analysts are increasingly expected to use these tools and to be accountable for what they produce.",
        next: "I will check every AI-suggested figure in our CW1 research against the original source before it goes on a slide." }
    ];
    save(); listeners.forEach(l => l(state));
  }

  return { load, get, update, subscribe, reset, exportJSON, importJSON, uid, isEmpty, loadSample,
           skillRows, cw1Progress, slidesDone, cw2Progress, wordCount, reflectionsInRange,
           readiness, achievements, nextStep, checkGoal, checkReflection, checkCW1,
           harvard, citation };
})();

</script>
<script>
/* =============================================================================
   canvas.js — the Journey canvas.
   One large world; a camera that flies and zooms between stages instead of
   cutting between pages. Unlike an authored zoom-presentation, the camera is
   driven by the student's own state: it opens on the current stage, the path
   fills to the furthest completed one, and "next step" flies to the task that
   actually needs doing. A parallax depth layer moves at a third of the camera
   speed; a minimap shows the viewport on the whole world.
   ========================================================================== */

const Journey = (function () {
  const W = 2400, H = 1400;
  const PTS = [{ x: 300, y: 440 }, { x: 640, y: 300 }, { x: 980, y: 470 }, { x: 1320, y: 320 },
               { x: 1650, y: 500 }, { x: 1980, y: 350 }, { x: 2120, y: 760 }, { x: 1760, y: 990 }];
  const ANG = [-95, 22, 162].map(a => a * Math.PI / 180);   /* satellites clear the neighbouring stage title */
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let host, world, depth, mini, view, stages, cam = { tx: 0, ty: 0, s: 1 };
  let focus = -1, level = 1, isActive = false, drag = null, dragged = false, ro, timers = [];

  const clampS = s => Math.max(0.28, Math.min(3.2, s));
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function smooth(pts) {
    let d = `M${pts[0].x},${pts[0].y}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      d += ` C${p1.x + (p2.x - p0.x) / 6},${p1.y + (p2.y - p0.y) / 6} ${p2.x - (p3.x - p1.x) / 6},${p2.y - (p3.y - p1.y) / 6} ${p2.x},${p2.y}`;
    }
    return d;
  }

  /* --- camera ---------------------------------------------------------------- */
  function apply(animate) {
    const mv = !!animate && !reduced;
    world.classList.toggle("moving", mv); depth.classList.toggle("moving", mv); view.classList.toggle("moving", mv);
    world.style.transform = `translate(${cam.tx}px,${cam.ty}px) scale(${cam.s})`;
    depth.style.transform = `translate(${cam.tx * 0.35}px,${cam.ty * 0.35}px) scale(${1 + (cam.s - 1) * 0.25})`;
    host.classList.toggle("z2", cam.s >= 1.15);
    host.classList.toggle("z3", cam.s >= 1.9);
    const k = mini.clientWidth / W;
    view.style.left = (-cam.tx / cam.s) * k + "px";  view.style.top = (-cam.ty / cam.s) * k + "px";
    view.style.width = (host.clientWidth / cam.s) * k + "px"; view.style.height = (host.clientHeight / cam.s) * k + "px";
  }
  function flyTo(cx, cy, s, animate) {
    cam.s = clampS(s); cam.tx = host.clientWidth / 2 - cx * cam.s; cam.ty = host.clientHeight / 2 - cy * cam.s; apply(animate !== false);
  }
  const fitScale = () => Math.min(host.clientWidth / W, host.clientHeight / H) * 0.94;

  function markFocus() { world.querySelectorAll(".cv-node").forEach((n, i) => n.classList.toggle("focus", i === focus)); }
  function overview(animate) { focus = -1; level = 1; markFocus(); flyTo(W / 2, H / 2, fitScale(), animate); }
  function stage(i, lvl, animate) {
    if (i < 0 || i >= PTS.length) return;
    focus = i; level = lvl || 1; markFocus();
    const p = PTS[i];
    flyTo(p.x, p.y + (level === 2 ? 70 : 20), level === 2 ? 2.35 : 1.5, animate);
  }
  function step(d) { stage(focus < 0 ? (d > 0 ? 0 : PTS.length - 1) : Math.max(0, Math.min(PTS.length - 1, focus + d)), 1); }
  function deeper() { if (focus < 0) stage(now(), 1); else if (level === 1) stage(focus, 2); else overview(); }
  const now = () => { const i = stages.findIndex(s => s.state === "now"); return i < 0 ? 0 : i; };

  /* --- build ------------------------------------------------------------------ */
  function mount(el, list, intent) {
    destroy(); host = el; stages = list; isActive = true;
    const doneN = (() => { let n = 0; for (const s of stages) { if (s.state === "done") n++; else break; } return n; })();
    const prog = Math.max(0, Math.min(1, (doneN - (doneN === PTS.length ? 0 : 1)) / (PTS.length - 1)));

    host.innerHTML = `
      <div class="cv-depth"></div>
      <div class="cv-world">
        <svg class="cv-path" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">
          <path d="${smooth(PTS)}" fill="none" stroke="#2B3B5C" stroke-width="4" stroke-dasharray="10 12" stroke-linecap="round"/>
          <path d="${smooth(PTS)}" fill="none" stroke="#3E7BE8" stroke-width="5" stroke-linecap="round" pathLength="1" stroke-dasharray="${prog} 1"/>
        </svg>
        ${stages.map((s, i) => `
          <div class="cv-node st-${s.state}" style="left:${PTS[i].x}px;top:${PTS[i].y}px" data-i="${i}">
            <div class="cv-acts">${s.activities.map((a, k) => `
              <div class="cv-act" style="transform:translate(calc(-50% + ${Math.round(182 * Math.cos(ANG[k]))}px), calc(-50% + ${Math.round(182 * Math.sin(ANG[k]))}px))"
                   data-act="go" data-route="${esc(s.route)}"><b>Activity ${k + 1}</b>${esc(a)}</div>`).join("")}</div>
            <div class="cv-ring">${s.state === "done" ? "✓" : s.n}</div>
            <div class="cv-title">${esc(s.title)}</div>
            <div class="cv-blurb">${esc(s.blurb)}</div>
            <div class="cv-live">${esc(s.live)}</div>
          </div>`).join("")}
      </div>
      <div class="cv-hud">
        <button class="btn btn-sm" data-act="jout">Overview</button>
        <button class="btn btn-sm" data-act="jstep" data-d="-1">←</button>
        <button class="btn btn-sm" data-act="jstep" data-d="1">→</button>
        <button class="btn btn-sm btn-primary" data-act="jnext">Fly to my next step</button>
      </div>
      <div class="cv-hint">Drag to pan · scroll to zoom · click a stage twice to see its tasks · Esc for overview</div>
      <div class="cv-mini" aria-hidden="true">${stages.map((s, i) => `<i class="${s.state}" style="left:${PTS[i].x / W * 100}%;top:${PTS[i].y / H * 100}%"></i>`).join("")}<div class="cv-view"></div></div>`;

    world = host.querySelector(".cv-world"); depth = host.querySelector(".cv-depth");
    mini = host.querySelector(".cv-mini"); view = host.querySelector(".cv-view");

    /* pointer: drag to pan; a real click on a node zooms */
    host.addEventListener("pointerdown", e => {
      if (e.target.closest(".cv-hud, .cv-mini, .cv-act")) return;
      drag = { x: e.clientX, y: e.clientY, tx: cam.tx, ty: cam.ty }; dragged = false; host.classList.add("dragging"); host.setPointerCapture(e.pointerId);
    });
    host.addEventListener("pointermove", e => {
      if (!drag) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) dragged = true;
      cam.tx = drag.tx + dx; cam.ty = drag.ty + dy; apply(false);
    });
    const up = () => { drag = null; host.classList.remove("dragging"); };
    host.addEventListener("pointerup", up); host.addEventListener("pointercancel", up);
    host.addEventListener("click", e => {
      if (dragged) { e.stopPropagation(); e.preventDefault(); dragged = false; return; }
      if (e.target.closest(".cv-hud, .cv-act")) return;
      const m = e.target.closest(".cv-mini");
      if (m) { const r = m.getBoundingClientRect(); flyTo((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H, cam.s); return; }
      const n = e.target.closest(".cv-node");
      if (n) { const i = +n.getAttribute("data-i"); stage(i, focus === i && level === 1 ? 2 : 1); }
    });
    host.addEventListener("wheel", e => {
      e.preventDefault();
      const r = host.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
      const wx = (px - cam.tx) / cam.s, wy = (py - cam.ty) / cam.s;
      const ns = clampS(cam.s * Math.exp(-e.deltaY * 0.0016));
      cam.tx = px - wx * ns; cam.ty = py - wy * ns; cam.s = ns; apply(false);
    }, { passive: false });
    ro = new ResizeObserver(() => { if (!isActive) return; focus < 0 ? overview(false) : stage(focus, level, false); });
    ro.observe(host);

    /* arrive: overview, then fly to where the student actually is */
    overview(false);
    timers.push(setTimeout(() => {
      if (!isActive) return;
      if (intent === "next") { flyNext(); return; }
      stage(now(), 1);
    }, reduced ? 0 : 420));
  }

  function flyNext() {
    const route = Store.nextStep().route;
    let i = stages.findIndex(s => s.route === route);
    if (i < 0) i = now();
    stage(i, 2);
  }

  function destroy() {
    isActive = false; timers.forEach(clearTimeout); timers = [];
    if (ro) { ro.disconnect(); ro = null; }
    host = world = depth = mini = view = null; focus = -1; level = 1;
  }

  return { mount, destroy, overview, stage, step, deeper, flyNext, now, active: () => isActive };
})();

/* ============================ ROADMAP ==================================== */
/* Shared: the state of each roadmap stage, derived from the student's data. */
function stageList() {
  const s = Store.get(), c1 = Store.cw1Progress(), c2 = Store.cw2Progress();
  const rated = Store.skillRows().filter(x => x.current && x.target).length;
  const viewed = new Set(s.viewed).size, refl = Store.reflectionsInRange();
  const done = {
    meet: true, understand: true, explore: viewed >= 3, skills: rated >= PSE.skills.length,
    goals: s.goals.length > 0, cw1: c1.pct === 100, cw2: c2.pct === 100, reflect: refl >= 3
  };
  const live = {
    meet: "Module briefing complete", understand: "Assessment structure understood",
    explore: viewed + " of 3 careers explored", skills: rated + " of " + PSE.skills.length + " skills rated",
    goals: s.goals.length + " SMART goal" + (s.goals.length === 1 ? "" : "s") + (s.goals.length ? ", avg " + Math.round(s.goals.reduce((a, g) => a + (g.progress || 0), 0) / s.goals.length) + "% progress" : ""),
    cw1: c1.done + "/" + c1.total + " requirements · " + s.cw1.sources.length + " sources",
    cw2: c2.pct + "% of the profile complete", reflect: refl + " reflection" + (refl === 1 ? "" : "s") + " in range"
  };
  let nowSeen = false;
  return PSE.roadmap.map(r => {
    let state = done[r.id] ? "done" : "todo";
    if (state === "todo" && !nowSeen) { state = "now"; nowSeen = true; }
    return { ...r, state, live: live[r.id] };
  });
}

/* ============================ SKILLS ====================================== */
V.skills = function () {
  const rows = Store.skillRows();
  const rated = rows.filter(r => r.current && r.target);
  const gaps = rows.filter(r => r.gap > 0).sort((a, b) => b.gap - a.gap);
  const top = gaps[0];
  const strengths = rows.filter(r => r.current >= 7).sort((a, b) => b.current - a.current).slice(0, 3);

  return { title: "My Skills", sub: "Rate where you are now and where you need to be. The gap is the syllabus for your goals.", crumb: ["PSE", "Skills"], html: `
    <div class="grid g3">
      <div class="card stat"><div class="k">Skills rated</div><div class="v">${rated.length}<span style="font-size:14px;color:var(--ink-400)">/${rows.length}</span></div><div class="d">Both current and target set</div></div>
      <div class="card stat"><div class="k">Biggest opportunity</div><div class="v" style="font-size:19px">${top ? esc(top.name) : "—"}</div><div class="d">${top ? top.current + "/10 → " + top.target + "/10, a gap of " + top.gap : "Rate your skills to see this"}</div></div>
      <div class="card stat"><div class="k">Strengths</div><div class="v" style="font-size:19px">${strengths.length ? esc(strengths.map(s=>s.name).join(", ")) : "—"}</div><div class="d">Rated 7 or above</div></div>
    </div>

    <div class="card">
      <div class="card-h"><div><h3>Self-assessment</h3><p class="sub">Be honest — an inflated rating produces a useless goal. Say why you chose each number.</p></div></div>
      <div class="list">
        ${rows.map(r => `<div class="skill-row">
          <div class="skill-top"><div><span class="nm">${esc(r.name)}</span> <span class="pill">${esc(r.group)}</span>
            <div class="hint">${esc(r.hint)}</div></div>
            ${r.gap > 0 ? `<span class="pill warn">Gap of ${r.gap}</span>` : r.current ? '<span class="pill ok">At target</span>' : '<span class="pill">Not rated</span>'}</div>
          <div class="gapbar"><span class="cur" id="gb-${r.id}-cur" style="width:${(r.current/10)*100}%"></span><span class="tgt" id="gb-${r.id}-tgt" style="left:calc(${(r.target/10)*100}% - 1px);${r.target?"":"display:none"}"></span></div>
          <div class="skill-scale"><span class="lab">Current</span>
            <input type="range" min="0" max="10" step="1" value="${r.current}" data-set="skills.${r.id}.current">
            <span class="val" id="sv-${r.id}-current">${r.current}/10</span></div>
          <div class="skill-scale"><span class="lab">Target</span>
            <input type="range" min="0" max="10" step="1" value="${r.target}" data-set="skills.${r.id}.target">
            <span class="val" id="sv-${r.id}-target">${r.target}/10</span></div>
          <input type="text" placeholder="Why did you choose this rating?" value="${esc(r.why)}" data-set="skills.${r.id}.why" data-quiet="1">
        </div>`).join("")}
      </div>
    </div>

    ${gaps.length ? `<div class="card">
      <div class="card-h"><div><h3>Gap analysis</h3><p class="sub">Concrete actions for the gaps you rated largest.</p></div>
        <button class="btn btn-sm btn-primary" data-act="go" data-route="#/goals">Turn a gap into a goal</button></div>
      <div class="list">${gaps.slice(0, 5).map(g => `<div class="row">
        <div class="grow"><div class="t">${esc(g.name)} · ${g.current}/10 → ${g.target}/10</div>
          <ul class="bullets" style="margin-top:7px">${g.actions.map(a => `<li><span>${esc(a)}</span></li>`).join("")}</ul></div>
        <span class="pill warn">Gap ${g.gap}</span></div>`).join("")}</div>
    </div>` : ""}` };
};

/* ============================ GOALS ======================================= */
let goalDraft = null, goalStep = 0;
const GOAL_STEPS = [
  { k: "Goal",        fields: [["title","My goal","What do you want to achieve?","text"],["why","Why I want this","Why does this matter to you personally?","area"]] },
  { k: "Specific",    fields: [["specific","Specific","What exactly will you accomplish? Name the outcome, not the intention.","area"],["measurable","Measurable","How will you know you succeeded? Include a number.","area"]] },
  { k: "Achievable",  fields: [["achievable","Achievable","What resources, skills or support make this realistic?","area"],["relevant","Relevant","Why does this matter for your target career?","area"]] },
  { k: "Time-bound",  fields: [["deadline","Deadline","","date"],["actions","What I need to do","Modules, courses, practice — one action per line.","area"]] },
  { k: "Obstacles",   fields: [] },
  { k: "Review",      fields: [] }
];
const OBSTACLES = ["Lack of time","Lack of experience","Lack of knowledge","Lack of confidence","Financial limitations","Other"];

V.goals = function () {
  const s = Store.get();
  if (goalDraft) return goalWizard();

  return { title: "Goals", sub: "SMART goals turn a skill gap into something with a deadline.", crumb: ["PSE", "Goals"], html: `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div style="font-size:13px;color:var(--ink-500)">${s.goals.length} goal${s.goals.length===1?"":"s"} · ${s.goals.filter(g=>(g.progress||0)>=100).length} complete</div>
      <button class="btn btn-primary" data-act="newgoal">${ic("plus")} New SMART goal</button>
    </div>
    ${s.goals.length ? s.goals.map(g => {
      const checks = Store.checkGoal(g), pass = checks.filter(c => c.ok).length;
      return `<div class="card">
        <div class="card-h"><div><h3>${esc(g.title || "Untitled goal")}</h3>
          <p class="sub">${esc(g.relevant || g.why || "")}</p></div>
          <div style="display:flex;gap:7px;align-items:center">
            <span class="pill ${pass===checks.length?"ok":pass>=6?"warn":"bad"}">${pass}/${checks.length} SMART</span>
            <button class="btn btn-sm" data-act="editgoal" data-id="${g.id}">Edit</button>
            <button class="btn btn-sm btn-danger" data-act="delgoal" data-id="${g.id}">${ic("trash")}</button></div></div>
        <div class="card-b" style="display:grid;gap:14px">
          <div class="grid g2" style="gap:12px">
            <div><div style="font-size:11.5px;color:var(--ink-400);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:4px">Specific</div>
              <div style="font-size:13.5px">${esc(g.specific || "—")}</div></div>
            <div><div style="font-size:11.5px;color:var(--ink-400);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:4px">Measurable</div>
              <div style="font-size:13.5px">${esc(g.measurable || "—")}</div></div>
          </div>
          <div>
            <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px">
              <span>Progress</span><b>${g.progress || 0}%${g.deadline ? " · target " + esc(g.deadline) : ""}</b></div>
            ${bar(g.progress || 0, (g.progress||0) >= 100 ? "ok" : "")}
            <input type="range" min="0" max="100" step="5" value="${g.progress || 0}" data-act="goalprogress" data-id="${g.id}" style="margin-top:9px">
          </div>
          ${(g.obstacles || []).filter(o => o.type).length ? `<div>
            <div style="font-size:11.5px;color:var(--ink-400);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:6px">Obstacles and plans</div>
            <div style="display:grid;gap:6px">${g.obstacles.filter(o => o.type).map(o => `
              <div style="display:grid;grid-template-columns:160px 1fr;gap:10px;font-size:13px">
                <span class="pill warn" style="justify-self:start">${esc(o.type)}</span>
                <span style="color:var(--ink-700)">${esc(o.solution || "No plan yet")}</span></div>`).join("")}</div></div>` : ""}
          ${pass < checks.length ? `<div style="border-top:1px solid var(--line);padding-top:12px">
            <div style="font-size:11.5px;color:var(--ink-400);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:8px">Coach — what would strengthen this goal</div>
            <div class="coach">${checks.filter(c => !c.ok).map(c => `<div class="coach-item no">
              <span class="ic">!</span><div><div class="t">${esc(c.label)}</div>${c.fix ? `<div class="fix">${esc(c.fix)}</div>` : ""}</div></div>`).join("")}</div></div>` : ""}
        </div></div>`; }).join("") :
      `<div class="card"><div class="empty"><h4>No goals yet</h4>
        <p>Open Skills first, find your biggest gap, then turn it into a goal with a date attached.</p>
        <button class="btn btn-primary" data-act="newgoal">Build your first SMART goal</button></div></div>`}` };
};

function goalWizard() {
  const g = goalDraft, step = GOAL_STEPS[goalStep];
  const filled = f => (g[f] || "").toString().trim().length > 0;
  const body = goalStep === 4 ? `
      <p style="font-size:13px;color:var(--ink-500);margin-bottom:14px">What could stop you? Naming a barrier without a plan does not help — add how you will get around each one.</p>
      <div style="display:grid;gap:10px">${OBSTACLES.map((o, i) => {
        const cur = (g.obstacles || []).find(x => x.type === o) || {};
        return `<div style="display:grid;grid-template-columns:170px 1fr 140px;gap:10px;align-items:center">
          <label style="display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer">
            <input type="checkbox" ${cur.type?"checked":""} data-act="obs-toggle" data-o="${esc(o)}"> ${esc(o)}</label>
          <input type="text" placeholder="How will you overcome it?" value="${esc(cur.solution||"")}" data-act="obs-sol" data-o="${esc(o)}" ${cur.type?"":"disabled"}>
          <input type="date" value="${esc(cur.date||"")}" data-act="obs-date" data-o="${esc(o)}" ${cur.type?"":"disabled"}>
        </div>`; }).join("")}</div>`
    : goalStep === 5 ? (() => {
        const checks = Store.checkGoal(g);
        return `<div style="display:grid;gap:16px">
          <div style="background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:16px">
            <div style="font-size:17px;font-weight:620;margin-bottom:10px">${esc(g.title || "Untitled goal")}</div>
            ${[["Specific","specific"],["Measurable","measurable"],["Achievable","achievable"],["Relevant","relevant"]].map(([l,k]) =>
              `<div style="display:grid;grid-template-columns:110px 1fr;gap:12px;font-size:13.5px;padding:5px 0">
                <b style="color:var(--ink-400);font-weight:600">${l}</b><span>${esc(g[k] || "—")}</span></div>`).join("")}
            <div style="display:grid;grid-template-columns:110px 1fr;gap:12px;font-size:13.5px;padding:5px 0">
              <b style="color:var(--ink-400);font-weight:600">Time-bound</b><span>${esc(g.deadline || "No deadline")}</span></div>
          </div>
          <div><div style="font-size:11.5px;color:var(--ink-400);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:8px">Coach check</div>
            <div class="coach">${checks.map(c => `<div class="coach-item ${c.ok?"yes":"no"}">
              <span class="ic">${c.ok ? ic("check") : "!"}</span>
              <div><div class="t">${esc(c.label)}</div>${!c.ok && c.fix ? `<div class="fix">${esc(c.fix)}</div>` : ""}</div></div>`).join("")}</div></div>
        </div>`; })()
    : `<div style="display:grid;gap:16px">${step.fields.map(([k, label, hint, type]) => `
        <div class="field"><label>${esc(label)}</label>
          ${type === "area" ? `<textarea placeholder="${esc(hint)}" data-act="gd" data-k="${k}">${esc(g[k]||"")}</textarea>`
            : type === "date" ? `<input type="date" value="${esc(g[k]||"")}" data-act="gd" data-k="${k}">`
            : `<input type="text" placeholder="${esc(hint)}" value="${esc(g[k]||"")}" data-act="gd" data-k="${k}">`}
          ${hint && type !== "text" ? `<div class="help">${esc(hint)}</div>` : ""}</div>`).join("")}</div>`;

  return { title: g.id ? "Edit goal" : "New SMART goal", sub: "Step " + (goalStep+1) + " of " + GOAL_STEPS.length + " — " + step.k, crumb: ["PSE","Goals","Builder"], html: `
    <div class="card" style="max-width:820px">
      <div class="wiz-steps">${GOAL_STEPS.map((st, i) => `<button class="wiz-step ${i===goalStep?"on":""} ${i<goalStep?"ok":""}" data-act="gstep" data-i="${i}">
        <b>${i < goalStep ? "✓" : i+1}</b>${esc(st.k)}</button>`).join("")}</div>
      <div class="card-b">${body}</div>
      <div class="card-f" style="display:flex;justify-content:space-between;gap:10px;background:var(--surface)">
        <button class="btn" data-act="gstep" data-i="${goalStep-1}" ${goalStep===0?"disabled":""}>Back</button>
        <div style="display:flex;gap:8px">
          <button class="btn btn-ghost" data-act="gcancel">Cancel</button>
          ${goalStep < GOAL_STEPS.length-1
            ? `<button class="btn btn-primary" data-act="gstep" data-i="${goalStep+1}" ${goalStep===0&&!filled("title")?"disabled":""}>Continue ${ic("arrow")}</button>`
            : `<button class="btn btn-primary" data-act="gsave">Save goal</button>`}
        </div></div>
    </div>` };
}

/* ============================ CW1 ========================================= */
let cw1Tab = "checklist";
V.cw1 = function () {
  const s = Store.get(), p = Store.cw1Progress();
  const career = PSE.careers.find(c => c.id === s.cw1.career);

  if (cw1Tab === "checklist") {
    const groups = [...new Set(PSE.cw1Checklist.map(i => i.group))];
    body = `<div class="card"><div class="card-h"><div><h3>Assignment requirements</h3>
        <p class="sub">Every item below is assessed. Tick them as your group completes them.</p></div>
        <span class="pill ${p.pct===100?"ok":"acc"}">${p.done}/${p.total}</span></div>
      ${groups.map(gr => `<div style="border-top:1px solid var(--line)">

          <div style="display:flex;gap:6px;flex-wrap:wrap;margin:9px 0">${sl.ask.map(q => `<span class="pill">${esc(q)}</span>`).join("")}</div>

          <input type="text" style="margin-top:8px" placeholder="Sources supporting this slide" value="${esc(v.sources||"")}" data-set="cw1.slides.${sl.n}.sources" data-quiet="1">

            <div style="font-size:12px;color:var(--ink-400);margin-bottom:7px">Or add a recommended resource:</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">${PSE.resources.slice(0,6).map(r => `
              <button class="chip" data-act="addsource" data-res="${r.id}">${esc(r.name)}</button>`).join("")}</div></div>
        </div></div></div>`;
  }

  if (cw1Tab === "practice") {
    const runs = s.cw1.practice;
    body = `<div class="split">
      <div class="grid" style="gap:16px">
        <div class="card"><div class="card-h"><div><h3>Presentation timer</h3>
          <p class="sub">Your individual share is 5–7 minutes. The clock turns green inside the window and red past it.</p></div></div>
          <div class="card-b" style="text-align:center;padding:30px">
            <div class="timer-face" id="tface">00:00</div>
            <div class="timer-band">Target window: 5:00 – 7:00</div>
            <div style="display:flex;gap:9px;justify-content:center;margin-top:20px">
              <button class="btn btn-primary" data-act="tstart" id="tbtn">${ic("play")} Start</button>
              <button class="btn" data-act="treset">Reset</button></div>
          </div></div>
        <div class="card"><div class="card-h"><div><h3>Self-evaluation</h3>
          <p class="sub">Score yourself out of 5 immediately after the run, while it is fresh.</p></div></div>
          <div class="card-b" style="display:grid;gap:12px">
            ${PSE.practiceCriteria.map(c => `<div>
              <div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(c.label)}
                <span style="color:var(--ink-400);font-size:12px">— ${esc(c.hint)}</span></span>
                <b id="pv-${c.id}" style="font-variant-numeric:tabular-nums">3</b></div>
              <input type="range" min="1" max="5" step="1" value="3" data-act="pscore" data-id="${c.id}"></div>`).join("")}
            <div class="field"><label>One thing to improve next time</label>
              <input type="text" id="p-improve" placeholder="Slow down on the job-market slide"></div>
            <button class="btn btn-primary" data-act="savepractice">Save this practice run</button>
          </div></div>
      </div>
      <div class="card"><div class="card-h"><div><h3>Practice history</h3><p class="sub">${runs.length} run${runs.length===1?"":"s"} recorded.</p></div></div>
        ${runs.length ? runs.slice().reverse().map(r => `<div class="row">
          <div class="grow"><div class="t">${Math.floor(r.seconds/60)}:${String(r.seconds%60).padStart(2,"0")}
            <span class="pill ${r.seconds>=300&&r.seconds<=420?"ok":"warn"}" style="margin-left:6px">${r.seconds>=300&&r.seconds<=420?"In window":"Out of window"}</span></div>
            <div class="s">${esc(r.date)} · average ${r.avg}/5${r.improvement?" · "+esc(r.improvement):""}</div></div></div>`).join("")
          : `<div class="empty"><h4>No runs yet</h4><p>Rehearsing to a timer is the single highest-value thing you can do before CW1.</p></div>`}
      </div></div>`;
  }

  return { title: "CW1 — Group Presentation", sub: career ? "Researching " + career.title : "Choose a career from the explorer to begin.", crumb: ["PSE","CW1"], html: `
    <div class="grid g4">
      <div class="card stat"><div class="k">Research</div><div class="v">${p.pct}%</div><div class="d">${p.done}/${p.total} requirements</div></div>
      <div class="card stat"><div class="k">Slides planned</div><div class="v">${Store.slidesDone()}<span style="font-size:14px;color:var(--ink-400)">/10</span></div><div class="d">Notes written</div></div>
      <div class="card stat"><div class="k">References</div><div class="v">${s.cw1.sources.length}</div><div class="d">Harvard formatted</div></div>
      <div class="card stat"><div class="k">Practice runs</div><div class="v">${s.cw1.practice.length}</div><div class="d">Timed rehearsals</div></div>
    </div>
    ${!career ? `<div class="nextstep"><div class="ic">${ic("compass")}</div><div style="flex:1">
      <h3>Pick your CW1 career first</h3><p>Everything in this workspace hangs off the occupation your group is researching.</p></div>
      <button class="btn btn-primary" data-act="go" data-route="#/careers">Open Career Explorer</button></div>` : ""}
    <div class="chipbar">${tabs.map(([k,l]) => `<button class="chip ${cw1Tab===k?"on":""}" data-act="cw1tab" data-k="${k}">${esc(l)}</button>`).join("")}</div>
    ${body}` };
};

/* ============================ CW2 / LINKEDIN ============================== */
V.cw2 = function () {
  const s = Store.get(), p = Store.cw2Progress();
  const val = id => (s.cw2.sections[id] || {}).value || "";
  const done = id => !!(s.cw2.sections[id] || {}).done;
  const hp = PSE.headlineParts;
  const pick = (k, i) => hp[k][i % hp[k].length];
  const suggestions = [0,1,2].map(i => `${pick("status",i)} | ${pick("target",i)} | ${pick("strength",i)}`);

  return { title: "CW2 — LinkedIn", sub: "Build the profile section by section. The preview on the right updates as you type.", crumb: ["PSE","CW2"], html: `
    <div class="grid g3">
      <div class="card stat"><div class="k">Profile completion</div><div class="v">${p.pct}%</div><div class="d">${p.done}/${p.total} sections</div></div>
      <div class="card stat"><div class="k">Headline</div><div class="v" style="font-size:16px">${val("headline") ? esc(val("headline").slice(0,34)) + (val("headline").length>34?"…":"") : "Not written"}</div><div class="d">${val("headline").length}/220 characters</div></div>
      <div class="card stat"><div class="k">AI Literacy certificate</div><div class="v" style="font-size:18px">${done("ai")?"Added":"Not added"}</div><div class="d">Required for CW2</div></div>
    </div>

    <div class="split">
      <div class="grid" style="gap:16px">
        <div class="card"><div class="card-h"><div><h3>Headline builder</h3>
          <p class="sub">Combine your status, your target profession and your strongest skill. Edit any suggestion — do not just paste it.</p></div></div>
          <div class="card-b" style="display:grid;gap:10px">
            ${suggestions.map(sug => `<div style="display:flex;gap:9px;align-items:center;justify-content:space-between;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px">
              <span style="font-size:13px">${esc(sug)}</span>
              <button class="btn btn-sm" data-act="usehead" data-v="${esc(sug)}">Use</button></div>`).join("")}
            <div class="field"><label>Your headline</label>
              <input type="text" maxlength="220" placeholder="Undergraduate Student | Aspiring Data Analyst | SQL & Python" value="${esc(val("headline"))}" data-set="cw2.sections.headline.value" data-quiet="1">
              <div class="help">${val("headline").length}/220 characters. LinkedIn shows roughly the first 120 in search results.</div></div>
          </div></div>

        <div class="card"><div class="card-h"><div><h3>Profile sections</h3>
          <p class="sub">Each section is weighted towards your completion score.</p></div>
          <span class="pill ${p.pct===100?"ok":"acc"}">${p.pct}%</span></div>
          ${PSE.linkedinSections.filter(x => x.id !== "headline").map(sec => {
            const v = s.cw2.sections[sec.id] || {};
            const ok = sec.type === "check" ? !!v.done : !!(v.value && v.value.trim().length >= (sec.min || 20));
            return `<div style="border-top:1px solid var(--line);padding:15px 18px">
              <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap">
                <div><div style="font-size:13.5px;font-weight:560">${esc(sec.label)}</div>
                  <div style="font-size:12.5px;color:var(--ink-400);max-width:62ch">${esc(sec.help)}</div></div>
                <span class="pill ${ok?"ok":""}">${ok?"Complete":sec.weight+" pts"}</span></div>
              ${sec.type === "check"
                ? `<label style="display:flex;gap:9px;align-items:center;margin-top:10px;font-size:13.5px;cursor:pointer">
                    <input type="checkbox" ${v.done?"checked":""} data-act="cw2check" data-id="${sec.id}"> Done — added to my profile</label>`
                : `<textarea style="margin-top:10px" placeholder="Write this section…" data-set="cw2.sections.${sec.id}.value" data-quiet="1">${esc(v.value||"")}</textarea>`}
            </div>`; }).join("")}
        </div>
      </div>

      <div class="li-prev">
        <div class="li-cover"></div>
        <div class="li-body">
          <div class="li-avatar">${done("photo") ? ic("check") : (s.profile.name ? esc(s.profile.name.trim()[0].toUpperCase()) : "?")}</div>
          <div class="li-name">${esc(s.profile.name || "Your name")}</div>
          <div class="li-head" id="li-headline">${esc(val("headline") || "Your headline will appear here")}</div>
          <div class="li-meta">${esc(PSE.meta.institution)}${s.profile.major ? " · " + esc(s.profile.major) : ""}</div>
          ${["about","education","experience","skills"].map(id => {
            const sec = PSE.linkedinSections.find(x => x.id === id), v = val(id);
            return `<div class="li-sec ${v?"":"missing"}"><h5>${esc(sec.label)}</h5>
              <p id="li-${id}">${v ? esc(v.slice(0,260)) + (v.length>260?"…":"") : "Not written yet"}</p></div>`; }).join("")}
        </div>
      </div>
    </div>` };
};
