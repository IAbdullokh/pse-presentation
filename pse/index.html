<style>
/* =============================================================================
   ask.css — "Ask PSE", the deterministic assistant overlay.
   Every rule is scoped to #pse-ask or to the module's own .ask-open button, so
   it cannot reach any DOM this module did not create. The answers deliberately
   reuse app.css's .coach-item and .chip so the panel reads as part of the
   product rather than a widget bolted onto it.
   ========================================================================== */

/* The topbar is a flex row with space-between; an auto margin keeps the button
   docked to the right of the title without restyling the row's own children. */
.topbar-row .ask-open { margin-left: auto; flex: none; }

#pse-ask {
  position: fixed; inset: 0; z-index: 95;
  display: grid; place-items: center; padding: 20px;
  background: rgba(12, 20, 37, .62);
  opacity: 0; transition: opacity .14s ease-out;
}
#pse-ask[hidden] { display: none; }
#pse-ask.on { opacity: 1; }

#pse-ask .ask-panel {
  width: 100%; max-width: 760px; max-height: 82vh;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 16px; box-shadow: var(--sh-3); overflow: hidden;
  display: grid; grid-template-rows: auto auto minmax(0, 1fr);
  transform: translateY(8px); transition: transform .16s cubic-bezier(.2, .8, .2, 1);
}
#pse-ask.on .ask-panel { transform: none; }

/* --- the honest header ------------------------------------------------------ */
#pse-ask .ask-head {
  padding: 17px 20px 14px; border-bottom: 1px solid var(--line);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
}
#pse-ask .ask-head h2 { font-size: 16px; font-weight: 620; margin: 0; letter-spacing: -0.01em; }
#pse-ask .ask-honest { font-size: 12.5px; color: var(--ink-500); margin: 5px 0 0; max-width: 62ch; }
#pse-ask .ask-x { flex: none; }

#pse-ask .ask-rules { border-bottom: 1px solid var(--line); background: var(--surface-2); }
#pse-ask .ask-rules > summary {
  padding: 9px 20px; cursor: pointer; font-size: 12.5px; font-weight: 550; color: var(--ink-500);
}

<style>
/* =============================================================================

.fx-compare .fx-cmp-legend i { width: 11px; height: 11px; border-radius: 3px; flex: none; }

.check-row .fx-ev-warn {
  border-left: 2px solid var(--warn);
  padding-left: 8px;

/* The x/14 pill beats once, at the moment the count changes. */

@keyframes fx-ev-pop {

  50%  { transform: scale(1.08); }
  100% { transform: scale(1); }
}

/* A coach item that has just been satisfied: struck through, then folded away.
   The negative margin swallows the .coach grid gap so the list closes cleanly
   instead of jumping 8px when the ghost is removed. */

<style>
/* =============================================================================
   journey.css — the canvas's arrival and its readout.
   Every rule is scoped under .journey, so nothing here can reach a page this
   module was not given. Colours are the dark tokens, because the canvas world
   is the one place in the product that is not on a light ground.
   ========================================================================== */

/* --- arrival ---------------------------------------------------------------- */
@keyframes fx-node-in { from { opacity: 0; } to { opacity: 1; } }
.journey .cv-node.fx-node-in { animation: fx-node-in .26s both cubic-bezier(.2,.8,.2,1); }

/* Must out-specify `.st-now .cv-ring`'s infinite pulse (0,2,0), or the stage
   the student is actually standing on is the one stage that never arrives.
   The class is removed on animationend so canvas.js owns the transform again. */
@keyframes fx-ring-in { from { transform: scale(.9); } to { transform: scale(1); } }
.journey .cv-ring.fx-ring-in { animation: fx-ring-in .26s both cubic-bezier(.2,.8,.2,1); }

/* --- "where am I", in words ------------------------------------------------- */
/* Absolutely positioned, not a flex item: a 100% flex-basis would have widened
   .cv-hud's own (invisible) box across the canvas, and canvas.js ignores
   pointerdown and click inside .cv-hud — so a third of the world would have
   stopped responding to drag-to-pan and to node clicks. */
.journey .cv-stage {
  position: absolute; top: calc(100% + 8px); left: 0;   /* its own line, under the buttons */
  width: 360px; max-width: 360px;
  padding: 8px 11px; border-radius: 10px;
  background: var(--dark); border: 1px solid var(--dark-line);
  font-size: 12.5px; line-height: 1.35; color: var(--dark-ink);
}
.journey .cv-stage b {
  display: block; font-size: 13px; font-weight: 620; letter-spacing: -.01em;
  font-variant-numeric: tabular-nums;
}
.journey .cv-stage span { display: block; margin-top: 2px; color: var(--dark-ink-2); }
.journey .cv-stage em { font-style: normal; color: var(--accent-line); }

/* --- full screen ------------------------------------------------------------ */
/* The authored clamp() height would otherwise survive into the fullscreen
   layer and letterbox the canvas inside a black screen. */
.journey:fullscreen { width: 100%; height: 100%; border-radius: 0; border: 0; }
.journey:-webkit-full-screen { width: 100%; height: 100%; border-radius: 0; border: 0; }

@media (max-width: 720px) {
  .journey .cv-stage { width: calc(100vw - 60px); max-width: calc(100vw - 60px); }
}

/* Reduced motion: the stages and the path are already at their final state —
   the readout, the honest next step and full screen are unaffected. */
@media (prefers-reduced-motion: reduce) {
  .journey .cv-node.fx-node-in, .journey .cv-ring.fx-ring-in { animation: none; }
}

</style>
<style>
/* =============================================================================
   pageflow.css — the entrance order of a screen, the direction of the wizard,
   and the error floor. Every rule is scoped to a class this module puts on and
   takes off again, so no other module's DOM can be reached from here.
   ========================================================================== */

/* --- A. route entrance ------------------------------------------------------
   Declared in CSS rather than as inline delays so that cards other modules
   inject during the same onRender pass (the comparison panel, the radar figure)
   are carried by the same stagger without those modules knowing this exists. */

@keyframes fx-rise {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}

.page.fx-enter > * { animation: fx-rise .22s both cubic-bezier(.2, .8, .2, 1); }

.page.fx-enter > *:nth-child(1) { animation-delay: 0s; }
.page.fx-enter > *:nth-child(2) { animation-delay: .042s; }
.page.fx-enter > *:nth-child(3) { animation-delay: .084s; }
.page.fx-enter > *:nth-child(4) { animation-delay: .126s; }
.page.fx-enter > *:nth-child(5) { animation-delay: .168s; }
.page.fx-enter > *:nth-child(6) { animation-delay: .21s; }
.page.fx-enter > *:nth-child(7) { animation-delay: .252s; }

/* Past the seventh card the reading order has been stated; anything further down
   is below the fold anyway, so it arrives with the last of them. */
.page.fx-enter > *:nth-child(n+8) { animation-delay: .294s; }

/* --- C. wizard direction ----------------------------------------------------
   Six hard cuts read as six unrelated forms. A short lateral move reads as one
   procedure with a forward and a back. */

@keyframes fx-slide-next {
  from { opacity: .4; transform: translateX(18px); }
  to   { opacity: 1;  transform: none; }
}

@keyframes fx-slide-back {
  from { opacity: .4; transform: translateX(-18px); }
  to   { opacity: 1;  transform: none; }
}

.card-b.fx-slide-next { animation: fx-slide-next .18s both cubic-bezier(.2, .8, .2, 1); }
.card-b.fx-slide-back { animation: fx-slide-back .18s both cubic-bezier(.2, .8, .2, 1); }

/* The step the wizard just banked. */
@keyframes fx-pip-pop {
  0%   { transform: scale(1); }
  55%  { transform: scale(1.16); }
  100% { transform: scale(1); }
}

.wiz-step b.fx-pop { animation: fx-pip-pop .2s cubic-bezier(.2, .8, .2, 1); }

/* --- D. error floor ---------------------------------------------------------
   Deliberately plain: this card exists so that a failure in front of markers is
   a sentence and a button rather than a blank projector. */

.card.fx-recover { max-width: 520px; }
.card.fx-recover .card-b { display: grid; gap: 10px; justify-items: start; }
.card.fx-recover h3 { font-size: 16px; font-weight: 620; color: var(--ink-900); }
.card.fx-recover p { font-size: 13.5px; color: var(--ink-500); max-width: 46ch; }

/* --- E. reduced motion ------------------------------------------------------
   The module already declines to add these classes when api.reduced is true;
   this is the second line of defence for a preference that changes mid-session. */

@media (prefers-reduced-motion: reduce) {
  .page.fx-enter > *,
  .card-b.fx-slide-next,
  .card-b.fx-slide-back,
  .wiz-step b.fx-pop { animation: none; }
}

<style>
/* =============================================================================
   present.css — presenter mode.
   Two jobs: a bar the presenter reads and the room does not have to, and a set
   of size corrections that only apply while presenting, so the product a
   mentor looks at on a projector is the same product, just legible from the
   back row. Everything here is scoped to body.presenting or to .pm-*.
   ========================================================================== */

/* --- readability while presenting -----------------------------------------
   app.css sizes the whole product in px. Scaling .app is therefore the only
   change that keeps type, rules, charts and spacing in their designed
   proportion — a parallel set of presenter font sizes would drift from the
   real thing within a week. Chrome and Safari have always supported this;
   Firefox does from 126. --------------------------------------------------- */
body.presenting .app { zoom: var(--pm-zoom, 1.15); }

/* zoom scales lengths but not viewport units, so 100vh inside a zoomed .app is
   a screen and a half of rail. Divide both back out, or the readiness score in
   the rail foot — the scoreboard of the whole session — falls below the fold. */
body.presenting .app  { min-height: calc(100vh / var(--pm-zoom, 1.15)); }
body.presenting .rail { height: calc(100vh / var(--pm-zoom, 1.15)); }

/* the page title is doing the work of a slide title while presenting */
body.presenting .topbar h1 { font-size: clamp(23px, 2.9vw, 30px); }

/* the captions that carry the marks: gap detail, card subtitles, coach fixes */
body.presenting .stat .d,
body.presenting .card-h .sub,
body.presenting .coach-item .fix { font-size: 13px; }

/* at 132% and above the nav outgrows one screen and the rail starts to scroll.
   Pin its foot so the readiness score — the live scoreboard of the session —
   is never the part that scrolls away. */
body.presenting .rail-foot {
  position: sticky; bottom: 0; z-index: 1;
  background: var(--dark); padding-bottom: 2px;
}

/* saves must not land on the bar the presenter is steering by */
body.presenting .toast { bottom: 112px; }

/* room for the bar underneath the longest page */
body.presenting .page { padding-bottom: 150px; }

/* --- the bar ---------------------------------------------------------------- */
.pm-bar {
  position: fixed; left: 50%; bottom: 2px; transform: translateX(-50%);
  z-index: 80; display: none; width: min(96vw, 1060px);
  background: var(--dark); color: var(--dark-ink);
  border: 1px solid var(--dark-line); border-radius: var(--r-lg);
  box-shadow: var(--sh-3); overflow: hidden; opacity: 0;
  transition: opacity .2s, bottom .2s;
}
body.presenting .pm-bar { display: block; opacity: 1; bottom: 16px; }

   column and is clamped to it, so the rail — and the live score in its foot —
   is never covered by the thing the presenter is steering with. */
@media (min-width: 901px) {
  .pm-bar {
    left: auto; right: 16px; transform: none;
    width: min(1060px, calc(100vw - (var(--rail) * var(--pm-zoom, 1.15)) - 40px));

.pm-tick { flex: 1; background: var(--dark-line); transition: background .18s; }
.pm-tick.head { background: var(--dark-ink-2); opacity: .38; }

.pm-row { display: flex; align-items: center; gap: 16px; padding: 9px 15px 3px; }
.pm-step { flex: none; font-size: 12px; color: var(--dark-ink-2); font-variant-numeric: tabular-nums; }
.pm-step b { font-size: 18px; font-weight: 650; color: var(--dark-ink); letter-spacing: -0.02em; }

.pm-beat { flex: 1; min-width: 0; }

.pm-say { font-size: 13px; color: var(--dark-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.pm-meta { flex: none; display: flex; align-items: center; gap: 6px; }
.pm-chip {
  font-size: 12px; line-height: 1.5; padding: 2px 9px; border-radius: 999px;

  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.pm-clock { color: var(--dark-ink); }
/* mirrored from the practice timer — the same thresholds it paints */
.pm-run.in { color: var(--s3); border-color: var(--s3); }

.pm-arc li.on { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.pm-arc .n { grid-row: span 2; font-size: 12px; color: var(--ink-300); font-variant-numeric: tabular-nums; padding-top: 1px; }
.pm-arc .b { font-size: 13px; color: var(--ink-700); }

  padding: 18px;

  justify-items: center;
  gap: 10px;

  width: 100%;
  max-width: 440px;
  height: auto;
  overflow: visible;

.fx-radar figcaption {
  font-size: 12.5px;
  color: var(--ink-400);
  max-width: 52ch;
  text-align: center;
  line-height: 1.45;

.fx-radar .fx-r-spoke { stroke: var(--surface-3); stroke-width: 1; }

/* The target is an outline, not a fill: it is a line the student has not
   reached yet, and a solid one would read as achieved. */
.fx-radar .fx-r-target {
  fill: none;
  stroke: var(--ink-900);
  stroke-width: 1.5;
  stroke-dasharray: 4 4;
  stroke-linejoin: round;

.fx-radar .fx-r-current {
  fill: var(--accent);
  fill-opacity: .18;
  stroke: var(--accent);
  stroke-width: 2;

  fill: var(--ink-400);

}

/* =============================================================================
   score.css — the running scoreboard.
   Only two things here: digits that hold their place while they count, and the
   one chip that says which part of the model moved. Everything else on these
   surfaces belongs to app.css.
   ========================================================================== */

/* Proportional digits reflow the whole tile on every frame of a count; tabular
   ones keep the number still while its value changes. */
.stat .v,
.rail-score .v,
.rail-score .fx-delta { font-variant-numeric: tabular-nums; }

/* --- the delta chip -------------------------------------------------------
   Appended into #railscore, so it lands under the bar on its own line inside
   the dark rail. Transparent ground: it is a caption on the score, not a badge. */
.rail-score .fx-delta {
  display: block;
  margin-top: 7px;
  font-size: 11.5px;
  font-weight: 600;
  line-height: 1.35;
  letter-spacing: -0.005em;
  color: #7FE0B4;
  background: transparent;
  animation: fx-delta-life 1600ms cubic-bezier(.2, .8, .2, 1) both;
}

/* A score can fall — deleting a goal, clearing a tick. Green would misreport it. */
.rail-score .fx-delta.down { color: #F0B36B; }

@keyframes fx-delta-life {
  0%   { opacity: 0; transform: translateY(4px); }
  10%  { opacity: 1; transform: translateY(0); }
  66%  { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-10px); }
}

/* Reduced motion keeps the chip — it is information — and drops the movement. */
.rail-score .fx-delta.still {
  animation: none;
  opacity: 1;
  transform: none;
}

/* --- the achievement pulse ------------------------------------------------
   Fires only when a threshold is crossed without the total changing, so the
   crossing is not silent. One shot, never a loop. */
.rail-score.fx-pulse { animation: fx-score-pulse 600ms cubic-bezier(.2, .8, .2, 1) 1; }

  from { box-shadow: 0 0 0 0 rgba(37, 89, 199, .55); }
  to   { box-shadow: 0 0 0 14px rgba(37, 89, 199, 0); }
}

  position: relative;
  display: grid;
  place-items: center;
  min-height: 250px;

/* Behind the digits and out of the way of the Start / Reset buttons. */
.fx-clock .fx-dial {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 100%;
  max-width: 230px;
  height: auto;
  pointer-events: none;

.fx-clock #tface { position: relative; z-index: 1; }

.fx-clock .fx-track { stroke: var(--surface-3); }
.fx-clock .fx-band  { stroke: var(--ok); }

.fx-clock .fx-cap {
  stroke: var(--ok);
  stroke-width: 2;
  stroke-linecap: butt;

.fx-clock .fx-prog {
  stroke-linecap: butt;
  transition: stroke .25s ease;

  45%  { opacity: .5; }
  100% { opacity: .28; }

  max-width: 46ch;

  .fx-clock .fx-dial { max-width: 196px; }

.road-n { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 640;
  background: var(--surface-2); color: var(--ink-400); border: 1px solid var(--line-2); }
.road-item.done .road-n { background: var(--ok-bg); color: var(--ok); border-color: #BFE5D2; }
.road-item.now .road-n { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.road-item .t { font-size: 14px; font-weight: 570; }
.road-item .s { font-size: 12.5px; color: var(--ink-400); margin-top: 1px; }

/* --- career cards -------------------------------------------------------------- */
.career-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 17px; display: flex; flex-direction: column; gap: 11px; transition: border-color .14s, box-shadow .14s, transform .14s; cursor: pointer; }
.career-card:hover { border-color: var(--accent-line); box-shadow: var(--sh-2); transform: translateY(-1px); }
.career-card h3 { font-size: 15.5px; font-weight: 620; }
.career-card .ind { font-size: 12px; color: var(--ink-400); }
.career-card .ov { font-size: 13px; color: var(--ink-500); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.career-card .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.career-card .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 4px; }
.chipbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); font-size: 12.5px; color: var(--ink-500); cursor: pointer; }
.chip:hover { border-color: var(--line-2); background: var(--surface-2); }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }

/* --- detail sections ----------------------------------------------------------- */
.detail-sec { padding: 18px; border-top: 1px solid var(--line); }
.detail-sec:first-child { border-top: 0; }
.detail-sec h4 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-400); font-weight: 620; margin-bottom: 9px; }
.detail-sec p { font-size: 14px; color: var(--ink-700); max-width: 74ch; }
.bullets { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
.bullets li { display: grid; grid-template-columns: 16px 1fr; gap: 9px; font-size: 13.5px; color: var(--ink-700); }
.bullets li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent-line); margin-top: 8px; }
.steps-flow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.steps-flow .st { padding: 6px 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12.5px; }
.steps-flow .ar { color: var(--ink-300); }

/* --- AI shift ------------------------------------------------------------------ */
.shift { display: grid; gap: 0; }
.shift-row { display: grid; grid-template-columns: minmax(0,1fr) 28px minmax(0,1fr); gap: 12px; align-items: center; padding: 13px 18px; border-top: 1px solid var(--dark-line); }
.shift-row:first-child { border-top: 0; }
.shift .a { font-size: 13.5px; color: var(--dark-ink-2); }
.shift .b { font-size: 13.5px; color: #fff; font-weight: 550; }
.shift .ar { color: #46587A; text-align: center; }
.shift .note { grid-column: 1/-1; font-size: 12px; color: #7286A6; }

/* --- skills --------------------------------------------------------------------- */
.skill-row { padding: 15px 18px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.skill-row:first-child { border-top: 0; }
.skill-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.skill-top .nm { font-size: 14px; font-weight: 570; }
.skill-top .hint { font-size: 12.5px; color: var(--ink-400); }
.skill-scale { display: grid; grid-template-columns: 74px 1fr 64px; gap: 12px; align-items: center; }
.skill-scale .lab { font-size: 12px; color: var(--ink-400); }
.skill-scale .val { font-size: 13px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.gapbar { position: relative; height: 8px; background: var(--surface-3); border-radius: 999px; }
.gapbar .cur { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 999px; transition: width .4s; }
.gapbar .tgt { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--ink-900); border-radius: 2px; transition: left .4s; }

/* --- wizard ---------------------------------------------------------------------- */
.wiz-steps { display: flex; gap: 4px; padding: 14px 18px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.wiz-step { display: flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; font-size: 12.5px; color: var(--ink-400); white-space: nowrap; cursor: pointer; border: 1px solid transparent; }
.wiz-step b { width: 18px; height: 18px; border-radius: 50%; background: var(--surface-3); display: grid; place-items: center; font-size: 10.5px; color: var(--ink-500); }
.wiz-step.on { background: var(--accent-soft); color: var(--accent-deep); border-color: var(--accent-line); }
.wiz-step.on b { background: var(--accent); color: #fff; }
.wiz-step.ok b { background: var(--ok); color: #fff; }

/* --- checklist ------------------------------------------------------------------- */
.check-row { display: flex; gap: 12px; padding: 12px 18px; border-top: 1px solid var(--line); align-items: flex-start; cursor: pointer; }
.check-row:first-child { border-top: 0; }
.check-row:hover { background: var(--surface-2); }
.box { width: 19px; height: 19px; border-radius: 6px; border: 1.5px solid var(--line-2); flex: none; display: grid; place-items: center; margin-top: 1px; background: var(--surface); transition: background .13s, border-color .13s; }
.box svg { width: 12px; height: 12px; color: #fff; opacity: 0; }
.check-row.on .box { background: var(--accent); border-color: var(--accent); }
.check-row.on .box svg { opacity: 1; }
.check-row.on .t { color: var(--ink-400); text-decoration: line-through; }

/* --- coach ------------------------------------------------------------------------ */
.coach { display: grid; gap: 8px; }
.coach-item { display: grid; grid-template-columns: 18px 1fr; gap: 10px; font-size: 13px; align-items: start; }
.coach-item .ic { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; margin-top: 1px; }
.coach-item.yes .ic { background: var(--ok-bg); color: var(--ok); }
.coach-item.no  .ic { background: var(--warn-bg); color: var(--warn); }
.coach-item .fix { font-size: 12px; color: var(--ink-400); margin-top: 2px; }
.coach-item.yes .t { color: var(--ink-400); }

/* --- LinkedIn preview --------------------------------------------------------------- */
.li-prev { border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; background: var(--surface); position: sticky; top: 90px; }
.li-cover { height: 74px; background: linear-gradient(120deg,#1B4296,#2559C7 55%,#3E7BE8); }
.li-body { padding: 0 18px 18px; }
.li-avatar { width: 76px; height: 76px; border-radius: 50%; border: 3px solid #fff; background: var(--surface-3); margin-top: -38px; display: grid; place-items: center; color: var(--ink-300); font-size: 25px; font-weight: 600; }
.li-name { font-size: 18px; font-weight: 640; margin-top: 10px; }
.li-head { font-size: 13.5px; color: var(--ink-700); margin-top: 3px; }
.li-meta { font-size: 12px; color: var(--ink-400); margin-top: 6px; }
.li-sec { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 14px; }
.li-sec h5 { font-size: 12.5px; font-weight: 620; margin-bottom: 4px; }
.li-sec p { font-size: 12.5px; color: var(--ink-500); white-space: pre-wrap; }
.li-sec.missing p { color: var(--ink-300); font-style: italic; }

/* --- timer ---------------------------------------------------------------------------- */
.timer-face { font-size: 54px; font-weight: 660; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; line-height: 1; }
.timer-face.in { color: var(--ok); }
.timer-face.over { color: var(--bad); }
.timer-band { font-size: 12.5px; color: var(--ink-400); margin-top: 6px; }

/* --- misc ------------------------------------------------------------------------------ */
.wordcount { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink-400); }
.wordcount.ok { color: var(--ok); } .wordcount.warn { color: var(--warn); }
.ref-out { font-family: var(--mono); font-size: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; color: var(--ink-700); word-break: break-word; }
.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(14px); background: var(--dark); color: #fff;
  padding: 10px 18px; border-radius: 999px; font-size: 13px; box-shadow: var(--sh-3); opacity: 0; pointer-events: none; transition: all .22s; z-index: 90; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.railtoggle { display: none; }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .rail { position: fixed; inset: 0 auto 0 0; width: 262px; z-index: 60; transform: translateX(-100%); transition: transform .22s; }
  .rail.open { transform: none; }
  .railtoggle { display: inline-flex; }
  .scrim { position: fixed; inset: 0; background: rgba(12,20,37,.42); z-index: 50; }
}

/* =============================================================================
   The Journey canvas
   ========================================================================== */
.journey { position: relative; height: clamp(480px, calc(100vh - 250px), 820px); overflow: hidden; border-radius: var(--r-lg);
  background: #0E1626; border: 1px solid var(--dark-line); cursor: grab; user-select: none; touch-action: none; box-shadow: var(--sh-2); }

.cv-depth, .cv-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.cv-world { width: 2400px; height: 1400px; }
.cv-depth { width: 3600px; height: 2200px; left: -600px; top: -400px;
  background:
    radial-gradient(700px 480px at 22% 32%, rgba(37,89,199,.26), transparent 70%),
    radial-gradient(820px 560px at 74% 66%, rgba(62,123,232,.16), transparent 70%),
    radial-gradient(circle at 1px 1px, rgba(255,255,255,.075) 1px, transparent 1.6px) 0 0 / 28px 28px; }
.moving { transition: transform .9s cubic-bezier(.2,.8,.2,1), left .9s cubic-bezier(.2,.8,.2,1), top .9s cubic-bezier(.2,.8,.2,1), width .9s cubic-bezier(.2,.8,.2,1), height .9s cubic-bezier(.2,.8,.2,1); }
.cv-path { position: absolute; left: 0; top: 0; overflow: visible; }

.cv-node { position: absolute; width: 300px; transform: translate(-50%,-50%); text-align: center; cursor: pointer; }
.cv-ring { width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 50%; display: grid; place-items: center;
  font-size: 20px; font-weight: 650; border: 2px solid #34466A; background: #141F35; color: #9FADC6; transition: transform .3s; }
.cv-node.focus .cv-ring { transform: scale(1.08); }
.st-done .cv-ring { background: #0F3D2E; border-color: #1E7A55; color: #7FE0B4; }
.st-now .cv-ring { background: var(--accent); border-color: #6E9BEF; color: #fff; animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse {
  0%,100% { box-shadow: 0 0 0 10px rgba(37,89,199,.24), 0 0 0 22px rgba(37,89,199,.10); }
  50%     { box-shadow: 0 0 0 16px rgba(37,89,199,.20), 0 0 0 36px rgba(37,89,199,.06); } }
.cv-title { font-size: 30px; font-weight: 620; color: #F2F5FA; letter-spacing: -.02em; line-height: 1.15; }
.st-todo .cv-title { color: #B9C4DA; }
.cv-blurb, .cv-live, .cv-acts { opacity: 0; transition: opacity .35s ease; }
.z2 .cv-blurb, .z2 .cv-live { opacity: 1; }
.z3 .cv-acts { opacity: 1; }
.cv-blurb { font-size: 15px; color: #9FADC6; margin-top: 8px; }
.cv-live { display: inline-block; margin-top: 10px; font-size: 13px; padding: 4px 11px; border-radius: 999px;
  background: #17223A; border: 1px solid #2B3B5C; color: #CFE0FB; }
.st-done .cv-live { color: #7FE0B4; border-color: #1E7A55; }
.st-now  .cv-live { color: #fff; border-color: #4C7BDD; background: #1E3A6B; }
.cv-act { position: absolute; left: 50%; top: 50%; width: 176px; padding: 10px 12px; border-radius: 10px;
  background: #F6F8FB; color: #0C1425; font-size: 12.5px; font-weight: 550; text-align: left; line-height: 1.35;
  box-shadow: 0 10px 28px -8px rgba(0,0,0,.65); pointer-events: none; transition: transform .35s, box-shadow .2s; }
.z3 .cv-act { pointer-events: auto; cursor: pointer; }
.z3 .cv-act:hover { box-shadow: 0 14px 34px -8px rgba(0,0,0,.7); filter: brightness(1.03); }
.cv-act b { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent-deep); margin-bottom: 3px; }

.cv-hud { position: absolute; left: 14px; top: 14px; display: flex; gap: 8px; flex-wrap: wrap; z-index: 3; }
.cv-hud .btn { background: rgba(23,34,58,.86); border-color: #2B3B5C; color: #E6EDF8; backdrop-filter: blur(8px); }
.cv-hud .btn:hover { background: #25355A; color: #fff; }
.cv-hud .btn-primary { background: var(--accent); border-color: var(--accent); }
.cv-hud .btn-primary:hover { background: #2F68DC; }
.cv-hint { position: absolute; left: 14px; bottom: 14px; font-size: 12px; color: #8D9BB6; background: rgba(14,22,38,.72);
  padding: 6px 10px; border-radius: 8px; z-index: 3; backdrop-filter: blur(8px); }
.cv-mini { position: absolute; right: 14px; bottom: 14px; width: 192px; height: 112px; overflow: hidden; z-index: 3;
  background: rgba(14,22,38,.84); border: 1px solid #2B3B5C; border-radius: 10px; backdrop-filter: blur(8px); cursor: crosshair; }
.cv-mini i { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #5B6D90; transform: translate(-50%,-50%); }
.cv-mini i.done { background: #1E7A55; }
.cv-mini i.now  { background: var(--accent); box-shadow: 0 0 0 3px rgba(37,89,199,.38); }
.cv-view { position: absolute; border: 1.5px solid #CFE0FB; border-radius: 3px; box-shadow: 0 0 0 999px rgba(0,0,0,.28); }
@media (max-width: 720px) { .cv-hint, .cv-mini { display: none; } .journey { height: 62vh; } }
@media (prefers-reduced-motion: reduce) { .moving { transition: none; } .st-now .cv-ring { animation: none; box-shadow: 0 0 0 10px rgba(37,89,199,.24); } }

<script>
/* =============================================================================
   data.js — the fixed content of the platform: the module roadmap, the career
   library, the skills catalogue, the CW1 requirements, the LinkedIn sections,
   the reflection types and the research resources.

   Nothing here is student data. Everything a student creates lives in
   store.js and is saved to their own browser.
   ========================================================================== */

const PSE = {};

PSE.meta = {
  module: "Professional Skills and Employability",
  institution: "Westminster International University",
  year: "2026/2027",
  tagline: "Build the career you want."
};

/* --- The module journey ----------------------------------------------------- */
PSE.roadmap = [
  { id: "meet",     n: "01", title: "Meet & Greet",      blurb: "Meet the cohort and the module team; understand how PSE is assessed.",
    activities: ["Introductions and cohort norms", "Module handbook walkthrough", "Assessment overview"], route: "#/roadmap" },
  { id: "understand", n: "02", title: "Understand PSE",  blurb: "What employability means and how this module builds it.",
    activities: ["Employability framework", "CW1 and CW2 briefing", "Attendance and participation"], route: "#/roadmap" },
  { id: "explore",  n: "03", title: "Explore Careers",   blurb: "Research occupations properly, using real labour-market sources.",
    activities: ["Use the Career Explorer", "Shortlist three careers", "Save sources to the library"], route: "#/careers" },
  { id: "skills",   n: "04", title: "Identify Skills",   blurb: "Rate where you are now and where you need to be.",
    activities: ["Complete the self-assessment", "Set target levels", "Read the gap analysis"], route: "#/skills" },
  { id: "goals",    n: "05", title: "Set Goals",         blurb: "Turn the gaps into SMART goals with real deadlines.",
    activities: ["Build a SMART goal", "Plan around obstacles", "Track progress"], route: "#/goals" },
  { id: "cw1",      n: "06", title: "CW1 — Group Presentation", blurb: "Research a career, build the deck, rehearse to time.",
    activities: ["Work the research checklist", "Plan ten slides", "Practise to 5–7 minutes"], route: "#/cw1" },
  { id: "cw2",      n: "07", title: "CW2 — LinkedIn",    blurb: "Build a professional profile and write reflective posts.",
    activities: ["Complete each profile section", "Write the headline", "Post 70–100 word reflections"], route: "#/cw2" },
  { id: "reflect",  n: "08", title: "Reflection",        blurb: "Turn experiences into evidence of professional growth.",
    activities: ["Reflect on guest lectures", "Reflect on the mock interview", "Reflect on the AI Literacy Course"], route: "#/reflections" }
];

/* --- Skills catalogue ------------------------------------------------------- */
PSE.skills = [
  { id: "communication", name: "Communication",      group: "Core",
    hint: "Explaining ideas clearly in writing and in person, and listening well.",
    actions: ["Present in every seminar you can", "Write a 200-word summary of a lecture and cut it to 100", "Ask for feedback after each presentation"] },
  { id: "presentation",  name: "Presentation",       group: "Core",
    hint: "Delivering to an audience: structure, pace, eye contact, handling questions.",
    actions: ["Record yourself and watch it back", "Rehearse to a timer, not to a feeling", "Practise the first 30 seconds until it is automatic"] },
  { id: "teamwork",      name: "Teamwork",           group: "Core",
    hint: "Contributing to a group, sharing work fairly, resolving disagreement.",
    actions: ["Take a defined role in your CW1 group", "Run a 10-minute weekly stand-up", "Write down who owns what"] },
  { id: "problem",       name: "Problem solving",    group: "Core",
    hint: "Breaking an unfamiliar problem down and working towards a defensible answer.",
    actions: ["Do one case study a week", "Write the problem in one sentence before solving it", "Compare two possible solutions in writing"] },
  { id: "technical",     name: "Technical skills",   group: "Professional",
    hint: "The tools your target role actually uses — Excel, SQL, Python, design tools, accounting software.",
    actions: ["Finish one structured course end to end", "Build one small project you can show", "Rebuild a real dataset or brief from scratch"] },
  { id: "ailiteracy",    name: "AI literacy",        group: "Professional",
    hint: "Using AI tools well, knowing their limits, and being honest about their use.",
    actions: ["Complete the AI Literacy Course", "Write down three tasks AI does badly in your field", "Check an AI answer against a primary source"] },
  { id: "criticalthink", name: "Critical thinking",  group: "Professional",
    hint: "Judging evidence, spotting weak claims, and separating opinion from data.",
    actions: ["Trace one statistic back to its original source", "Argue the opposite side of a claim you believe", "Check who funded a report before quoting it"] },
  { id: "timemgmt",      name: "Time management",    group: "Professional",
    hint: "Planning work backwards from deadlines and protecting time to do it.",
    actions: ["Put every deadline in one calendar", "Plan CW1 backwards from the presentation date", "Block two fixed study sessions a week"] },
  { id: "adaptability",  name: "Adaptability",       group: "Professional",
    hint: "Staying effective when the task, the tools or the team change.",
    actions: ["Volunteer for the unfamiliar part of a group task", "Learn one tool outside your comfort zone", "Reflect on a change that went badly and why"] },
  { id: "networking",    name: "Networking",         group: "Professional",
    hint: "Building genuine professional relationships and using them well.",
    actions: ["Connect with three guest speakers on LinkedIn", "Write a short note with every connection request", "Ask one professional for a 15-minute conversation"] }
];

/* --- Career library ---------------------------------------------------------
   Starter research, not a substitute for the student's own. Every numeric
   claim carries a source and a year; students must verify before citing in
   CW1. Salary figures are US medians from the BLS Occupational Outlook
   Handbook because it is a stable, citable, public source — local ranges vary
   widely and students should research those themselves. -------------------- */

PSE.careerFields = [
  { key: "overview",      label: "Career overview" },
  { key: "responsibilities", label: "Responsibilities" },
  { key: "environment",   label: "Work environment" },
  { key: "progression",   label: "Typical career progression" },
  { key: "skills",        label: "Required skills and abilities" },
  { key: "education",     label: "Education and training" },
  { key: "demand",        label: "Current job-market demand" },
  { key: "ai",            label: "AI, automation and global trends" },
  { key: "outlook",       label: "Projected growth" },
  { key: "salary",        label: "Salary information" },
  { key: "develop",       label: "How to develop these skills" }
];

const C = (o) => o;
PSE.careers = [
  C({ id: "data-analyst", title: "Data Analyst", industry: "Technology & Data", level: "Entry to mid",
    demand: "High", ai: "Augmented", growth: "+23%", growthNote: "Operations research analysts, 2023–33",
    salary: 83640, salaryNote: "US median annual wage, operations research analysts, May 2023",
    majors: ["Business", "Economics", "Computer Science", "Mathematics"],
    overview: "Data analysts turn raw data into decisions. They collect and clean data, look for patterns, and present findings to people who are not analysts. Almost every sector now employs them — banking, retail, logistics, health, government.",
    responsibilities: ["Collect, clean and validate data from several systems", "Build dashboards and recurring reports", "Run analyses to answer a specific business question", "Present findings to non-technical colleagues", "Define and monitor performance metrics"],
    environment: "Office or hybrid, usually inside a business team rather than an IT department. Work is project-based with recurring reporting cycles. Deadlines cluster around month-end and quarter-end.",

    what: "Entry-level career information written for graduates, including employer guides.", region: "United States", best: "Graduate entry-level reality" },
  { id: "uzjobs",      name: "UzJobs", org: "UzJobs", url: "https://uzjobs.uz/",
    what: "Uzbekistan job listings — useful for local vacancy volume and advertised requirements.", region: "Uzbekistan", best: "Local demand evidence" },
  { id: "headhunter",  name: "HeadHunter", org: "hh.uz", url: "https://hh.uz/",
    what: "Large regional job board with salary indications and required-skill listings.", region: "Uzbekistan / CIS", best: "Local salary and skill requirements" }
];

/* --- Career readiness score -------------------------------------------------- */
PSE.readinessParts = [
  { id: "explore", label: "Career exploration", max: 15, help: "Shortlisting careers and opening their detail pages." },
  { id: "skills",  label: "Skills assessment",   max: 15, help: "Rating your current and target level on each skill." },
  { id: "goals",   label: "SMART goals",         max: 20, help: "Creating goals and moving them forward." },
  { id: "cw1",     label: "CW1 progress",        max: 20, help: "Research checklist, slides and sources." },
  { id: "practice",label: "Presentation practice", max: 10, help: "Rehearsing to time and scoring yourself." },
  { id: "cw2",     label: "LinkedIn profile",    max: 12, help: "Completing each required profile section." },
  { id: "reflect", label: "Reflections",         max: 8,  help: "Writing reflections within the word range." }
];

PSE.achievements = [
  { id: "explorer",  label: "Career Explorer",       need: "Open three career detail pages" },
  { id: "goalsetter",label: "Goal Setter",           need: "Create your first SMART goal" },
  { id: "researcher",label: "Researcher",            need: "Save five sources to the library" },
  { id: "presenter", label: "Presenter",             need: "Complete a timed practice run" },
  { id: "identity",  label: "Professional Identity", need: "Complete six LinkedIn sections" },
  { id: "reflective",label: "Reflective Practitioner", need: "Write three reflections in range" }

<script>
/* =============================================================================
   store.js — everything the student creates.
   Saved to this browser with localStorage: no account, no server, works from a
   USB stick. Views subscribe to changes and re-render.
   ========================================================================== */

const Store = (function () {
  const KEY = "pse-workspace-v1";

  const blank = () => ({
    profile: { name: "", major: "", targetRole: "", interests: "" },
    shortlist: [], viewed: [],
    skills: {},                 /* skillId -> { current, target, why } */
    goals: [],
    cw1: { career: "", checklist: {}, slides: {}, sources: [], practice: [] },
    cw2: { sections: {}, headline: "" },
    reflections: [],
    createdAt: new Date().toISOString()
  });

  let state = blank();
  const listeners = [];

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) state = Object.assign(blank(), JSON.parse(raw));
    } catch (e) { /* private mode or corrupt — start clean */ }
    return state;
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { /* quota or private mode: the session still works, it just won't persist */ }
  }

  function get() { return state; }

  /* Mutate through here so every change persists and re-renders exactly once. */
  function update(fn) {
    fn(state);
    save();
    listeners.forEach(l => l(state));
  }

  function subscribe(fn) { listeners.push(fn); }
  function reset() { state = blank(); save(); listeners.forEach(l => l(state)); }

  function exportJSON() { return JSON.stringify(state, null, 2); }
  function importJSON(text) {
    const parsed = JSON.parse(text);
    state = Object.assign(blank(), parsed);
    save(); listeners.forEach(l => l(state));
  }

  const uid = () => Math.random().toString(36).slice(2, 10);

  /* --- derived ------------------------------------------------------------- */

  function skillRows() {
    return PSE.skills.map(s => {
      const v = state.skills[s.id] || {};
      return { ...s, current: v.current || 0, target: v.target || 0, why: v.why || "",
               gap: Math.max(0, (v.target || 0) - (v.current || 0)) };
    });
  }

  function cw1Progress() {
    const done = PSE.cw1Checklist.filter(i => state.cw1.checklist[i.id]).length;
    return { done, total: PSE.cw1Checklist.length, pct: Math.round(done / PSE.cw1Checklist.length * 100) };
  }

  function slidesDone() {
    return PSE.cw1Slides.filter(s => {
      const v = state.cw1.slides[s.n];
      return v && v.notes && v.notes.trim().length > 20;
    }).length;
  }

  function cw2Progress() {
    let earned = 0, total = 0, done = 0;
    PSE.linkedinSections.forEach(sec => {
      total += sec.weight;
      const v = state.cw2.sections[sec.id] || {};
      const ok = sec.type === "check" ? !!v.done : !!(v.value && v.value.trim().length >= (sec.min || 20));
      if (ok) { earned += sec.weight; done += 1; }
    });
    return { pct: Math.round(earned / total * 100), done, total: PSE.linkedinSections.length };
  }

  const wordCount = t => (t || "").trim().split(/\s+/).filter(Boolean).length;

  function reflectionsInRange() {
    return state.reflections.filter(r => {
      const w = wordCount([r.what, r.learn, r.skills, r.career, r.next].join(" "));
      return w >= 70;
    }).length;
  }

  /* Career readiness — every part is explained in the UI so it never feels
     arbitrary. Each returns { earned, max, detail }. */
  function readiness() {
    const parts = {};
    const s = state;

    const explored = new Set(s.viewed).size;
    parts.explore = { earned: Math.min(15, explored * 5), max: 15,
      detail: explored + " career" + (explored === 1 ? "" : "s") + " explored (5 points each, up to 3)" };

    const rated = skillRows().filter(r => r.current > 0 && r.target > 0).length;
    parts.skills = { earned: Math.round(Math.min(1, rated / PSE.skills.length) * 15), max: 15,
      detail: rated + " of " + PSE.skills.length + " skills rated with a target" };

    const goalPts = s.goals.reduce((a, g) => a + 4 + Math.round((g.progress || 0) / 100 * 6), 0);
    parts.goals = { earned: Math.min(20, goalPts), max: 20,
      detail: s.goals.length + " goal" + (s.goals.length === 1 ? "" : "s") + " created; progress counts towards the score" };

    const c1 = cw1Progress();
    const srcPts = Math.min(4, s.cw1.sources.length);
    parts.cw1 = { earned: Math.min(20, Math.round(c1.pct / 100 * 14) + srcPts + Math.min(2, Math.floor(slidesDone() / 5))), max: 20,
      detail: c1.done + "/" + c1.total + " checklist items, " + s.cw1.sources.length + " sources, " + slidesDone() + "/10 slides" };

    const runs = s.cw1.practice.length;
    parts.practice = { earned: Math.min(10, runs * 5), max: 10,
      detail: runs + " timed practice run" + (runs === 1 ? "" : "s") + " recorded" };

    const c2 = cw2Progress();
    parts.cw2 = { earned: Math.round(c2.pct / 100 * 12), max: 12,
      detail: c2.done + "/" + c2.total + " LinkedIn sections complete" };

    const refl = reflectionsInRange();
    parts.reflect = { earned: Math.min(8, refl * 3), max: 8,
      detail: refl + " reflection" + (refl === 1 ? "" : "s") + " of sufficient depth" };

    const total = Object.values(parts).reduce((a, p) => a + p.earned, 0);
    return { total: Math.round(total), parts };
  }

  function achievements() {
    const s = state;
    const got = {
      explorer:   new Set(s.viewed).size >= 3,
      goalsetter: s.goals.length >= 1,
      researcher: s.cw1.sources.length >= 5,
      presenter:  s.cw1.practice.length >= 1,
      identity:   cw2Progress().done >= 6,
      reflective: reflectionsInRange() >= 3
    };
    return PSE.achievements.map(a => ({ ...a, earned: !!got[a.id] }));
  }

  /* --- "Your next step" ----------------------------------------------------
     One recommendation, chosen by what is most blocking right now. --------- */
  function nextStep() {
    const s = state;
    if (!s.profile.targetRole) return { title: "Set your target role", why: "Everything else — skills, goals, CW1 — gets sharper once you name the job you are aiming at.", cta: "Open Profile", route: "#/profile" };
    if (new Set(s.viewed).size < 3) return { title: "Explore three careers", why: "Compare at least three before committing. You cannot judge one career in isolation.", cta: "Open Career Explorer", route: "#/careers" };
    const unrated = skillRows().filter(r => !r.current || !r.target);
    if (unrated.length > 4) return { title: "Rate your skills", why: "You have " + unrated.length + " skills without a rating. The gap analysis needs both a current and a target level.", cta: "Open Skills", route: "#/skills" };
    if (!s.goals.length) return { title: "Write your first SMART goal", why: "Your biggest skill gap is " + (skillRows().sort((a, b) => b.gap - a.gap)[0] || {}).name + ". Turn it into a goal with a deadline.", cta: "Open Goal Builder", route: "#/goals" };
    const c1 = cw1Progress();
    if (c1.pct < 100) {
      const missing = PSE.cw1Checklist.find(i => !s.cw1.checklist[i.id]);
      return { title: "CW1: " + missing.label, why: missing.help, cta: "Open CW1 Workspace", route: "#/cw1" };
    }
    if (s.cw1.sources.length < 5) return { title: "Add more references", why: "You have " + s.cw1.sources.length + " sources. A Harvard reference list of five or more shows real research.", cta: "Open Source Library", route: "#/cw1" };
    if (!s.cw1.practice.length) return { title: "Run a timed practice", why: "You have never rehearsed to the clock. Your individual share is 5–7 minutes.", cta: "Open Practice", route: "#/cw1" };
    const c2 = cw2Progress();
    if (c2.pct < 100) {
      const sec = PSE.linkedinSections.find(x => { const v = s.cw2.sections[x.id] || {}; return x.type === "check" ? !v.done : !(v.value && v.value.trim().length >= (x.min || 20)); });
      return { title: "LinkedIn: add your " + sec.label.toLowerCase(), why: sec.help, cta: "Open LinkedIn Builder", route: "#/cw2" };
    }
    if (reflectionsInRange() < 3) return { title: "Write a reflection", why: "Reflections are assessed evidence of professional growth. Aim for 70–100 words each.", cta: "Open Reflections", route: "#/reflections" };
    return { title: "Keep your goals moving", why: "The structure is complete. Progress now comes from advancing your goals and rehearsing.", cta: "Open Goals", route: "#/goals" };
  }

  /* --- The offline coach ---------------------------------------------------
     Deterministic checks, not generated prose. Works with no network, and is
     the honest form of help for assessed work: it points at what is missing
     rather than writing the submission. ---------------------------------- */

  function checkGoal(g) {
    const out = [];
    const has = (v, n) => (v || "").trim().length >= n;
    out.push({ ok: has(g.title, 4), label: "Goal has a title" });
    out.push({ ok: has(g.specific, 25), label: "Specific — says exactly what will be accomplished",
      fix: "One sentence naming the concrete outcome, not the intention." });
    out.push({ ok: /\d/.test(g.measurable || "") && has(g.measurable, 10), label: "Measurable — contains a number",
      fix: "Add a quantity: how many, how much, what score." });
    out.push({ ok: has(g.achievable, 20), label: "Achievable — names the resources you have",
      fix: "What skills, time or support make this realistic?" });
    out.push({ ok: has(g.relevant, 20), label: "Relevant — links to your career",
      fix: "Connect it to your target role explicitly." });
    out.push({ ok: !!g.deadline, label: "Time-bound — has a deadline",
      fix: "Pick a date. A goal without one is a wish." });
    out.push({ ok: has(g.actions, 20), label: "Actions listed",
      fix: "What will you actually do — modules, courses, practice?" });
    out.push({ ok: (g.obstacles || []).some(o => (o.solution || "").trim().length > 10), label: "At least one obstacle has a solution",
      fix: "Naming a barrier without a plan does not help you." });
    return out;
  }

  function checkReflection(r) {
    const out = [];
    PSE.reflectionPrompts.forEach(p => {
      out.push({ ok: wordCount(r[p.key]) >= 8, label: p.label, fix: p.hint });
    });
    const w = wordCount([r.what, r.learn, r.skills, r.career, r.next].join(" "));
    out.push({ ok: w >= 70 && w <= 140, label: "Length is in a sensible range (" + w + " words)",
      fix: w < 70 ? "Too thin — the LinkedIn post alone needs 70–100 words." : "Long for a LinkedIn post; tighten it." });
    out.push({ ok: /\b(I|my|me)\b/i.test([r.learn, r.next].join(" ")), label: "Written in the first person",
      fix: "A reflection is about you. Use 'I'." });
    return out;
  }

  function checkCW1() {
    const missing = PSE.cw1Checklist.filter(i => !state.cw1.checklist[i.id]);
    const out = missing.slice(0, 6).map(m => ({ ok: false, label: m.label, fix: m.help }));
    if (state.cw1.sources.length < 5) out.push({ ok: false, label: "Fewer than five references", fix: "Westminster Harvard referencing is assessed. Add sources as you research, not at the end." });
    if (slidesDone() < 10) out.push({ ok: false, label: (10 - slidesDone()) + " slides still have no notes", fix: "Every slide needs a purpose and research notes before you design it." });
    if (!out.length) out.push({ ok: true, label: "Every CW1 requirement is marked complete" });
    return out;
  }

  /* --- Harvard reference formatting ---------------------------------------
     Westminster Harvard: Author (Year) Title. Available at: URL
     (Accessed: D Month YYYY). ------------------------------------------- */
  function harvard(src) {
    const author = (src.author || "Anon.").trim().replace(/\.$/, "");
    const year = (src.year || "n.d.").trim();
    const title = (src.title || "Untitled").trim().replace(/\.$/, "");
    let out = author + " (" + year + ") " + title + ".";
    if (src.url) out += " Available at: " + src.url.trim();
    if (src.accessed) {
      const d = new Date(src.accessed);
      if (!isNaN(d)) {
        const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
        out += " (Accessed: " + d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear() + ")";
      }
    }
    return out + ".";
  }
  function citation(src) {
    const a = (src.author || "Anon.").split(",")[0].trim();
    return "(" + a + ", " + (src.year || "n.d.") + ")";
  }

  /* --- sample workspace ----------------------------------------------------
     An empty product demonstrates nothing. This fills the workspace with a
     plausible student so every screen can be seen working; it is clearly
     labelled and one click removes it. ------------------------------------ */
  function isEmpty() {
    return !state.profile.targetRole && !state.goals.length && !state.reflections.length
      && !Object.keys(state.skills).length && !state.cw1.sources.length;
  }

  function loadSample() {
    const today = new Date();
    const iso = d => d.toISOString().slice(0, 10);
    const plus = n => { const d = new Date(today); d.setDate(d.getDate() + n); return iso(d); };

    state = blank();
    state.isSample = true;
    state.profile = { name: "Sample Student", major: "BSc Business Management",
      targetRole: "Junior Data Analyst", interests: "Analytics, fintech, consulting" };
    state.viewed = ["data-analyst", "business-analyst", "financial-analyst", "marketing-specialist"];
    state.shortlist = ["data-analyst", "business-analyst"];

    const rate = { communication: [6,8,"Confident in seminars, weaker in front of a large room."],
      presentation: [5,8,"I rush when I am nervous and read from the slide."],
      teamwork: [7,8,"Comfortable, but I avoid disagreeing with the group."],
      problem: [6,8,"Fine with structured problems, less so with open ones."],
      technical: [4,8,"Excel is solid, SQL is beginner level, no Python yet."],
      ailiteracy: [5,8,"I use AI tools but cannot always tell when they are wrong."],
      criticalthink: [6,8,"I take published figures at face value too often."],
      timemgmt: [5,7,"I start coursework late and compress the research."],
      adaptability: [7,8,"I adjust well once I understand why something changed."],
      networking: [3,7,"I have almost no professional connections yet."] };
    Object.keys(rate).forEach(k => { state.skills[k] = { current: rate[k][0], target: rate[k][1], why: rate[k][2] }; });

    state.goals = [
      { id: uid(), title: "Reach working SQL competence for analyst roles",
        why: "Every junior analyst advert I have read lists SQL as essential, and it is my largest gap.",
        specific: "Complete a structured SQL course and use it to build two analysis projects from public datasets.",
        measurable: "Finish 40 course exercises and publish 2 projects with written findings.",
        achievable: "I already use Excel well and have 6 free hours a week; the course is free.",
        relevant: "SQL is the single most requested skill for the Junior Data Analyst role I am targeting.",
        deadline: plus(75), progress: 45,
        actions: "Finish the SQL basics course\nRebuild one Excel report as SQL queries\nPublish two projects with written findings",
        obstacles: [{ type: "Lack of time", solution: "Two fixed 90-minute blocks on Tuesday and Saturday mornings.", date: plus(7) },
                    { type: "Lack of confidence", solution: "Work through problems with a study partner from the seminar group.", date: plus(14) }] },
      { id: uid(), title: "Present for seven minutes without reading from the slides",
        why: "Presentation is assessed in CW1 and it is the skill I am weakest at.",
        specific: "Deliver my CW1 section from memory using only keyword prompts.",
        measurable: "Complete 5 timed practice runs scoring 4/5 or above on fluency.",
        achievable: "I can rehearse alone and record on my phone; the group meets weekly.",
        relevant: "Presenting confidently is required for CW1 and for any graduate interview.",
        deadline: plus(30), progress: 20,
        actions: "Record and watch back each run\nCut slide text to keywords only\nRehearse the opening 30 seconds daily",
        obstacles: [{ type: "Lack of confidence", solution: "Practise first to one friend, then to the whole group.", date: plus(10) }] }
    ];

    state.cw1.career = "data-analyst";
    ["career","research","resp","skills","edu","demand","ai","outlook","salary"].forEach(k => state.cw1.checklist[k] = true);
    state.cw1.slides = {
      1: { notes: "Group introduction, why we chose Data Analyst: highest demand of the four careers we compared and it matches three of our majors.", sources: "Team decision" },
      2: { notes: "Definition of the role, the sectors that employ analysts, and how it differs from data scientist and business analyst.", sources: "BLS OOH; O*NET" },
      3: { notes: "Daily duties from O*NET task list; hybrid working; monthly reporting cycle drives the workload peaks.", sources: "O*NET" },
      4: { notes: "SQL, Excel, one BI tool, statistics, and the communication skills to present a finding to a non-analyst.", sources: "O*NET; job adverts sampled on hh.uz" },
      5: { notes: "Bachelor's degree routes plus certification alternatives; portfolio increasingly substitutes for the degree title.", sources: "National Careers Service" },
      6: { notes: "Vacancy counts sampled from UzJobs and hh.uz; BLS projection of +23% to 2033 for operations research analysts.", sources: "BLS OOH; UzJobs; hh.uz" },
      7: { notes: "AI automates query writing and first-draft reporting; judgement about which question matters is what remains scarce.", sources: "Seminar notes; WEF Future of Jobs" }
    };
    state.cw1.sources = [
      { id: uid(), title: "Occupational Outlook Handbook: Operations Research Analysts", author: "US Bureau of Labor Statistics", year: "2024", url: "https://www.bls.gov/ooh/", accessed: iso(today) },
      { id: uid(), title: "O*NET OnLine summary report for Data Scientists", author: "US Department of Labor", year: "2024", url: "https://www.onetonline.org/", accessed: iso(today) },
      { id: uid(), title: "Data analyst job profile", author: "National Careers Service", year: "2024", url: "https://nationalcareers.service.gov.uk/", accessed: iso(today) },
      { id: uid(), title: "Analyst vacancy listings, Tashkent", author: "HeadHunter", year: "2025", url: "https://hh.uz/", accessed: iso(today) },
      { id: uid(), title: "Entry-level analyst listings", author: "UzJobs", year: "2025", url: "https://uzjobs.uz/", accessed: iso(today) }
    ];
    state.cw1.practice = [{ id: uid(), seconds: 388, avg: "3.4", improvement: "Slow down on the job-market slide and stop reading the salary figures.", date: iso(today), scores: {} }];

    const li = { headline: "Undergraduate Student | Aspiring Data Analyst | SQL & Excel",
      about: "Second-year Business Management student at Westminster International University, working towards a junior data analyst role.\n\nI am building practical analysis skills through the PSE module and self-directed projects: SQL, Excel modelling and clear reporting. I am most interested in how organisations use data to make decisions they can defend.\n\nCurrently looking for a summer internship in analytics or finance.",
      education: "BSc Business Management, Westminster International University, 2024–2027. Relevant modules: Professional Skills and Employability, Quantitative Methods, Management Information Systems.",
      experience: "Student ambassador, university open days (2025–present). Guided prospective students and their families, presenting to groups of up to 30 people.",
      volunteer: "Volunteer tutor, community maths club — weekly sessions with secondary school students preparing for exams.",
      orgs: "Member, University Business Society. Participant, Zakovat intellectual quiz team.",
      skills: "SQL (developing) · Microsoft Excel · Data visualisation · Report writing · Presentation · Teamwork · Problem solving",
      courses: "Professional Skills and Employability; Quantitative Methods; AI Literacy Course (in progress)" };
    Object.keys(li).forEach(k => { state.cw2.sections[k] = { value: li[k] }; });
    state.cw2.sections.photo = { done: true };

    state.reflections = [
      { id: uid(), type: "lecture", title: "Guest lecture: analytics in retail banking", date: iso(today),
        what: "A senior analyst from a local bank described how her team turns transaction data into decisions about branch staffing.",
        learn: "I learned that most of the job is deciding which question is worth answering, not running the analysis itself.",
        skills: "I improved my understanding of how analytical work is framed commercially, and I practised asking a question in front of the room.",
        career: "It confirmed that a junior analyst role in financial services is a realistic first step for me.",
        next: "I will rebuild one of my Excel reports as SQL queries this month to close the technical gap she described." },
      { id: uid(), type: "interview", title: "Mock job interview", date: iso(today),
        what: "I took part in a 20-minute mock interview for a graduate analyst position with feedback afterwards.",
        learn: "I learned that my answers were accurate but far too long, and that I gave no concrete examples.",
        skills: "I developed my ability to structure an answer and to stop talking once the question is answered.",
        career: "Interviews are the gate to every role I want, so this is a directly transferable skill.",
        next: "I will prepare five STAR examples and practise each to under 90 seconds before the next mock." },
      { id: uid(), type: "ailit", title: "AI Literacy Course", date: iso(today),
        what: "I completed the modules on how large language models work and where they fail.",
        learn: "I learned that confident output and correct output are unrelated, and that verification is my responsibility.",
        skills: "I developed practical AI literacy and a habit of checking generated claims against a primary source.",
        career: "Analysts are increasingly expected to use these tools and to be accountable for what they produce.",
        next: "I will check every AI-suggested figure in our CW1 research against the original source before it goes on a slide." }
    ];
    save(); listeners.forEach(l => l(state));
  }

  return { load, get, update, subscribe, reset, exportJSON, importJSON, uid, isEmpty, loadSample,
           skillRows, cw1Progress, slidesDone, cw2Progress, wordCount, reflectionsInRange,
           readiness, achievements, nextStep, checkGoal, checkReflection, checkCW1,
           harvard, citation };
})();

</script>
<script>
/* =============================================================================
   canvas.js — the Journey canvas.
   One large world; a camera that flies and zooms between stages instead of
   cutting between pages. Unlike an authored zoom-presentation, the camera is
   driven by the student's own state: it opens on the current stage, the path
   fills to the furthest completed one, and "next step" flies to the task that
   actually needs doing. A parallax depth layer moves at a third of the camera
   speed; a minimap shows the viewport on the whole world.
   ========================================================================== */

const Journey = (function () {
  const W = 2400, H = 1400;
  const PTS = [{ x: 300, y: 440 }, { x: 640, y: 300 }, { x: 980, y: 470 }, { x: 1320, y: 320 },
               { x: 1650, y: 500 }, { x: 1980, y: 350 }, { x: 2120, y: 760 }, { x: 1760, y: 990 }];
  const ANG = [-95, 22, 162].map(a => a * Math.PI / 180);   /* satellites clear the neighbouring stage title */
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let host, world, depth, mini, view, stages, cam = { tx: 0, ty: 0, s: 1 };
  let focus = -1, level = 1, isActive = false, drag = null, dragged = false, ro, timers = [];

  const clampS = s => Math.max(0.28, Math.min(3.2, s));
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function smooth(pts) {
    let d = `M${pts[0].x},${pts[0].y}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      d += ` C${p1.x + (p2.x - p0.x) / 6},${p1.y + (p2.y - p0.y) / 6} ${p2.x - (p3.x - p1.x) / 6},${p2.y - (p3.y - p1.y) / 6} ${p2.x},${p2.y}`;
    }
    return d;
  }

  /* --- camera ---------------------------------------------------------------- */
  function apply(animate) {
    const mv = !!animate && !reduced;
    world.classList.toggle("moving", mv); depth.classList.toggle("moving", mv); view.classList.toggle("moving", mv);
    world.style.transform = `translate(${cam.tx}px,${cam.ty}px) scale(${cam.s})`;
    depth.style.transform = `translate(${cam.tx * 0.35}px,${cam.ty * 0.35}px) scale(${1 + (cam.s - 1) * 0.25})`;
    host.classList.toggle("z2", cam.s >= 1.15);
    host.classList.toggle("z3", cam.s >= 1.9);
    const k = mini.clientWidth / W;
    view.style.left = (-cam.tx / cam.s) * k + "px";  view.style.top = (-cam.ty / cam.s) * k + "px";
    view.style.width = (host.clientWidth / cam.s) * k + "px"; view.style.height = (host.clientHeight / cam.s) * k + "px";
  }
  function flyTo(cx, cy, s, animate) {
    cam.s = clampS(s); cam.tx = host.clientWidth / 2 - cx * cam.s; cam.ty = host.clientHeight / 2 - cy * cam.s; apply(animate !== false);
  }
  const fitScale = () => Math.min(host.clientWidth / W, host.clientHeight / H) * 0.94;

  function markFocus() { world.querySelectorAll(".cv-node").forEach((n, i) => n.classList.toggle("focus", i === focus)); }
  function overview(animate) { focus = -1; level = 1; markFocus(); flyTo(W / 2, H / 2, fitScale(), animate); }
  function stage(i, lvl, animate) {
    if (i < 0 || i >= PTS.length) return;
    focus = i; level = lvl || 1; markFocus();
    const p = PTS[i];
    flyTo(p.x, p.y + (level === 2 ? 70 : 20), level === 2 ? 2.35 : 1.5, animate);
  }
  function step(d) { stage(focus < 0 ? (d > 0 ? 0 : PTS.length - 1) : Math.max(0, Math.min(PTS.length - 1, focus + d)), 1); }
  function deeper() { if (focus < 0) stage(now(), 1); else if (level === 1) stage(focus, 2); else overview(); }
  const now = () => { const i = stages.findIndex(s => s.state === "now"); return i < 0 ? 0 : i; };

  /* --- build ------------------------------------------------------------------ */
  function mount(el, list, intent) {
    destroy(); host = el; stages = list; isActive = true;
    const doneN = (() => { let n = 0; for (const s of stages) { if (s.state === "done") n++; else break; } return n; })();
    const prog = Math.max(0, Math.min(1, (doneN - (doneN === PTS.length ? 0 : 1)) / (PTS.length - 1)));

    host.innerHTML = `
      <div class="cv-depth"></div>
      <div class="cv-world">
        <svg class="cv-path" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">
          <path d="${smooth(PTS)}" fill="none" stroke="#2B3B5C" stroke-width="4" stroke-dasharray="10 12" stroke-linecap="round"/>
          <path d="${smooth(PTS)}" fill="none" stroke="#3E7BE8" stroke-width="5" stroke-linecap="round" pathLength="1" stroke-dasharray="${prog} 1"/>
        </svg>
        ${stages.map((s, i) => `
          <div class="cv-node st-${s.state}" style="left:${PTS[i].x}px;top:${PTS[i].y}px" data-i="${i}">
            <div class="cv-acts">${s.activities.map((a, k) => `
              <div class="cv-act" style="transform:translate(calc(-50% + ${Math.round(182 * Math.cos(ANG[k]))}px), calc(-50% + ${Math.round(182 * Math.sin(ANG[k]))}px))"
                   data-act="go" data-route="${esc(s.route)}"><b>Activity ${k + 1}</b>${esc(a)}</div>`).join("")}</div>
            <div class="cv-ring">${s.state === "done" ? "✓" : s.n}</div>
            <div class="cv-title">${esc(s.title)}</div>
            <div class="cv-blurb">${esc(s.blurb)}</div>
            <div class="cv-live">${esc(s.live)}</div>
          </div>`).join("")}
      </div>
      <div class="cv-hud">
        <button class="btn btn-sm" data-act="jout">Overview</button>
        <button class="btn btn-sm" data-act="jstep" data-d="-1">←</button>
        <button class="btn btn-sm" data-act="jstep" data-d="1">→</button>
        <button class="btn btn-sm btn-primary" data-act="jnext">Fly to my next step</button>
      </div>
      <div class="cv-hint">Drag to pan · scroll to zoom · click a stage twice to see its tasks · Esc for overview</div>
      <div class="cv-mini" aria-hidden="true">${stages.map((s, i) => `<i class="${s.state}" style="left:${PTS[i].x / W * 100}%;top:${PTS[i].y / H * 100}%"></i>`).join("")}<div class="cv-view"></div></div>`;

    world = host.querySelector(".cv-world"); depth = host.querySelector(".cv-depth");
    mini = host.querySelector(".cv-mini"); view = host.querySelector(".cv-view");

    /* pointer: drag to pan; a real click on a node zooms */
    host.addEventListener("pointerdown", e => {
      if (e.target.closest(".cv-hud, .cv-mini, .cv-act")) return;
      drag = { x: e.clientX, y: e.clientY, tx: cam.tx, ty: cam.ty }; dragged = false; host.classList.add("dragging"); host.setPointerCapture(e.pointerId);
    });
    host.addEventListener("pointermove", e => {
      if (!drag) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) dragged = true;
      cam.tx = drag.tx + dx; cam.ty = drag.ty + dy; apply(false);
    });
    const up = () => { drag = null; host.classList.remove("dragging"); };
    host.addEventListener("pointerup", up); host.addEventListener("pointercancel", up);
    host.addEventListener("click", e => {
      if (dragged) { e.stopPropagation(); e.preventDefault(); dragged = false; return; }
      if (e.target.closest(".cv-hud, .cv-act")) return;
      const m = e.target.closest(".cv-mini");
      if (m) { const r = m.getBoundingClientRect(); flyTo((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H, cam.s); return; }
      const n = e.target.closest(".cv-node");
      if (n) { const i = +n.getAttribute("data-i"); stage(i, focus === i && level === 1 ? 2 : 1); }
    });
    host.addEventListener("wheel", e => {
      e.preventDefault();
      const r = host.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
      const wx = (px - cam.tx) / cam.s, wy = (py - cam.ty) / cam.s;
      const ns = clampS(cam.s * Math.exp(-e.deltaY * 0.0016));
      cam.tx = px - wx * ns; cam.ty = py - wy * ns; cam.s = ns; apply(false);
    }, { passive: false });
    ro = new ResizeObserver(() => { if (!isActive) return; focus < 0 ? overview(false) : stage(focus, level, false); });
    ro.observe(host);

    /* arrive: overview, then fly to where the student actually is */
    overview(false);
    timers.push(setTimeout(() => {
      if (!isActive) return;
      if (intent === "next") { flyNext(); return; }
      stage(now(), 1);
    }, reduced ? 0 : 420));
  }

  function flyNext() {
    const route = Store.nextStep().route;
    let i = stages.findIndex(s => s.route === route);
    if (i < 0) i = now();
    stage(i, 2);
  }

  function destroy() {
    isActive = false; timers.forEach(clearTimeout); timers = [];
    if (ro) { ro.disconnect(); ro = null; }
    host = world = depth = mini = view = null; focus = -1; level = 1;
  }

  return { mount, destroy, overview, stage, step, deeper, flyNext, now, active: () => isActive };
})();

</script>
<script>
/* =============================================================================
   fx.js — the presentation layer.
   Views are pure functions returning HTML and the router replaces the page
   wholesale, so there is nowhere for a view to own an animation. This runtime
   gives that back: a module registers as PSEFX.<id> and is handed each freshly
   rendered page to decorate, with every timer and observer it starts torn down
   automatically on the next navigation.
   ========================================================================== */

const PSEFX = {};

const FX = (function () {
  const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  let teardown = [];

  function makeApi() {
    const api = {
      reduced: reduced(),
      raf(fn) {
        let id, t0 = null, stop = false;
        const step = ts => {
          if (stop) return;
          if (t0 === null) t0 = ts;
          if (fn((ts - t0) / 1000) !== false) id = requestAnimationFrame(step);
        };
        id = requestAnimationFrame(step);
        teardown.push(() => { stop = true; cancelAnimationFrame(id); });
      },
      after(ms, fn) { const id = setTimeout(fn, api.reduced ? 0 : ms); teardown.push(() => clearTimeout(id)); return id; },
      every(ms, fn) { const id = setInterval(fn, ms); teardown.push(() => clearInterval(id)); return id; },
      observe(obs) { teardown.push(() => obs.disconnect()); return obs; },
      on(el, ev, fn, opts) { el.addEventListener(ev, fn, opts); teardown.push(() => el.removeEventListener(ev, fn, opts)); },
      onTeardown(fn) { teardown.push(fn); },
      ease: {
        out: t => 1 - Math.pow(1 - t, 3),
        inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2
      }
    };
    return api;
  }

  /* Called by app.js immediately after a page's HTML is in the DOM. */
  function run(root, ctx) {
    teardown.forEach(fn => { try { fn(); } catch (e) {} });
    teardown = [];
    const api = makeApi();
    Object.keys(PSEFX).forEach(id => {
      const m = PSEFX[id];
      if (!m || typeof m.onRender !== "function") return;
      try { m.onRender(root, ctx, api); }
      catch (e) { console.warn("[fx] " + id + " failed:", e && e.message); }
    });
  }

  /* Once, after boot — for anything that outlives a page (overlays, hotkeys). */
  function boot(api0) {
    const api = api0 || {
      reduced: reduced(), raf: f => requestAnimationFrame(f),
      after: (ms, f) => setTimeout(f, ms), every: (ms, f) => setInterval(f, ms),
      on: (el, ev, fn) => el.addEventListener(ev, fn), onTeardown() {},
      ease: { out: t => 1 - Math.pow(1 - t, 3), inOut: t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2 }
    };
    Object.keys(PSEFX).forEach(id => {
      const m = PSEFX[id];
      if (m && typeof m.init === "function") {
        try { m.init(api); } catch (e) { console.warn("[fx] init " + id + " failed:", e && e.message); }
      }
    });
  }

  return { run, boot, reduced };
})();

window.PSEFX = PSEFX;
window.FX = FX;

</script>

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>

const ic = (n, cls) => `<svg class="${cls || ""}" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n] || ""}</svg>`;

    <svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="8"/>

const bar = (pct, cls) => `<div class="bar ${cls||""}"><i style="width:${Math.max(0,Math.min(100,pct))}%"></i></div>`;

const money = n => "$" + n.toLocaleString("en-US");

    <div class="nextstep" style="background:var(--surface);border-color:var(--line-2)">

      <div class="grid" style="gap:16px">
        <div class="card">

          <div class="card-b" style="display:grid;gap:13px">
            ${PSE.readinessParts.map(p => { const got = R.parts[p.id];
              return `<div><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px">

                ${bar(got.earned / got.max * 100)}
                <div style="font-size:11.5px;color:var(--ink-400);margin-top:4px">${esc(got.detail)}</div></div>`; }).join("")}
          </div>
        </div>
        <div class="card">
          <div class="card-h"><h3>Achievements</h3></div>
          <div class="card-b" style="display:grid;gap:9px">

/* ============================ ROADMAP ==================================== */
/* Shared: the state of each roadmap stage, derived from the student's data. */
function stageList() {
  const s = Store.get(), c1 = Store.cw1Progress(), c2 = Store.cw2Progress();
  const rated = Store.skillRows().filter(x => x.current && x.target).length;
  const viewed = new Set(s.viewed).size, refl = Store.reflectionsInRange();
  const done = {
    meet: true, understand: true, explore: viewed >= 3, skills: rated >= PSE.skills.length,
    goals: s.goals.length > 0, cw1: c1.pct === 100, cw2: c2.pct === 100, reflect: refl >= 3
  };
  const live = {
    meet: "Module briefing complete", understand: "Assessment structure understood",
    explore: viewed + " of 3 careers explored", skills: rated + " of " + PSE.skills.length + " skills rated",
    goals: s.goals.length + " SMART goal" + (s.goals.length === 1 ? "" : "s") + (s.goals.length ? ", avg " + Math.round(s.goals.reduce((a, g) => a + (g.progress || 0), 0) / s.goals.length) + "% progress" : ""),
    cw1: c1.done + "/" + c1.total + " requirements · " + s.cw1.sources.length + " sources",
    cw2: c2.pct + "% of the profile complete", reflect: refl + " reflection" + (refl === 1 ? "" : "s") + " in range"
  };
  let nowSeen = false;
  return PSE.roadmap.map(r => {
    let state = done[r.id] ? "done" : "todo";
    if (state === "todo" && !nowSeen) { state = "now"; nowSeen = true; }
    return { ...r, state, live: live[r.id] };
  });
}
