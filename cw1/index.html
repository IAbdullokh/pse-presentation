      ${R(3, `<div class="foot mono warn">Hover any reference to light its thread above. Team: re-open every link and re-check every figure the week before submission — aggregator salaries move monthly.</div>`)}` }
  ]
};

</script>
<script>
/* =============================================================================
   engine.js — a zoom-canvas presentation engine.
   One world, ten frames, a camera. Arriving at a frame reveals its content in
   sequence; counters count; bars fill. O zooms out to the whole map, N shows
   speaker notes, T runs the 5–7 minute clock. No libraries.
   ========================================================================== */
(function () {
  "use strict";
  const $ = s => document.querySelector(s);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const W = DECK.world.w, H = DECK.world.h, F = DECK.frames;

  const stage = $("#stage"), world = $("#world"), depth = $("#depth"), rail = $("#rail"),
        notes = $("#notes"), clock = $("#clock"), spk = $("#speaker"), hint = $("#hint"), ovBtn = $("#ov");
  let idx = 0, overview = false, cam = { tx: 0, ty: 0, s: 1 }, revealT = [], typeT = null;

  /* ---------- build ---------- */
  const centre = f => ({ x: f.x + f.w / 2, y: f.y + f.h / 2 });
  function pathD() {
    const p = F.map(centre); let d = `M${p[0].x},${p[0].y}`;
    for (let i = 0; i < p.length - 1; i++) {
      const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
      d += ` C${p1.x + (p2.x - p0.x) / 6},${p1.y + (p2.y - p0.y) / 6} ${p2.x - (p3.x - p1.x) / 6},${p2.y - (p3.y - p1.y) / 6} ${p2.x},${p2.y}`;
    }
    return d;
  }
  const TOKENS = ["system prompt", "few-shot", "context window", "temperature 0.2", "eval set", "chain of thought", "guardrail", "tokens", "RAG", "red-team", "rubric", "agent", "{{variable}}", "assistant:", "user:", "top_p", "grounding", "hallucination"];

  function build() {
    world.style.width = W + "px"; world.style.height = H + "px";
    world.innerHTML = `<svg class="path" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><path d="${pathD()}"/></svg>` +
      F.map((f, i) => `<section class="frame" data-i="${i}" data-enter="${f.enter || "rise"}" style="left:${f.x}px;top:${f.y}px;width:${f.w}px;height:${f.h}px">
        <div class="fnum mono">${String(i + 1).padStart(2, "0")}</div><div class="fin">${f.html}</div></section>`).join("");
    depth.innerHTML = TOKENS.map((t, i) => `<span class="tok mono" style="left:${(i * 137) % 100}%;top:${(i * 71 + 13) % 100}%;animation-delay:${-i * 1.7}s;animation-duration:${18 + (i % 5) * 4}s">${t}</span>`).join("");
    rail.innerHTML = F.map((f, i) => `<button class="dot" data-i="${i}" title="${f.label}"><span></span></button>`).join("") + `<div class="rlabel" id="rlabel"></div>`;

    /* The route between frames is the one thing a zoom canvas can do that slides
       cannot. Light it, if the module is present. */
    if (window.VIS && VIS.comet && window.VisRuntime) {
      const st = VisRuntime.standalone();
      comet = VIS.comet.attach(world.querySelector(".path path"), st.api);
      cometPoints = F.map(centre);
    }
  }
  let comet = null, cometPoints = null;

  /* ---------- camera ---------- */
  function apply(animate) {
    const mv = animate && !reduced;
    world.classList.toggle("moving", mv); depth.classList.toggle("moving", mv);
    world.style.transform = `translate(${cam.tx}px,${cam.ty}px) scale(${cam.s})`;
    depth.style.transform = `translate(${cam.tx * 0.3}px,${cam.ty * 0.3}px) scale(${1 + (cam.s - 1) * 0.2})`;
  }
  function fitFrame(f) {
    const vw = stage.clientWidth, vh = stage.clientHeight, s = Math.min(vw / f.w, vh / f.h) * 0.88;
    return { s, tx: vw / 2 - (f.x + f.w / 2) * s, ty: vh / 2 - (f.y + f.h / 2) * s };
  }
  function go(i, instant) {
    i = Math.max(0, Math.min(F.length - 1, i));
    const from = idx;
    idx = i; overview = false; stage.classList.remove("ov");
    if (comet && !instant && from !== i && cometPoints) {
      try { comet.run(from, i, cometPoints); } catch (e) {}
    }
    cam = fitFrame(F[i]); apply(!instant);
    activate(i, instant); paintRail(); history.replaceState(null, "", "#" + (i + 1));
  }
  function showOverview() {
    overview = true; stage.classList.add("ov");
    const vw = stage.clientWidth, vh = stage.clientHeight, s = Math.min(vw / W, vh / H) * 0.93;
    cam = { s, tx: vw / 2 - W / 2 * s, ty: vh / 2 - H / 2 * s }; apply(true);
    document.querySelectorAll(".frame").forEach(el => {
      el.classList.remove("active");
      if (window.VisRuntime) { VisRuntime.unmount(el); VisRuntime.mount(el, { static: true }); }
      /* counters and typewriters are driven by arrival, which never happens in
         overview — settle them on their final values so no figure reads 0 */
      el.querySelectorAll(".num").forEach(n => { n.textContent = fmt(n, +n.getAttribute("data-to")); });
      el.querySelectorAll(".type").forEach(t => { t.textContent = t.getAttribute("data-text"); });
    });
    $("#rlabel").textContent = "Overview — click a frame";
  }

  /* ---------- reveal ---------- */
  function activate(i, instant) {
    revealT.forEach(clearTimeout); revealT = []; clearInterval(typeT);
    document.querySelectorAll(".frame").forEach((el, k) => {
      const on = k === i; el.classList.toggle("active", on);
      if (!on) {
        el.querySelectorAll(".num").forEach(n => n.textContent = fmt(n, 0));
        el.querySelectorAll(".type").forEach(t => t.textContent = "");
        if (window.VisRuntime) VisRuntime.unmount(el);     /* nothing animates off-screen */
      }
    });
    const el = document.querySelector(`.frame[data-i="${i}"]`), delay = (instant || reduced) ? 0 : 520;
    revealT.push(setTimeout(() => {
      el.querySelectorAll(".num").forEach(n => count(n));
      el.querySelectorAll(".type").forEach(t => typewrite(t));
      if (window.VisRuntime) { VisRuntime.unmount(el); VisRuntime.mount(el); }  /* live, animated */
    }, delay));
    spk.textContent = TEAM[F[i].speaker] ? TEAM[F[i].speaker].name : "";
    notes.textContent = F[i].notes || "";
  }
  function fmt(n, v) {
    const pre = n.getAttribute("data-prefix") || "", suf = n.getAttribute("data-suffix") || "";
    return pre + Math.round(v).toLocaleString("en-US") + suf;
  }
  function count(n) {
    const to = +n.getAttribute("data-to"); if (reduced) { n.textContent = fmt(n, to); return; }
    const t0 = performance.now(), dur = 1100;
    (function tick(now) { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      n.textContent = fmt(n, to * e); if (p < 1) requestAnimationFrame(tick); })(t0);
  }
  function typewrite(t) {
    const text = t.getAttribute("data-text"); if (reduced) { t.textContent = text; return; }
    let k = 0; t.textContent = "";
    typeT = setInterval(() => {
      t.textContent = text.slice(0, ++k);
      if (k >= text.length) {
        clearInterval(typeT);
        t.dispatchEvent(new CustomEvent("typedone", { bubbles: true }));
      }
    }, 34);
  }
  function paintRail() {
    rail.querySelectorAll(".dot").forEach((d, k) => { d.classList.toggle("on", k === idx); d.classList.toggle("done", k < idx); });
    $("#rlabel").textContent = (idx + 1) + " / " + F.length + " · " + F[idx].label;
  }

  /* ---------- clock: 5–7 minutes per speaker ---------- */
  let sec = 0, tid = null;
  function paintClock() {
    clock.textContent = String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");
    clock.className = "mono" + (sec >= 300 && sec <= 420 ? " in" : sec > 420 ? " over" : "");
  }
  function toggleClock() { if (tid) { clearInterval(tid); tid = null; clock.classList.remove("run"); } else { tid = setInterval(() => { sec++; paintClock(); }, 1000); clock.classList.add("run"); } }
  function resetClock() { clearInterval(tid); tid = null; sec = 0; paintClock(); clock.classList.remove("run"); }

  /* ---------- input ---------- */
  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    switch (e.key) {
      case "ArrowRight": case "PageDown": case " ": case "Enter": if (overview) go(idx); else go(idx + 1); e.preventDefault(); break;
      case "ArrowLeft": case "PageUp": case "Backspace": go(idx - 1); e.preventDefault(); break;
      case "Home": go(0); break; case "End": go(F.length - 1); break;
      case "o": case "O": case "Escape": overview ? go(idx) : showOverview(); break;
      case "n": case "N": document.body.classList.toggle("notes"); break;
      case "t": case "T": toggleClock(); break;
      case "r": case "R": resetClock(); break;
      case "f": case "F": document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); break;
      default: if (/^[1-9]$/.test(e.key)) go(+e.key - 1); else if (e.key === "0") go(9);
    }
  });
  stage.addEventListener("click", e => {
    const fr = e.target.closest(".frame");
    if (overview && fr) { go(+fr.getAttribute("data-i")); return; }
    if (e.target.closest(".ui")) return;
    if (!overview) go(idx + 1);
  });
  rail.addEventListener("click", e => { const d = e.target.closest(".dot"); if (d) { e.stopPropagation(); go(+d.getAttribute("data-i")); } });
  $("#prev").addEventListener("click", e => { e.stopPropagation(); go(idx - 1); });
  $("#next").addEventListener("click", e => { e.stopPropagation(); go(idx + 1); });
  ovBtn.addEventListener("click", e => { e.stopPropagation(); overview ? go(idx) : showOverview(); });
  $("#ntoggle").addEventListener("click", e => { e.stopPropagation(); document.body.classList.toggle("notes"); });
  clock.addEventListener("click", e => { e.stopPropagation(); toggleClock(); });
  let sx = null;
  stage.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener("touchend", e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) go(idx + (dx < 0 ? 1 : -1)); sx = null; });
  new ResizeObserver(() => { overview ? showOverview() : (cam = fitFrame(F[idx]), apply(false)); }).observe(stage);

  /* ---------- start ---------- */
  build(); paintClock();
  const start = Math.min(F.length, Math.max(1, parseInt(location.hash.slice(1)) || 1)) - 1;
  if (reduced) { go(start, true); }
  else { showOverview(); apply(false); setTimeout(() => go(start), 900); }   /* arrive: see the whole map, then fly in */
  setTimeout(() => hint.classList.add("fade"), 6000);
})();

</script>
