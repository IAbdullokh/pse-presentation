<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Engineer as a Career</title>
<meta name="description" content="A CW1 group presentation for the Westminster PSE module: the career of a prompt engineer — overview, responsibilities, skills, education, job market, AI trends, development plan and references — as an animated zoom-canvas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Prompt Engineer as a Career — a conversation between a serif (the human) and a mono (the machine). */
:root {
  color-scheme: dark;
  --bg: #0B0E17; --bg2: #0F1322; --surface: #131829; --surface2: #182036; --line: #232B46; --line2: #2E3859;
  --ink: #F3EFE6; --ink2: #B8BED2; --ink3: #7C86A6;
  --acc: #F2A93B; --acc2: #FFD08A; --blue: #8AA4FF; --ok: #5FD3A2; --bad: #FF7A6B;
  --serif: "Literata", Georgia, "Times New Roman", serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--serif); overflow: hidden; -webkit-font-smoothing: antialiased; }
.mono { font-family: var(--mono); letter-spacing: .02em; }
.dim { color: var(--ink3); } .acc { color: var(--acc); } .warn { color: var(--bad); }
.tiny { font-size: 18px; }

#stage { position: fixed; inset: 0; overflow: hidden; cursor: default; user-select: none;
  background: radial-gradient(1200px 800px at 15% 10%, #141a33 0%, transparent 60%), radial-gradient(1000px 700px at 85% 90%, #1a1730 0%, transparent 60%), var(--bg); }
/* No permanent will-change here. These layers are 5800x6200 and 9000x7000;
   promoting them forever asks the compositor for a texture large enough that
   Chrome silently drops tiles, which showed up as frames painting half-width.
   Promote only while the camera is actually moving. */
#depth, #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#depth { width: 6600px; height: 7000px; left: -400px; top: -400px; pointer-events: none;
  background: radial-gradient(circle at 1px 1px, rgba(243,239,230,.06) 1px, transparent 1.6px) 0 0 / 34px 34px; }
.moving { transition: transform 1.05s cubic-bezier(.22,.8,.2,1); will-change: transform; }
.tok { position: absolute; font-size: 22px; color: rgba(138,164,255,.28); border: 1px solid rgba(138,164,255,.16); padding: 6px 14px; border-radius: 999px; white-space: nowrap; animation: drift linear infinite; }
@keyframes drift { from { transform: translate(0,0); } 50% { transform: translate(60px,-40px); } to { transform: translate(0,0); } }

.path { position: absolute; left: 0; top: 0; overflow: visible; }
.path path { fill: none; stroke: rgba(242,169,59,.25); stroke-width: 5; stroke-dasharray: 14 18; stroke-linecap: round; }

/* ---------- frames ---------- */
.frame { position: absolute; background: var(--surface); border: 1px solid var(--line); border-radius: 28px;
  box-shadow: 0 30px 90px -30px rgba(0,0,0,.8); overflow: hidden; }
.frame::before { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(242,169,59,.06), transparent 40%); pointer-events: none; }
.fnum { position: absolute; right: 34px; top: 30px; font-size: 22px; color: var(--ink3); }
.fin { position: absolute; inset: 0; padding: 74px 84px; display: flex; flex-direction: column; gap: 26px; }
.ov .frame { cursor: pointer; }
.ov .frame:hover { border-color: var(--acc); }

.kicker { font-size: 18px; color: var(--acc); letter-spacing: .14em; }
h1 { font-size: 168px; line-height: .95; margin: 0; font-weight: 500; letter-spacing: -.035em; }
h1 em, h2 em { font-style: italic; color: var(--acc2); }
h2 { font-size: 66px; line-height: 1.05; margin: 0; font-weight: 500; letter-spacing: -.025em; max-width: 26ch; }
.lede { font-size: 34px; line-height: 1.35; color: var(--ink2); max-width: 30ch; margin: 0; }
.body { font-size: 27px; line-height: 1.45; color: var(--ink2); max-width: 50ch; margin: 0; }
.body b, .lede b { color: var(--ink); font-weight: 600; }

.prompt { font-size: 30px; color: var(--blue); display: flex; align-items: center; gap: 14px; min-height: 44px; }
.prompt .pfx { color: var(--acc); }
.caret { width: 14px; height: 32px; background: var(--blue); animation: blink 1s steps(2) infinite; }
@keyframes blink { to { opacity: 0; } }

.team { display: flex; gap: 12px; flex-wrap: wrap; }
.chip { font-size: 19px; padding: 9px 16px; border: 1px solid var(--line2); border-radius: 999px; color: var(--ink2); }
.chip b { color: var(--acc); font-weight: 500; }

.timeline { display: grid; grid-template-columns: repeat(3,1fr); gap: 22px; }
.tl { border-top: 3px solid var(--line2); padding-top: 18px; display: grid; gap: 8px; font-size: 21px; color: var(--ink2); line-height: 1.35; }
.tl .yr { font-size: 30px; color: var(--acc); } .tl b { color: var(--ink); font-size: 24px; } .tl span b { color: var(--acc2); }
.callout { border-left: 5px solid var(--acc); background: rgba(242,169,59,.08); padding: 20px 26px; font-size: 27px; line-height: 1.4; border-radius: 0 16px 16px 0; }
.callout .mono { display: block; font-size: 16px; letter-spacing: .14em; margin-bottom: 6px; }
.callout.final { font-size: 30px; }

.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 44px; align-items: start; }
.list { margin: 0; padding: 0; list-style: none; display: grid; gap: 15px; font-size: 24px; color: var(--ink2); line-height: 1.35; }
.list li { padding-left: 26px; position: relative; } .list li::before { content: ""; position: absolute; left: 0; top: 14px; width: 10px; height: 10px; border-radius: 50%; background: var(--acc); }
.list b { color: var(--ink); font-weight: 600; }
.env { display: grid; gap: 16px; font-size: 21px; color: var(--ink2); line-height: 1.4; }
.env > div { display: grid; gap: 4px; } .env .mono { font-size: 14px; letter-spacing: .14em; } .env b { color: var(--ink); font-size: 23px; }
.flow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 17px; margin-top: 10px; }
.flow span { padding: 8px 14px; border: 1px solid var(--line2); border-radius: 10px; color: var(--ink2); background: var(--surface2); }
.flow i { color: var(--acc); font-style: normal; }

.colhead { font-size: 16px; letter-spacing: .16em; color: var(--acc); margin-bottom: 8px; }
.colhead.alt { color: var(--blue); }
.skill { display: grid; gap: 8px; font-size: 22px; color: var(--ink2); margin-bottom: 20px; }
.bar { height: 10px; background: var(--surface2); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--acc); transition: width 1.1s cubic-bezier(.2,.8,.2,1); }
.skill.alt .bar i { background: var(--blue); }
.frame.active .bar i { width: var(--w); }
.foot { font-size: 16px; color: var(--ink3); line-height: 1.45; margin-top: auto; }

.cards3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 20px; }
.cards3 > div { background: var(--surface2); border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px; display: grid; gap: 8px; font-size: 19px; line-height: 1.4; color: var(--ink2); align-content: start; }
.cards3 .mono { font-size: 14px; letter-spacing: .14em; } .cards3 b { color: var(--ink); font-size: 24px; } .cards3 i { color: var(--ink); }

.stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 18px; }
.stats > div { background: var(--surface2); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: grid; gap: 8px; font-size: 18px; color: var(--ink2); }
.stats .mono { font-size: 13px; letter-spacing: .14em; } .stats > div > b { font-family: var(--mono); font-size: 44px; color: var(--ink); letter-spacing: -.02em; font-weight: 500; } .stats span b { color: var(--acc2); }
.strip { display: grid; grid-template-columns: repeat(3,1fr); gap: 18px; border-top: 1px solid var(--line); padding-top: 22px; }
.strip > div { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; font-size: 20px; color: var(--ink2); line-height: 1.35; }
.strip b { font-family: var(--mono); font-size: 46px; color: var(--acc); font-weight: 500; letter-spacing: -.02em; }

.trio { display: grid; grid-template-columns: repeat(3,1fr); gap: 20px; }
.trio > div { display: grid; gap: 8px; font-size: 20px; color: var(--ink2); line-height: 1.35; border-top: 3px solid var(--acc); padding-top: 16px; }
.trio b { font-family: var(--mono); font-size: 72px; color: var(--ink); font-weight: 500; letter-spacing: -.03em; line-height: 1; }
.shift { display: grid; gap: 10px; font-size: 20px; }
.shift > div { display: grid; grid-template-columns: 1fr 40px 1.2fr; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.shift span { color: var(--ink3); } .shift i { color: var(--acc); font-style: normal; text-align: center; } .shift b { color: var(--ink); font-weight: 500; }

.plan { display: grid; grid-template-columns: repeat(2,1fr); gap: 18px; }
.plan > div { background: var(--surface2); border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px; display: grid; gap: 8px; font-size: 19px; line-height: 1.4; color: var(--ink2); align-content: start; }
.plan .mono { font-size: 14px; letter-spacing: .14em; } .plan b { color: var(--ink); font-size: 25px; } .plan i { color: var(--acc2); }

.takeaways { margin: 0; padding: 0 0 0 40px; display: grid; gap: 14px; font-size: 25px; line-height: 1.4; color: var(--ink2); }
.takeaways li::marker { color: var(--acc); font-family: var(--mono); } .takeaways b { color: var(--ink); font-weight: 600; }

/* ---------- frame 10: the reference dossier ---------- */
.dossier { display: grid; grid-template-columns: 1fr 1fr; gap: 0 40px; align-items: start; }
.ref-col { display: grid; align-content: start; }
.ref-col h5 {
  font-size: 13px; font-weight: 500; letter-spacing: .16em; color: var(--acc);
  margin: 0 0 10px; padding-bottom: 7px; border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
}
.ref-col h5 + .refs { margin-bottom: 22px; }
.ref-col h5 span { letter-spacing: 0; font-size: 12px; color: var(--ink3); text-transform: none; font-family: var(--serif); font-style: italic; }

.refs { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.ref {
  display: grid; grid-template-columns: 30px minmax(0,1fr) 62px; gap: 12px;
  padding: 9px 10px 9px 12px; border-left: 2px solid var(--line2); border-radius: 0 8px 8px 0;
  transition: background .15s, border-color .15s;
}
.ref:hover { background: rgba(243,239,230,.04); }
.ref[data-src] { cursor: default; }
.ref[data-src="wef"]       { border-left-color: var(--acc2); }
.ref[data-src="linkedin"]  { border-left-color: var(--ok); }
.ref[data-src="glassdoor"] { border-left-color: var(--acc); }
.ref[data-src="indeed"]    { border-left-color: var(--blue); }
.ref-n { font-size: 14px; color: var(--ink3); font-variant-numeric: tabular-nums; padding-top: 2px; }
.ref[data-src="wef"] .ref-n       { color: var(--acc2); }
.ref[data-src="linkedin"] .ref-n  { color: var(--ok); }
.ref[data-src="glassdoor"] .ref-n { color: var(--acc); }
.ref[data-src="indeed"] .ref-n    { color: var(--blue); }
.ref-b { font-size: 16px; line-height: 1.42; color: var(--ink2); font-family: var(--serif); min-width: 0; }
.ref-b b { color: var(--ink); font-weight: 600; }
.ref-b i { color: var(--ink); }
.ref-u { display: block; font-size: 12px; color: var(--ink3); word-break: break-all; margin-top: 2px; }
.ref-a { font-size: 11px; line-height: 1.3; color: var(--ink3); text-align: right; padding-top: 3px; }

/* --- arrival: each frame has its own move, so ten landings do not feel like one --- */
.r { opacity: 0; }
.frame[data-enter="rise"]  .r { transform: translateY(20px); }
.frame[data-enter="slide"] .r { transform: translateX(-34px); }
.frame[data-enter="punch"] .r { transform: scale(.93); }
.frame[data-enter="deal"]  .r { transform: translateY(34px) rotate(-1.4deg); transform-origin: 12% 100%; }
.frame[data-enter="blur"]  .r { transform: translateY(12px); filter: blur(12px); }
.frame[data-enter="wipe"]  .r { clip-path: inset(0 100% 0 0); transform: none; }

.frame.active .r { animation: reveal .7s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(360ms + var(--i) * 140ms); }
.frame[data-enter="punch"].active .r { animation-duration: .5s; animation-timing-function: cubic-bezier(.2,1.5,.35,1); }
.frame[data-enter="wipe"].active  .r { animation-duration: .95s; }
.frame[data-enter="deal"].active  .r { animation-duration: .78s; animation-delay: calc(300ms + var(--i) * 110ms); }
.frame[data-enter="blur"].active  .r { animation-duration: .8s; }
@keyframes reveal { to { opacity: 1; transform: none; filter: none; clip-path: inset(0 0 0 0); } }
.ov .r { opacity: 1; transform: none; filter: none; clip-path: none; animation: none; }
@media (prefers-reduced-motion: reduce) { .r { opacity: 1; transform: none; } .frame.active .r { animation: none; } .moving { transition: none; } .caret { animation: none; } .tok { animation: none; } }

/* ---------- on-screen UI ---------- */
.ui { position: fixed; z-index: 10; font-family: var(--mono); }
#top { top: 18px; left: 22px; right: 22px; display: flex; justify-content: space-between; align-items: center; gap: 14px; pointer-events: none; }
#top > * { pointer-events: auto; }
#brand { font-size: 12px; letter-spacing: .14em; color: var(--ink3); }
#speaker { font-size: 12px; color: var(--ink2); background: rgba(19,24,41,.8); border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px; backdrop-filter: blur(8px); }
#clock { font-size: 15px; color: var(--ink3); background: rgba(19,24,41,.8); border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px; cursor: pointer; backdrop-filter: blur(8px); font-variant-numeric: tabular-nums; }
#clock.run { color: var(--ink); border-color: var(--line2); } #clock.in { color: var(--ok); } #clock.over { color: var(--bad); }
#bottom { left: 22px; right: 22px; bottom: 18px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
#rail { display: flex; align-items: center; gap: 8px; background: rgba(19,24,41,.8); border: 1px solid var(--line); padding: 8px 12px; border-radius: 999px; backdrop-filter: blur(8px); }
.dot { width: 22px; height: 22px; border: 0; background: transparent; padding: 0; cursor: pointer; display: grid; place-items: center; }
.dot span { width: 8px; height: 8px; border-radius: 50%; background: var(--line2); transition: all .25s; }
.dot.done span { background: var(--ink3); } .dot.on span { background: var(--acc); width: 22px; border-radius: 999px; }
.rlabel { font-size: 12px; color: var(--ink2); margin-left: 6px; white-space: nowrap; }
#ctl { display: flex; gap: 8px; }
#ctl button { font: inherit; font-size: 12px; letter-spacing: .06em; color: var(--ink2); background: rgba(19,24,41,.8); border: 1px solid var(--line); padding: 8px 12px; border-radius: 999px; cursor: pointer; backdrop-filter: blur(8px); }
#ctl button:hover { color: var(--ink); border-color: var(--line2); }
#hint { left: 50%; transform: translateX(-50%); bottom: 72px; font-size: 12px; color: var(--ink3); transition: opacity .8s; pointer-events: none; }
#hint.fade { opacity: 0; }
#notes { left: 22px; bottom: 76px; max-width: 520px; font-family: var(--sans); font-size: 14px; line-height: 1.5; color: var(--ink2); background: rgba(19,24,41,.92); border: 1px solid var(--line2); border-left: 3px solid var(--acc); padding: 14px 18px; border-radius: 12px; display: none; backdrop-filter: blur(10px); }
body.notes #notes { display: block; }
@media (max-width: 700px) { .rlabel, #brand, #hint { display: none; } }

/* ---------- visuals layer ---------- */
.vis { position: relative; width: 100%; }
.vis > svg, .vis > canvas { display: block; width: 100%; height: 100%; }
.vis[data-vis-error]::after { content: "visual failed: " attr(data-vis-error); font-family: var(--mono); font-size: 13px; color: var(--bad); }
.vis-divergence { height: 400px; }

/* ---------- promptlab ---------- */
.vis-promptlab { height: 470px; }
.pl { display: grid; grid-template-columns: 1.35fr 1fr; gap: 20px; height: 100%; }
.pl-side, .pl-anat { background: #0A0E1A; border: 1px solid var(--line); border-radius: 16px;
  display: flex; flex-direction: column; overflow: hidden; transition: border-color .4s; }
.pl-side.bad  { border-color: rgba(255,122,107,.4); }
.pl-side.good { border-color: rgba(95,211,162,.45); }
.pl-head { font-size: 13px; letter-spacing: .16em; color: var(--ink3); padding: 12px 18px;
  border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 9px; transition: color .4s; }
.pl-head.bad  { color: var(--bad); } .pl-head.good { color: var(--ok); }
.pl-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pl-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; flex: 1; min-height: 0; }
.pl-line { font-size: 16px; line-height: 1.5; color: var(--blue); display: flex; gap: 8px; align-items: flex-start; }
.pl-pfx { color: var(--acc); flex: none; }
.pl-car { width: 9px; height: 19px; background: var(--blue); flex: none; animation: blink 1s steps(2) infinite; }
.pl-out { font-family: var(--serif); font-size: 17px; line-height: 1.5; color: var(--ink2); white-space: pre-wrap;
  border-left: 3px solid var(--line2); padding-left: 14px; opacity: 0; transition: opacity .3s; }
.pl-out.in { opacity: 1; }
.pl-verdict { font-family: var(--mono); font-size: 14px; padding: 0 18px; max-height: 0; overflow: hidden;
  transition: max-height .35s, padding .35s; color: var(--ink3); }
.pl-verdict.show { max-height: 80px; padding: 12px 18px; border-top: 1px solid var(--line); }
.pl-verdict.bad { color: var(--bad); } .pl-verdict.good { color: var(--ok); }
.pl-parts { padding: 14px 16px; display: grid; gap: 9px; align-content: start; }
.pl-part { display: grid; gap: 3px; padding: 9px 12px; border-radius: 10px; background: var(--surface2);
  border: 1px solid var(--line); opacity: .18; transform: translateX(10px); transition: opacity .45s, transform .45s, border-color .45s; }
.pl-part.on { opacity: 1; transform: none; border-color: rgba(95,211,162,.35); }
.pl-k { font-size: 11px; letter-spacing: .14em; color: var(--ok); }
.pl-v { font-size: 14px; line-height: 1.35; color: var(--ink2); }

/* ---------- provenance ---------- */
.vis-provenance { height: 340px; }
.vis-provenance .pv-head, .vis-provenance .pv-row, .vis-provenance .pv-src { pointer-events: none; }
.vis-provenance .pv-thread { fill: none; pointer-events: none; stroke-width: 1.5; stroke-opacity: .45;
  stroke-linecap: round; transition: stroke-opacity .2s ease, stroke-width .2s ease; }
.vis-provenance .pv-row, .vis-provenance .pv-src { transition: opacity .2s ease; }
.vis-provenance .pv-hit { fill: transparent; pointer-events: all; cursor: help; }
/* isolate one link: everything drops back, the answer to the question stays lit */
.vis-provenance.pv-lit .pv-thread { stroke-opacity: .12; }
.vis-provenance.pv-lit .pv-thread.on { stroke-opacity: 1; stroke-width: 2.5; }
.vis-provenance.pv-lit .pv-row, .vis-provenance.pv-lit .pv-src { opacity: .3; }
.vis-provenance.pv-lit .pv-row.on, .vis-provenance.pv-lit .pv-src.on { opacity: 1; }
/* While the entrance is running the rAF loop owns opacity frame by frame; the
   hover transition would only smear it. It comes back the moment we land. */
.vis-provenance.pv-arrive .pv-row, .vis-provenance.pv-arrive .pv-src { transition: none; }
@media (prefers-reduced-motion: reduce) {
  .vis-provenance .pv-thread, .vis-provenance .pv-row, .vis-provenance .pv-src { transition: none; }
}

/* ---------- tokenise (frame 1) ---------- */
.vis-tokenise { height: 150px; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
.vis-tokenise .tk-row { position: relative; display: flex; flex-wrap: wrap; gap: 10px; }
.vis-tokenise .tk { font-family: var(--mono); font-size: 22px; line-height: 1.2; letter-spacing: .02em;
  color: var(--ink2); padding: 8px 12px; border: 1px solid var(--line2); border-radius: 8px; white-space: pre;
  /* the 6% tint rides on top of surface2 as a flat image layer, so one rule
     carries both the base and the amber/blue alternation */
  background-color: var(--surface2); background-image: linear-gradient(var(--tint), var(--tint));
  opacity: 0; transform: translateY(10px);
  transition: opacity .32s cubic-bezier(.22,.8,.2,1), transform .32s cubic-bezier(.22,.8,.2,1); }
.vis-tokenise .tk.a { --tint: rgba(242,169,59,.06); }
.vis-tokenise .tk.b { --tint: rgba(138,164,255,.06); }
.vis-tokenise .tk-row.in .tk { opacity: 1; transform: none; }
.vis-tokenise .tk-sp { color: var(--ink3); }
.vis-tokenise .tk-head { position: absolute; left: 0; top: -6px; width: 1px; height: 100%;
  background: var(--acc); opacity: 0; pointer-events: none; }
.vis-tokenise .tk-foot { font-size: 14px; color: var(--ink3); }
@media (prefers-reduced-motion: reduce) {
  .vis-tokenise .tk { transition: none; }
  .vis-tokenise .tk-head { display: none; }
}

/* ---------- skillrank ---------- */
.vis-skillrank { height: 120px; }
/* Each column's top edge is a 1px rounded arc; the camera scales the world by
   fractional factors, so ask for precision instead of pixel snapping. */
.vis-skillrank .sr-cap { shape-rendering: geometricPrecision; }

/* ---------- comet (world layer, not a frame visual) ---------- */
/* The engine draws the route; this keeps it alive. One dash period is 14 + 18 =
   32 world units, so -32 per cycle loops seamlessly with no visible seam. */
.vis-comet-live { animation: vis-comet-drift 3s linear infinite; }
@keyframes vis-comet-drift { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -32; } }
/* Belt and braces — the module also declines to add the class when reduced. */

/* The comet owns no box: it lives in the world's path SVG, so it needs no sizing
   rule. This one exists only so nothing collapses oddly should the id ever be
   wired up as a [data-vis] host by mistake; `div.` keeps it off our own <g>. */

/* ---------- salaryrange ---------- */
.vis-salaryrange { height: 300px; }
/* Tracking on the mono caps: the row labels sit in a 260px gutter against a
   ruled plot, and letter-spaced small caps read as axis furniture rather than
   competing with the money figures on the bars. */

/* ---------- ribbons ---------- */

/* The whole graphic is one SVG of geometry with no interactive parts, and the
   frame itself is a click target in overview mode — keep hit-testing off it so
   a click anywhere on the roads still selects the frame. */

/* ---------- planscrub (frame 8) ---------- */

.ps { display: flex; flex-direction: column; gap: 14px; height: 100%; justify-content: center; }
